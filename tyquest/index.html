/* hero sheet */
function heatmapHTML() {
  const counts = {};
  S.tasks.forEach(t => { if (t.status === 'done' && t.completedAt) counts[t.completedAt] = (counts[t.completedAt] || 0) + 1; });
  const weeks = window.innerWidth > 560 ? 30 : 20;
  const end = new Date(); end.setHours(0, 0, 0, 0);
  const start = new Date(end); start.setDate(start.getDate() - (weeks * 7 - 1));
  start.setDate(start.getDate() - start.getDay());
  const cells = []; let total = 0;
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) { const k = dstr(d), c = counts[k] || 0; total += c; cells.push(`<i data-l="${Math.min(c, 4)}" title="${k}: ${c}"></i>`); }
  while (cells.length % 7) cells.push('<i class="pad"></i>');
  const cols = cells.length / 7;
  return `<div class="field"><div class="heat-cap"><span class="lbl">Last ${cols} weeks</span><span>${total} won</span></div><div class="heat" style="grid-template-columns:repeat(${cols},1fr)">${cells.join('')}</div></div>`;
}
function heroAvatar() {
  const c = document.createElement('canvas'); c.width = 12; c.height = 12; const x = c.getContext('2d');
  const rows = ['..hhhh..', '.hhhhhh.', '.hhssss.', '.hskssk.', '..sssss.', '..tttt..', '.stttts.', '..tttt..', '..b..b..', '..b..b..'];
  const pal = { h: '#8A5A33', s: '#F2C9A0', k: '#1A1020', t: '#4FAE6A', b: '#3E2A20' };
  rows.forEach((r, j) => [...r].forEach((ch, i) => { if (pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i + 2, j + 1, 1, 1); } }));
  return c.toDataURL();
}
function heroSheet(extra = {}) {
  const render = () => {
    const s = achStats();
    const sync = Sync.cfg
      ? `<div class="field"><span class="lbl">Sync room</span><div class="code">${esc(Sync.cfg.roomCode)}</div>${extra.created ? '' : ''}<div class="btns"><button class="btn" data-act="sync-now">Sync now</button><button class="btn danger" data-act="sync-off">Disconnect</button></div></div>`
      : `<div class="field"><span class="lbl">Sync between devices</span>
          <input class="inp" id="sy-url" placeholder="https://…firebaseio.com" value="${esc(extra.url || '')}" inputmode="url" autocapitalize="off" spellcheck="false">
          <input class="inp" id="sy-room" placeholder="Room code" value="${esc(extra.room || '')}" autocapitalize="characters" spellcheck="false">
          ${extra.err ? `<div class="err">${esc(extra.err)}</div>` : ''}
          <div class="btns"><button class="btn" data-act="sync-join">Join room</button><button class="btn" data-act="sync-new">New room</button></div></div>`;
    return `<div class="sheet-stack">
      <div class="hero-top"><img class="hero-av" src="${heroAvatar()}" alt=""><div style="min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start">
        <button class="hero-name" data-act="rename">${esc(S.name)}</button><span class="tag hot">Level ${level()} · ${S.xp % 100}/100 XP</span></div></div>
      <div class="stats">
        <div class="stat"><b>${s.done}</b><span>Quests won</span></div>
        <div class="stat"><b>${s.bosses}</b><span>Bosses felled</span></div>
        <div class="stat"><b style="color:var(--gold)">${S.totalGold}</b><span>Lifetime gold</span></div>
        <div class="stat"><b>${s.streak}</b><span>Best live streak</span></div>
      </div>
      ${heatmapHTML()}
      ${sync}
      <div class="btns"><button class="btn wide" data-act="mute">${Sound.muted ? 'Sound off' : 'Sound on'}</button></div>
    </div>`;
  };
  openSheet(render(), { refresh() { if (!$('#sy-url') && !$('#rn')) $('#sheet-body').innerHTML = render(); } });
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'tab': if (UI.tab !== el.dataset.v) { UI.tab = el.dataset.v; Sound.blip(380); renderView(); } break;
    case 'board': UI.board = el.dataset.v; Sound.blip(420); renderView(); break;
    case 'boards': boardsSheet(); break;
    case 'board-del': {
      const b = S.boards.find(x => x.id === id);
      confirmSheet(`Delete <strong>${esc(titleCase(b.name))}</strong>? Its quests move to General.`, 'Delete board', () => {
        commit(() => { S.tasks.forEach(t => { if (t.boardId === id) t.boardId = 'general'; }); S.boards = S.boards.filter(x => x.id !== id); if (UI.board === id) UI.board = 'all'; });
        Sound.err();
      });
      break;
    }
    case 'toggle-done': UI.showDone = !UI.showDone; renderView(); break;
    case 'advance': e.stopPropagation(); advance(id); break;
    case 'open': questDetail(id); Sound.blip(500); break;
    case 'step': toggleStep(id, +el.dataset.i); break;
    case 'd-advance': advance(id); { const t = S.tasks.find(x => x.id === id); if (!t || t.status === 'done') closeSheet(); } break;
    case 'd-strike': { const t = S.tasks.find(x => x.id === id); const i = t.subtasks.findIndex(s => !s.done); if (i >= 0) { Sound.slash(); toggleStep(id, i); } break; }
    case 'd-retreat': { const t = S.tasks.find(x => x.id === id); commit(() => { t.status = 'todo'; }); Sound.blip(260); break; }
    case 'd-reroll': { if (S.gold < 5) { Sound.err(); break; } const t = S.tasks.find(x => x.id === id); commit(() => { S.gold -= 5; t.dueDate = addDays(today(), 1); }); Sound.magic(); toast('Pushed to tomorrow  −5G'); break; }
    case 'd-edit': questForm(id); break;
    case 'd-delete': { const t = S.tasks.find(x => x.id === id); confirmSheet(`Delete <strong>${esc(t.text)}</strong>?`, 'Delete quest', () => { commit(() => { S.tasks = S.tasks.filter(x => x.id !== id); }); Sound.err(); }); break; }
    case 'seg': { const g = el.closest('.seg'); $$('button', g).forEach(b => b.setAttribute('aria-pressed', b === el)); Sound.blip(520);
      if (g.dataset.group === 'due') $('#qf-date').hidden = el.dataset.v !== 'pick';
      if (g.dataset.group === 'rep') $('#qf-every').hidden = el.dataset.v !== 'every';
      break; }
    case 'sub-add': { const wrap = $('#qf-subs'); wrap.insertAdjacentHTML('beforeend', UI.sheet.subRow({ id: uid('s'), text: '', done: false })); $('input', wrap.lastElementChild).focus(); break; }
    case 'sub-del': el.closest('.subrow').remove(); break;
    case 'fab': UI.tab === 'codex' ? entrySheet(null) : questForm(null); Sound.blip(600); break;
    case 'close-sheet': closeSheet(); break;
    case 'hero': heroSheet(); Sound.blip(500); break;
    case 'rename': {
      const box = el.parentElement;
      el.outerHTML = `<input class="inp" id="rn" value="${esc(S.name)}" maxlength="16" aria-label="Hero name" style="font-family:var(--f-pixel);font-size:12px">`;
      const inp = $('#rn'); inp.focus(); inp.select();
      const done = () => { const v = inp.value.trim().toUpperCase(); if (v && v !== S.name) commit(() => { S.name = v; }); heroSheet(); };
      inp.onkeydown = ev => { if (ev.key === 'Enter') inp.blur(); }; inp.onblur = done;
      void box; break;
    }
    case 'mute': Sound.muted = !Sound.muted; ls.set('tyquest_muted', Sound.muted ? '1' : '0'); el.textContent = Sound.muted ? 'Sound off' : 'Sound on'; Sound.blip(600); break;
    case 'sync-now': pull(); break;
    case 'sync-off': confirmSheet('Stop syncing this device? Your quests stay here.', 'Disconnect', () => { disconnectRoom(); setTimeout(() => heroSheet(), 340); }); break;
    case 'sync-join': case 'sync-new': {
      const url = $('#sy-url').value.trim(), room = $('#sy-room').value.trim();
      if (!/^https:\/\//.test(url)) { heroSheet({ url, room, err: 'Paste the Database URL from Firebase (starts with https://).' }); break; }
      if (act === 'sync-join' && !room) { heroSheet({ url, room, err: 'Enter the room code from the other device.' }); break; }
      el.textContent = '…';
      try {
        if (act === 'sync-join') { await connectRoom(url, room); toast('Joined room ' + Sync.cfg.roomCode); }
        else { const code = await createRoom(url); toast('Room ' + code + ' created'); }
        heroSheet();
      } catch { setSync('error'); heroSheet({ url, room, err: act === 'sync-join' ? 'Could not connect. Check the URL and room code.' : 'Could not create a room. Check the URL and that the database rules allow read/write.' }); }
      break;
    }
    case 'libcat': UI.libCat = el.dataset.v; Sound.blip(420); renderView(); break;
    case 'libcat-new': catSheet(); break;
    case 'libcat-del': {
      const c = S.libCats.find(x => x.id === UI.libCat); if (!c) break;
      const n = S.libItems.filter(i => i.categoryId === c.id).length;
      confirmSheet(`Delete <strong>${esc(titleCase(c.name))}</strong>${n ? ` and its ${n} ${n === 1 ? 'entry' : 'entries'}` : ''}?`, 'Delete list', () => { commit(() => { S.libItems = S.libItems.filter(i => i.categoryId !== c.id); S.libCats = S.libCats.filter(x => x.id !== c.id); UI.libCat = 'all'; }); Sound.err(); });
      break;
    }
    case 'marker': { const c = S.libCats.find(x => x.id === UI.libCat); if (c) { commit(() => { c.markerStyle = MARKERS[(MARKERS.indexOf(c.markerStyle || 'check') + 1) % MARKERS.length]; }); Sound.blip(500); } break; }
    case 'lib-toggle': { const i = S.libItems.find(x => x.id === id); if (i) { commit(() => { i.done = !i.done; }); Sound.blip(650); } break; }
    case 'lib-open': entrySheet(id); break;
    case 'skin': {
      const v = el.dataset.v, th = THEMES[v];
      if (S.unlocked.includes(v)) { if (S.theme !== v) { commit(() => { S.theme = v; }); Sound.magic(); } }
      else if (S.gold >= th.cost) { commit(() => { S.gold -= th.cost; S.unlocked = [...S.unlocked, v]; S.theme = v; }); Sound.coin(); toast(`${th.name} unlocked`, 'gold'); }
      else { Sound.err(); toast(`Need ${th.cost - S.gold} more gold`); }
      break;
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.sheet) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.q[data-act="open"]')) { e.preventDefault(); questDetail(e.target.dataset.id); }
});
// swipe the sheet down to close
(() => {
  const sh = $('#sheet'); let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { if (sh.scrollTop > 0 || e.target.closest('input,textarea')) { y0 = null; return; } y0 = e.touches[0].clientY; dy = 0; }, { passive: true });
  sh.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = dy ? `translateY(${dy}px)` : ''; sh.style.transition = 'none'; }, { passive: true });
  sh.addEventListener('touchend', () => { sh.style.transition = ''; sh.style.transform = ''; if (y0 != null && dy > 90) closeSheet(); y0 = null; });
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { renderView(); if (Sync.cfg) pull(); } });

/* ---------- boot ---------- */
(async () => {
  await loadLocal();
  renderAll();
  Scene.start();
  if (Sync.cfg) startStream();
  checkAchievements();
})();
})();
</script>

</body>
</html>
