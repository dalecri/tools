    <style>
        body {
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .pixel-box {
            border: 4px solid var(--app-border);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.25);
            border-radius: 4px;
        }

        .pixel-box-sm {
            border: 2px solid var(--app-border);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.25);
            border-radius: 2px;
        }

        .font-arcade { font-family: 'Silkscreen', cursive, system-ui, sans-serif, Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji; }
        .font-readable { font-family: 'Space Mono', 'Courier New', monospace; }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.2s ease-out forwards; }

        @keyframes flicker {
            0%, 100% { opacity: 1; transform: scale(1); }
            45% { opacity: 0.85; transform: scale(0.94); }
            50% { opacity: 1; transform: scale(1.08); }
            55% { opacity: 0.92; transform: scale(0.97); }
        }
        .animate-flicker { animation: flicker 1.8s ease-in-out infinite; }

        @keyframes shutterDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }
        @keyframes shutterUp {
            from { transform: translateY(0); }
            to { transform: translateY(-100%); }
        }
        .animate-shutter-down { animation: shutterDown 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .animate-shutter-up { animation: shutterUp 0.35s cubic-bezier(0.5, 0, 0.75, 0) forwards; }

        @keyframes slideUpIn {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        @keyframes slideDownOut {
            from { transform: translateY(0); }
            to { transform: translateY(100%); }
        }
        .animate-slide-up-in { animation: slideUpIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .animate-slide-down-out { animation: slideDownOut 0.3s cubic-bezier(0.5, 0, 0.75, 0) forwards; }

        @keyframes slideInLeft {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }
        .animate-slide-in-left { animation: slideInLeft 0.25s ease-out forwards; }

        @keyframes holdPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.55); }
            50% { transform: scale(1.03); box-shadow: 0 0 0 6px rgba(255, 215, 0, 0); }
        }
        .animate-hold-pulse { animation: holdPulse 0.5s ease-in-out infinite; }

        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 24px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 12px); }
        
        input[type="date"] {
            box-sizing: border-box;
            appearance: none;
            -webkit-appearance: none;
        }
    </style>
</head>

        const { useState, useEffect, useMemo, useRef } = React;

        class SoundManager {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            playTone(freq, type, duration, vol = 0.1) {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }
            playBlip(freq = 400) { this.playTone(freq, 'square', 0.1, 0.05); }
            playCoin() {
                this.playTone(987.77, 'square', 0.1, 0.05);
                setTimeout(() => this.playTone(1318.51, 'square', 0.3, 0.05), 100);
            }
            playMagic() {
                this.playTone(400, 'sine', 0.1, 0.05);
                setTimeout(() => this.playTone(600, 'sine', 0.1, 0.05), 50);
                setTimeout(() => this.playTone(800, 'sine', 0.2, 0.05), 100);
            }
            playError() { this.playTone(150, 'sawtooth', 0.2, 0.05); }
        }

        const DB_NAME = 'TyQuestDB';
        const STORE_NAME = 'appData';

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        };

        const saveToDB = async (key, data) => {
            try {
                const db = await initDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(data, key);
            } catch (e) { console.error('IDB Save Error:', e); }
        };

        const loadFromDB = async (key) => {
            try {
                const db = await initDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const req = tx.objectStore(STORE_NAME).get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            } catch (e) { return null; }
        };

        const getTodayStr = () => new Date().toISOString().split('T')[0];
        const getTomorrowStr = () => {
            const d = new Date();
            d.setDate(d.getDate() + 1);
            return d.toISOString().split('T')[0];
        };
        const addDays = (dateStr, days) => {
            const d = new Date(dateStr);
            d.setUTCDate(d.getUTCDate() + days);
            return d.toISOString().split('T')[0];
        };

        // Reward scales with how much a quest actually involves — a Boss quest always pays the
        // top rate; otherwise more subtasks means more work means a bigger payout.
        const calculateTaskReward = (task) => {
            if (task.isBoss) return { xp: 100, gold: 25 };
            const subtaskCount = (task.subtasks || []).length;
            if (subtaskCount >= 4) return { xp: 90, gold: 20 };
            if (subtaskCount >= 2) return { xp: 70, gold: 15 };
            return { xp: 50, gold: 10 };
        };

        // --- Firebase Realtime Database sync (no email account needed on Tyler's end — just the
        // Database URL + a shared Room Code that both devices use). Uses plain REST + Server-Sent
        // Events so no Firebase SDK/build step is needed; the database's rules must allow open
        // read/write (fine for non-sensitive data like a household task list).
        const SYNC_CONFIG_KEY = 'tyquest_sync_config'; // holds { databaseURL, roomCode }

        const loadSyncConfig = () => {
            try {
                const raw = localStorage.getItem(SYNC_CONFIG_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        };

        const saveSyncConfig = (config) => {
            try {
                if (config) localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(config));
                else localStorage.removeItem(SYNC_CONFIG_KEY);
            } catch (e) { /* ignore */ }
        };

        // All sync calls go through this so a slow/dead connection times out fast instead of hanging —
        // the app already has your data locally (IndexedDB), sync is a background bonus, never a blocker.
        const fetchWithTimeout = (url, options = {}, timeoutMs = 6000) => {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
        };

        const firebaseNodeUrl = (config) => `${config.databaseURL.replace(/\/$/, '')}/tyquest/${encodeURIComponent(config.roomCode)}.json`;

        const firebaseFetch = async (config) => {
            const res = await fetchWithTimeout(firebaseNodeUrl(config));
            if (!res.ok) throw new Error('Fetch failed: ' + res.status);
            return res.json(); // null if this room has no data saved yet
        };

        const firebasePush = async (config, snapshot) => {

                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(snapshot)
            });
            if (!res.ok) throw new Error('Push failed: ' + res.status);

        function App() {

            const [nameDraft, setNameDraft] = useState('');
            
            const [themeKey, setThemeKey] = useState('snes16bit');
            const [unlockedThemes, setUnlockedThemes] = useState(['snes16bit']);

            const [isNavVisible, setIsNavVisible] = useState(true);

            // Tavern & Activity are full-screen overlays now, separate from the main board/list/archive tabs
            const [showTavern, setShowTavern] = useState(false);
            const [showEncyclopediaNav, setShowEncyclopediaNav] = useState(false);
            const [tavernClosing, setTavernClosing] = useState(false);
            const [showActivity, setShowActivity] = useState(false);
            const [activityClosing, setActivityClosing] = useState(false);

            const openTavern = () => { setTavernClosing(false); setShowTavern(true); sound.playMagic(); };
            const closeTavern = () => { setTavernClosing(true); sound.playBlip(300); };
            const openActivity = () => { setActivityClosing(false); setShowActivity(true); sound.playBlip(500); };
            const closeActivity = () => { setActivityClosing(true); sound.playBlip(300); };
            const toggleActivity = () => { if (showActivity) closeActivity(); else openActivity(); };
            
            const [isAddingQuest, setIsAddingQuest] = useState(false);
            const [editingTaskId, setEditingTaskId] = useState(null);
            const [editForm, setEditForm] = useState(null); // { text, dueDate, subtasks, boardId, recurrenceType, customValue, customUnit, isBoss }
            const [showSubtasksInput, setShowSubtasksInput] = useState(false);
            const [questDateChoice, setQuestDateChoice] = useState(null); // null | 'today' | 'tomorrow' | 'custom'
            const [questDateValue, setQuestDateValue] = useState(''); // empty means no deadline
            const [questRecurrenceType, setQuestRecurrenceType] = useState(null); // null | 'daily' | 'weekly' | 'custom'
            const [questCustomValue, setQuestCustomValue] = useState(2);

            // Turns a repeat-picker choice into the { type, intervalDays } shape stored on the task —

            const buildRecurrenceObj = (type, customValue, customUnit) => {
                if (!type) return null;
                if (type === 'daily') return { type: 'daily', intervalDays: 1 };
                if (type === 'weekly') return { type: 'weekly', intervalDays: 7 };
                const n = Math.max(1, parseInt(customValue, 10) || 1);
                return { type: 'custom', value: n, unit: customUnit, intervalDays: customUnit === 'weeks' ? n * 7 : n };
            };
            const buildRecurrence = () => buildRecurrenceObj(questRecurrenceType, questCustomValue, questCustomUnit);
            
            const [isManagingBoard, setIsManagingBoard] = useState(false);
            const [isAddingLibCat, setIsAddingLibCat] = useState(false);
            
            const [focusTaskId, setFocusTaskId] = useState(null);
            
            // Delete Dialog State
            const [deleteConfirm, setDeleteConfirm] = useState({ show: false, type: '', id: '', name: '' });

            // Custom pointer-based drag state (replaces native HTML5 DnD, which is unreliable on touch)
            const [dragState, setDragState] = useState(null); // { taskId, x, y, offsetX, offsetY, width, hoverColId }
            const [holdingTaskId, setHoldingTaskId] = useState(null); // card mid-hold, pulsing, before the drag actually engages
            const dragCandidateRef = useRef(null); // pending drag before the hold threshold clears
            const dragEdgeStepTimeRef = useRef(0); // timestamp of the last edge-triggered column step, gates how fast it can advance
            const justDraggedRef = useRef(false); // true briefly after a hold-drag engages, to suppress a stray click-to-edit
            const activityContainerRef = useRef(null);
            const dragTimerRef = useRef(null);

            const [syncConfig, setSyncConfig] = useState(null); // { databaseURL, roomCode }
            const [syncStatus, setSyncStatus] = useState('offline'); // offline | syncing | synced | error
            const [syncFormUrl, setSyncFormUrl] = useState('');
            const [syncFormRoom, setSyncFormRoom] = useState('');
            const [syncError, setSyncError] = useState('');
            const [justCreatedRoom, setJustCreatedRoom] = useState(null);
            const pushTimerRef = useRef(null);
            const pendingPushRef = useRef(false);
            const isRemoteApplyRef = useRef(false);
            const hasSyncedOnceRef = useRef(false);
            const eventSourceRef = useRef(null);

            // Level calculation
            useEffect(() => {

            // Data Loading
            useEffect(() => {

                    const savedTasks = await loadFromDB('tq_tasks');
                    const savedBoards = await loadFromDB('tq_boards');
                    const savedLibCats = await loadFromDB('tq_libCats');
                    const savedLibItems = await loadFromDB('tq_libItems');
                    
                    const savedXp = await loadFromDB('tq_xp');
                    const savedGold = await loadFromDB('tq_gold');
                    const savedTotalGoldEarned = await loadFromDB('tq_total_gold_earned');
                    const savedCharacterName = await loadFromDB('tq_character_name');

                    if (savedLibCats && savedLibCats.length > 0) setLibraryCategories(savedLibCats); else setLibraryCategories(initialLibraryCategories);

            }, []);

            const applySnapshotToState = (snap) => {
                if (!snap) return;
                if (snap.tasks) setTasks(snap.tasks);
                if (snap.boards) setBoards(snap.boards);
                if (snap.libraryCategories) setLibraryCategories(snap.libraryCategories);
                if (snap.libraryItems) setLibraryItems(snap.libraryItems);
                if (typeof snap.xp === 'number') setXp(snap.xp);
                if (typeof snap.gold === 'number') setGold(snap.gold);
                if (typeof snap.totalGoldEarned === 'number') setTotalGoldEarned(snap.totalGoldEarned);
                if (snap.characterName) setCharacterName(snap.characterName);
                if (snap.themeKey) setThemeKey(snap.themeKey);
                if (snap.unlockedThemes) setUnlockedThemes(snap.unlockedThemes);
            };

            const pullNow = async (cfgOverride) => {
                const cfg = cfgOverride || syncConfig;
                if (!cfg || pendingPushRef.current) return;
                try {
                    setSyncStatus('syncing');
                    const snap = await firebaseFetch(cfg);
                    isRemoteApplyRef.current = true;
                    if (snap) applySnapshotToState(snap);
                    hasSyncedOnceRef.current = true;
                    setSyncStatus('synced');
                } catch (e) {
                    setSyncStatus('error');
                }
            };

            // Live sync via Server-Sent Events — Firebase Realtime Database streams changes to
            // this exact URL the moment either device writes, so both apps stay in sync without
            // any polling. Falls back to an initial one-shot fetch as a safety net.
            useEffect(() => {
                if (!syncConfig || !isDataLoaded) return;

                pullNow();

                const es = new EventSource(firebaseNodeUrl(syncConfig));
                eventSourceRef.current = es;

                const handleStreamEvent = (e) => {
                    if (pendingPushRef.current) return; // don't let an incoming update clobber an unsaved local edit
                    try {
                        const { data } = JSON.parse(e.data);
                        if (!data) return;
                        isRemoteApplyRef.current = true;
                        applySnapshotToState(data);
                        hasSyncedOnceRef.current = true;
                        setSyncStatus('synced');
                    } catch (err) { /* ignore malformed event */ }
                };

                es.addEventListener('put', handleStreamEvent);
                es.addEventListener('patch', handleStreamEvent);
                es.onerror = () => setSyncStatus('error'); // EventSource retries connecting on its own

                return () => { es.close(); eventSourceRef.current = null; };
            }, [syncConfig, isDataLoaded]);

            const connectToRoom = async (databaseURL, roomCode) => {
                setSyncError('');
                setSyncStatus('syncing');
                try {
                    const cfg = { databaseURL: databaseURL.trim().replace(/\/$/, ''), roomCode: roomCode.trim() };
                    const snap = await firebaseFetch(cfg);
                    isRemoteApplyRef.current = true;
                    if (snap) applySnapshotToState(snap);
                    hasSyncedOnceRef.current = true;
                    saveSyncConfig(cfg);
                    setSyncConfig(cfg);
                    setSyncStatus('synced');
                    setShowStatsModal(false);
                } catch (e) {
                    setSyncError('Could not connect — check the Database URL and Room Code.');
                    setSyncStatus('error');
                }
            };

            const createNewRoom = async (databaseURL) => {
                setSyncError('');
                setSyncStatus('syncing');
                try {
                    const url = databaseURL.trim().replace(/\/$/, '');
                    const roomCode = generateRoomCode();
                    const cfg = { databaseURL: url, roomCode };
                    const snapshot = { tasks, boards, libraryCategories, libraryItems, xp, gold, totalGoldEarned, characterName, themeKey, unlockedThemes };
                    await firebasePush(cfg, snapshot);
                    hasSyncedOnceRef.current = true;
                    saveSyncConfig(cfg);
                    setSyncConfig(cfg);
                    setSyncStatus('synced');
                    setJustCreatedRoom(roomCode);
                } catch (e) {
                    setSyncError('Could not create a sync room — check the Database URL and that its rules allow read/write.');
                    setSyncStatus('error');
                }
            };

            const disconnectSync = () => {
                if (eventSourceRef.current) { eventSourceRef.current.close(); eventSourceRef.current = null; }
                saveSyncConfig(null);
                setSyncConfig(null);
                setJustCreatedRoom(null);
                hasSyncedOnceRef.current = false;
                setSyncStatus('offline');
            };

            // Data Saving
            useEffect(() => {
                if (!isDataLoaded) return;
                saveToDB('tq_tasks', tasks);
                saveToDB('tq_boards', boards);
                saveToDB('tq_libCats', libraryCategories);
                saveToDB('tq_libItems', libraryItems);
                saveToDB('tq_xp', xp.toString());
                saveToDB('tq_gold', gold.toString());
                saveToDB('tq_total_gold_earned', totalGoldEarned.toString());
                saveToDB('tq_character_name', characterName);
                saveToDB('tq_theme', themeKey);
                saveToDB('tq_unlocked_themes', unlockedThemes);

                if (!syncConfig || !hasSyncedOnceRef.current) return;
                if (isRemoteApplyRef.current) { isRemoteApplyRef.current = false; return; }

                pendingPushRef.current = true;
                clearTimeout(pushTimerRef.current);
                pushTimerRef.current = setTimeout(async () => {
                    try {
                        setSyncStatus('syncing');
                        await firebasePush(syncConfig, { tasks, boards, libraryCategories, libraryItems, xp, gold, totalGoldEarned, characterName, themeKey, unlockedThemes });
                        setSyncStatus('synced');
                    } catch (e) {
                        setSyncStatus('error');
                    } finally {
                        pendingPushRef.current = false;
                    }
                }, 1500);
            }, [tasks, boards, libraryCategories, libraryItems, xp, gold, totalGoldEarned, characterName, themeKey, unlockedThemes, isDataLoaded, syncConfig]);

            const activeTheme = RETRO_THEMES[themeKey] || RETRO_THEMES.snes16bit;

            const triggerConfetti = () => {

                const bursts = 7;

                for (let i = 0; i < bursts; i++) {
                    window.confetti({
                        particleCount: 9,
                        angle: 270,
                        spread: 60,
                        startVelocity: 9,
                        gravity: 0.55,
                        drift: (Math.random() - 0.5) * 2,
                        ticks: 220,
                        origin: { x: (i + 0.5) / bursts, y: -0.05 },

                    });

            };

            const handleAddTask = (text, date, boardId, subtasksArr, recurrence, isBoss) => {

            const openEditTask = (task) => {

                    isBoss: !!task.isBoss

                const recurrence = buildRecurrenceObj(editForm.recurrenceType, editForm.customValue, editForm.customUnit);
                const resolvedBoardId = editForm.boardId === 'all' ? 'general' : editForm.boardId;

                setTasks(prev => prev.map(t => t.id === editingTaskId ? {
                    ...t,
                    text,
                    dueDate: editForm.dueDate || null,
                    subtasks: editForm.subtasks.filter(s => s.text && s.text.trim()).map(s => ({ ...s, text: s.text.trim() })),
                    boardId: resolvedBoardId,
                    recurrence,
                    isBoss: editForm.isBoss
                } : t));

                sound.playBlip(600);
                if (resolvedBoardId && resolvedBoardId !== 'general') setActiveBoardId(resolvedBoardId);
                closeEditTask();
            };

            // Shared by the checkbox toggle, the boss-defeat screen, and drag-to-Victory —
            // marks a task done, pays out XP/Gold (scaled to difficulty + streak), and spawns
            // the next occurrence if it repeats.
            const completeTask = (task) => {
                if (!task || task.status === 'done') return;

                const reward = calculateTaskReward(task);

                // On-time completion extends the streak; finishing it late (after its due date) breaks it.
                // Computed up front (not inside the setTasks updater) since setXp/setGold below need it now.
                let newStreak = 0;
                let streakBonusXp = 0;
                let streakBonusGold = 0;
                if (task.recurrence) {
                    const completedOnTime = !task.dueDate || getTodayStr() <= task.dueDate;
                    newStreak = completedOnTime ? (task.streak || 0) + 1 : 1;
                    streakBonusXp = Math.min(newStreak * 2, 50);
                    streakBonusGold = Math.min(newStreak, 25);
                }

                setTasks(prevTasks => {
                    const updated = prevTasks.map(t => t.id === task.id ? { ...t, status: 'done', completedAt: getTodayStr() } : t);
                    if (!task.recurrence) return updated;

                    const nextDue = addDays(getTodayStr(), task.recurrence.intervalDays);
                    const clone = {
                        ...task,
                        id: Date.now().toString() + '_r',
                        status: 'todo',
                        completedAt: null,
                        dueDate: nextDue,
                        streak: newStreak,
                        subtasks: (task.subtasks || []).map(s => ({ ...s, done: false }))
                    };
                    return [clone, ...updated];
                });

                sound.playCoin();
                triggerConfetti();
                setXp(prev => prev + reward.xp + streakBonusXp);
                setGold(prev => prev + reward.gold + streakBonusGold);
                setTotalGoldEarned(prev => prev + reward.gold + streakBonusGold);

                if (focusTaskId === task.id) setFocusTaskId(null);
            };

            const handleToggleTaskStatus = (task) => {
                if (task.status === 'done') return;

                if (task.status === 'todo') {
                    setTasks(tasks.map(t => t.id === task.id ? { ...t, status: 'doing' } : t));
                    sound.playBlip(300);
                } else if (task.status === 'doing') {
                    completeTask(task);
                }
            };

            const handleDefeatBoss = (task) => completeTask(task);

            const handleToggleSubtask = (taskId, subIdx) => {
                setTasks(tasks.map(t => {
                    if (t.id !== taskId || t.status === 'done') return t;
                    const newSubs = [...t.subtasks];
                    const wasDone = newSubs[subIdx].done;
                    newSubs[subIdx].done = !wasDone;
                    
                    if (!wasDone) {
                        sound.playBlip(700);
                        setXp(prev => prev + 5);
                        setGold(prev => prev + 1);
                        setTotalGoldEarned(prev => prev + 1);
                    }
                    
                    return { ...t, subtasks: newSubs };
                }));
            };

            const handleDeleteTask = (id) => {
                sound.playError();
                setTasks(tasks.filter(t => t.id !== id));
            };

            const handleRerollTask = (id) => {
                if (gold < 5) {
                    sound.playError();
                    alert("Not enough Gold!");
                    return;
                }
                setGold(prev => prev - 5);
                sound.playMagic();
                setTasks(tasks.map(t => t.id === id ? { ...t, dueDate: getTomorrowStr() } : t));
            };

            const moveTaskToStatus = (task, nextStatus) => {
                if (!task || task.status === nextStatus || task.status === 'done') return;

                if (nextStatus === 'done') {
                    completeTask(task);
                    return;
                }

                setTasks(prevTasks => prevTasks.map(t => t.id === task.id ? { ...t, status: nextStatus } : t));
                sound.playBlip(300);
            };

            // Hold-to-drag: works the same for mouse and touch via the Pointer Events API.
            // A short hold-and-still window disambiguates "starting a drag" from "scrolling the column".
            const handleCardPointerDown = (e, task) => {
                if (task.status === 'done') return;
                if (e.pointerType === 'mouse' && e.button !== 0) return;

                const rect = e.currentTarget.getBoundingClientRect();
                const candidate = {
                    taskId: task.id,
                    startX: e.clientX,
                    startY: e.clientY,
                    offsetX: e.clientX - rect.left,
                    offsetY: e.clientY - rect.top,
                    width: rect.width,
                    sourceStatus: task.status
                };
                dragCandidateRef.current = candidate;
                setHoldingTaskId(task.id);

                clearTimeout(dragTimerRef.current);
                dragTimerRef.current = setTimeout(() => {
                    if (dragCandidateRef.current !== candidate) return;
                    setDragState({ ...candidate, x: candidate.startX, y: candidate.startY, hoverColId: candidate.sourceStatus });
                    justDraggedRef.current = true;
                    setHoldingTaskId(null); // drag is live now — the ghost/dim treatment takes over from here
                    if (navigator.vibrate) navigator.vibrate(10);
                }, 260);
            };

            // Window-level listeners drive the drag once it's live (or cancel the candidate on early scroll movement)
            useEffect(() => {
                const handleMove = (e) => {
                    const candidate = dragCandidateRef.current;
                    if (!candidate) return;

                    if (!dragState) {
                        const dx = Math.abs(e.clientX - candidate.startX);
                        const dy = Math.abs(e.clientY - candidate.startY);
                        if (dx > 8 || dy > 8) {
                            clearTimeout(dragTimerRef.current);
                            dragCandidateRef.current = null;
                            setHoldingTaskId(null);
                        }
                        return;
                    }

                    e.preventDefault();

                    const order = ['todo', 'doing', 'done'];
                    const baseColId = dragState.hoverColId || dragState.sourceStatus;
                    const currentIdx = order.indexOf(baseColId);
                    const EDGE_ZONE = 60; // px from the screen edge that counts as "aim for the next column"
                    const EDGE_STEP_COOLDOWN = 500; // ms to hold at the edge before it advances another column

                    const inLeftEdge = e.clientX <= EDGE_ZONE && currentIdx > 0;
                    const inRightEdge = e.clientX >= window.innerWidth - EDGE_ZONE && currentIdx !== -1 && currentIdx < order.length - 1;

                    let targetColId;
                    if (inLeftEdge || inRightEdge) {
                        const now = Date.now();
                        if (now - dragEdgeStepTimeRef.current > EDGE_STEP_COOLDOWN) {
                            dragEdgeStepTimeRef.current = now;
                            targetColId = inLeftEdge ? order[currentIdx - 1] : order[currentIdx + 1];
                            document.querySelector(`[data-colid="${targetColId}"]`)?.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                        } else {
                            targetColId = baseColId; // still cooling down — hold here, don't skip ahead
                        }
                    } else {
                        dragEdgeStepTimeRef.current = 0; // reset so the next edge approach can act right away
                        const el = document.elementFromPoint(e.clientX, e.clientY);
                        const colEl = el && el.closest('[data-colid]');
                        targetColId = colEl ? colEl.dataset.colid : baseColId;
                    }

                    setDragState(prev => prev ? { ...prev, x: e.clientX, y: e.clientY, hoverColId: targetColId || prev.hoverColId } : prev);
                };

                const handleUp = () => {
                    clearTimeout(dragTimerRef.current);
                    dragEdgeStepTimeRef.current = 0;
                    setHoldingTaskId(null);
                    setDragState(prev => {
                        if (prev) {
                            const task = tasks.find(t => t.id === prev.taskId);
                            if (task && prev.hoverColId) moveTaskToStatus(task, prev.hoverColId);
                        }
                        return null;
                    });
                    dragCandidateRef.current = null;
                    if (justDraggedRef.current) setTimeout(() => { justDraggedRef.current = false; }, 50);
                };

                window.addEventListener('pointermove', handleMove, { passive: false });
                window.addEventListener('pointerup', handleUp);
                window.addEventListener('pointercancel', handleUp);
                return () => {
                    window.removeEventListener('pointermove', handleMove);
                    window.removeEventListener('pointerup', handleUp);
                    window.removeEventListener('pointercancel', handleUp);
                };
            }, [dragState, tasks]);

            const handleBuyTheme = (themeId, cost) => {

                }
            };

            const handleDeleteBoard = (boardId) => {
                if (boardId === 'all') return;
                setTasks(tasks.map(t => t.boardId === boardId ? { ...t, boardId: 'general' } : t));
                setBoards(boards.filter(b => b.id !== boardId));
                setActiveBoardId('all');
                sound.playError();
            };

            const saveNoteEntry = () => {
                const title = noteTitle.trim();
                if (!title) return;
                const newItem = {
                    id: 'l_' + Date.now(),
                    title,
                    description: noteDescription.trim().slice(0, 350),

                    done: false
                };

                sound.playBlip(600);
                setShowNoteSheet(false);
            };

            const handleToggleLibraryItem = (itemId) => {
                setLibraryItems(libraryItems.map(i => i.id === itemId ? { ...i, done: !i.done } : i));
                sound.playBlip(650);
            };

            const cycleCategoryMarkerStyle = (catId) => {
                setLibraryCategories(prev => prev.map(c => {
                    if (c.id !== catId) return c;
                    const currentIdx = MARKER_STYLES.indexOf(c.markerStyle || 'check');
                    return { ...c, markerStyle: MARKER_STYLES[(currentIdx + 1) % MARKER_STYLES.length] };
                }));
                sound.playBlip(500);
            };

            const renderLibraryMarker = (item, cat) => {
                const style = cat?.markerStyle || 'check';
                const base = "flex-shrink-0 active:scale-90";
                if (style === 'none') return null;
                if (style === 'number') {
                    const itemsInCat = libraryItems.filter(i => i.categoryId === item.categoryId);

                        <button
                            onClick={() => handleToggleLibraryItem(item.id)}
                            className={`${base} w-5 h-5 pixel-box-sm flex items-center justify-center text-[9px] font-arcade ${item.done ? 'bg-green-500 text-white' : 'bg-white text-black'}`}
                        >
                            {idx}
                        </button>
                    );
                }
                if (style === 'emoji') {
                    return (
                        <button
                            onClick={() => handleToggleLibraryItem(item.id)}
                            className={`${base} text-base ${item.done ? '' : 'grayscale opacity-30'}`}
                        >
                            ⭐
                        </button>
                    );
                }
                return (
                    <button 
                        onClick={() => handleToggleLibraryItem(item.id)}
                        className={`${base} w-5 h-5 pixel-box-sm flex items-center justify-center text-xs ${item.done ? 'bg-green-600 text-white font-bold' : 'bg-white'}`}
                    >
                        {item.done ? '✓' : ''}
                    </button>
                );
            };

            const handleDeleteLibraryItem = (id) => {
                setLibraryItems(libraryItems.filter(i => i.id !== id));
                sound.playError();
            };

            const openLibFieldEdit = (item, field) => {
                setEditingLibField({ itemId: item.id, field });
                setLibFieldDraft(field === 'title' ? (item.title || item.text || '') : (item.description || ''));
            };

            const saveLibFieldEdit = () => {
                if (!editingLibField) return;
                const { itemId, field } = editingLibField;
                const value = field === 'description' ? libFieldDraft.trim().slice(0, 350) : libFieldDraft.trim();
                if (field === 'title' && !value) { setEditingLibField(null); return; } // titles can't be blanked out
                setLibraryItems(prev => prev.map(i => i.id === itemId ? { ...i, [field]: value } : i));
                setEditingLibField(null);
            };

            const handleDeleteLibCategory = (id) => {
                if(id === 'all') return;
                setLibraryCategories(libraryCategories.filter(c => c.id !== id));
                setLibraryItems(libraryItems.filter(i => i.categoryId !== id));
                setActiveLibCat('all');
                sound.playError();
            };

            const executeDelete = () => {
                if (deleteConfirm.type === 'board') {
                    handleDeleteBoard(deleteConfirm.id);
                } else if (deleteConfirm.type === 'libCat') {
                    handleDeleteLibCategory(deleteConfirm.id);
                }
                setDeleteConfirm({ show: false, type: '', id: '', name: '' });
            };

            const filteredTasks = useMemo(() => {
                if (activeBoardId === 'all') return tasks;
                return tasks.filter(t => t.boardId === activeBoardId);
            }, [tasks, activeBoardId]);

            const filteredLibItems = useMemo(() => {
                if (activeLibCat === 'all') return libraryItems;
                return libraryItems.filter(i => i.categoryId === activeLibCat);
            }, [libraryItems, activeLibCat]);

            const activeBoardObj = boards.find(b => b.id === activeBoardId);
            const oldestFocusTask = useMemo(() => {
                const active = tasks.filter(t => t.status !== 'done');
                if (active.length === 0) return null;
                return active.sort((a, b) => new Date(a.dueDate || '2099-01-01') - new Date(b.dueDate || '2099-01-01'))[0];
            }, [tasks]);

            const achievementStats = useMemo(() => ({
                completedCount: tasks.filter(t => t.status === 'done').length,
                level,
                gold,
                unlockedThemesCount: unlockedThemes.length,
                totalThemesCount: Object.keys(RETRO_THEMES).length
            }), [tasks, level, gold, unlockedThemes]);

            // Completions-per-day grid, GitHub-contributions style. Counts only tasks currently
            // marked done — if a completed quest gets deleted later, its day no longer counts.
            const activityWeeks = useMemo(() => {
                const counts = {};
                tasks.forEach(t => {
                    if (t.status === 'done' && t.completedAt) {
                        counts[t.completedAt] = (counts[t.completedAt] || 0) + 1;
                    }
                });

                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const totalDays = 371; // 53 weeks, matches GitHub's span
                const start = new Date(today);
                start.setDate(start.getDate() - (totalDays - 1));
                start.setDate(start.getDate() - start.getDay()); // snap back to the preceding Sunday

                const days = [];
                const cursor = new Date(start);
                while (cursor <= today) {
                    const dateStr = cursor.toISOString().split('T')[0];
                    days.push({ date: dateStr, count: counts[dateStr] || 0, month: cursor.getMonth() });
                    cursor.setDate(cursor.getDate() + 1);
                }
                while (days.length % 7 !== 0) days.push(null); // pad the final partial week

                const weeks = [];
                for (let i = 0; i < days.length; i += 7) weeks.push(days.slice(i, i + 7));

                return { weeks, totalCompleted: Object.values(counts).reduce((a, b) => a + b, 0) };
            }, [tasks]);

            const activityIntensityStyle = (count) => {
                if (!count) return { backgroundColor: activeTheme.border, opacity: 0.12 };
                const opacityByLevel = [0, 0.4, 0.6, 0.8, 1];
                return { backgroundColor: activeTheme.primary, opacity: opacityByLevel[Math.min(count, 4)] };
            };

            // Measure the actual space available for the heatmap so it can reflow into
            // however many horizontal bands best fill THIS screen's shape — tall and narrow
            // on a phone wraps into several stacked bands; wide gets fewer, larger ones.
            const [activitySize, setActivitySize] = useState({ width: 0, height: 0 });
            useEffect(() => {
                if (!showActivity) return;
                const el = activityContainerRef.current;
                if (!el) return;
                const measure = () => setActivitySize({ width: el.clientWidth, height: el.clientHeight });
                measure();
                const ro = new ResizeObserver(measure);
                ro.observe(el);
                return () => ro.disconnect();
            }, [showActivity]);

            const activityLayout = useMemo(() => {
                const totalWeeks = activityWeeks.weeks.length;
                const daysPerWeek = 7;
                const { width, height } = activitySize;
                if (!width || !height) return { bands: 1, weeksPerBand: totalWeeks, cellSize: 5 };

                const availW = Math.max(width, 20);
                const availH = Math.max(height, 20);

                let best = { bands: 1, weeksPerBand: totalWeeks, cellSize: 0 };
                for (let bands = 1; bands <= 8; bands++) {
                    const weeksPerBand = Math.ceil(totalWeeks / bands);
                    const cellFromWidth = (availW - ACTIVITY_GAP * (weeksPerBand - 1)) / weeksPerBand;
                    const totalRows = bands * daysPerWeek;
                    const cellFromHeight = (availH - ACTIVITY_GAP * (totalRows - 1) - ACTIVITY_BAND_GAP * (bands - 1) - ACTIVITY_MONTH_LABEL_H * bands) / totalRows;
                    const cellSize = Math.min(cellFromWidth, cellFromHeight);
                    if (cellSize > best.cellSize) best = { bands, weeksPerBand, cellSize };
                }
                best.cellSize = Math.max(2, Math.floor(best.cellSize));
                return best;
            }, [activitySize, activityWeeks.weeks.length]);

            const activityBands = useMemo(() => {
                const { weeksPerBand } = activityLayout;
                const chunks = [];
                for (let i = 0; i < activityWeeks.weeks.length; i += weeksPerBand) {
                    chunks.push(activityWeeks.weeks.slice(i, i + weeksPerBand));
                }
                return chunks;
            }, [activityLayout, activityWeeks.weeks]);

            const activityMonthLabel = (week, prevWeek) => {
                const firstDay = week.find(d => d);
                if (!firstDay) return '';
                const prevFirstDay = prevWeek ? prevWeek.find(d => d) : null;
                if (!prevFirstDay || prevFirstDay.month !== firstDay.month) {
                    return new Date(firstDay.date).toLocaleString('en-US', { month: 'short' });
                }
                return '';
            };

            if (!isDataLoaded) {

                    <div className="min-h-screen flex items-center justify-center font-arcade text-xl" style={{ backgroundColor: activeTheme.bg, color: activeTheme.border }}>
                        <div className="animate-pulse">LOADING SAVE FILE...</div>
                    </div>

            return (

                                </div>

                                </div>
                            </div>

                                                </button>

                                                    <span className="truncate pr-2">{colLabel} <span className="opacity-50 text-[10px]">({colTasks.length})</span></span>
                                                    {colId === 'todo' && (
                                                        <button onClick={() => { sound.playBlip(); setIsAddingQuest(true); }} className="bg-yellow-400 text-black px-2 py-1 pixel-box-sm active:scale-90 flex-shrink-0">
                                                            + ADD
                                                        </button>
                                                    )}

                                            <div className="p-3 overflow-y-auto hide-scrollbar flex-1 flex flex-col gap-3 pb-safe">
                                                {colTasks.length === 0 && (

                        {activeTab === 'tasks' && taskViewMode === 'list' && (

                                <div className="w-[100%] max-w-[500px] h-full mx-auto flex-shrink-0 snap-center flex flex-col pixel-box relative overflow-hidden" style={{ backgroundColor: activeTheme.windowBg }}>
                                    
                                    <div className="p-3 border-b-4 flex items-center justify-between sticky top-0 z-10 backdrop-blur-sm bg-white/50" style={{ borderColor: activeTheme.border }}>
                                        <h2 className="text-sm text-black">{activeBoardId !== 'all' ? `${activeBoardObj.name}` : 'ALL QUESTS'}</h2>

                                            + ADD QUEST

                                    <div className="p-4 overflow-y-auto hide-scrollbar flex-1 pb-safe">
                                        {['Overdue', 'Today', 'Tomorrow', 'Upcoming', 'No Date'].map(group => {

                                            if (groupedTasks.length === 0) return null;
                                            
                                            return (
                                                <div key={group} className="mb-6">
                                                    <h3 className="text-[10px] opacity-60 mb-2 uppercase tracking-widest flex items-center gap-2 text-black">
                                                        <span className="w-full h-0.5 bg-black/20 block"></span>
                                                        <span className="whitespace-nowrap">{group}</span>
                                                        <span className="w-full h-0.5 bg-black/20 block"></span>
                                                    </h3>
                                                    <div className="flex flex-col gap-2">
                                                        {groupedTasks.map(t => <TaskCard key={t.id} task={t} compact={true} />)}
                                                    </div>
                                                </div>
                                            );
                                        })}

                                        {filteredTasks.filter(t => t.status === 'done').length > 0 && (
                                            <div className="mt-8 opacity-60">
                                                <h3 className="text-[10px] mb-2 uppercase text-center text-black">VICTORY (DONE)</h3>
                                                <div className="flex flex-col gap-2">
                                                    {filteredTasks.filter(t => t.status === 'done').map(t => <TaskCard key={t.id} task={t} compact={true} />)}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                </div>
                            </div>
                        )}

                        {activeTab === 'archive' && (
                            <div className="flex-1 overflow-x-auto snap-x snap-mandatory hide-scrollbar p-4 flex gap-4 items-start h-full pb-8">
                                <div className="w-[100%] max-w-[500px] md:max-w-[720px] lg:max-w-[960px] h-full mx-auto flex-shrink-0 snap-center flex flex-col pixel-box relative overflow-hidden" style={{ backgroundColor: activeTheme.windowBg }}>
                                    
                                    <div className="overflow-y-auto hide-scrollbar flex-1 pb-20">
                                        {filteredLibItems.length === 0 && (
                                            <div className="text-center opacity-50 text-[10px] py-8 text-black">
                                                NO ITEMS SAVED
                                            </div>
                                        )}
                                        {filteredLibItems.map((item, idx) => {
                                            const cat = libraryCategories.find(c => c.id === item.categoryId);
                                            const editingTitle = editingLibField?.itemId === item.id && editingLibField.field === 'title';
                                            const editingDesc = editingLibField?.itemId === item.id && editingLibField.field === 'description';
                                            return (
                                                <div 
                                                    key={item.id} 
                                                    className={`px-4 py-3 flex justify-between items-center group transition-colors ${idx > 0 ? 'border-t-2' : ''}`}
                                                    style={{ borderColor: activeTheme.border }}
                                                >
                                                    <div className="flex items-center gap-3 flex-1 min-w-0 pr-2">
                                                        {renderLibraryMarker(item, cat)}
                                                        <div className="flex-1 min-w-0">
                                                            <div className="flex items-center gap-2">
                                                                {editingTitle ? (
                                                                    <input
                                                                        type="text"
                                                                        autoFocus
                                                                        value={libFieldDraft}

                                                                        onBlur={saveLibFieldEdit}
                                                                        onKeyDown={(e) => {

                                                                        style={{ borderColor: activeTheme.primary }}

                                                                        onClick={() => !item.done && openLibFieldEdit(item, 'title')}
                                                                        className={`font-readable text-[13px] font-bold leading-snug break-words text-black ${item.done ? 'line-through opacity-60' : 'cursor-pointer'}`}

                                {task.subtasks && task.subtasks.length > 0 && (
                                    <div className="mb-3 space-y-1.5 border-l-2 pl-2" style={{ borderColor: activeTheme.border }}>
                                        {task.subtasks.map((sub, idx) => (
                                            <div key={sub.id} className="flex items-center gap-2">
                                                <button
                                                    onClick={(e) => { e.stopPropagation(); handleToggleSubtask(task.id, idx); }}
                                                    onPointerDown={(e) => e.stopPropagation()}
                                                    disabled={isDone}
                                                    className={`w-3.5 h-3.5 flex-shrink-0 pixel-box-sm flex items-center justify-center ${sub.done ? 'bg-green-500 text-white' : 'bg-white'} ${isDone ? 'cursor-not-allowed opacity-70' : ''}`}
                                                >
                                                    {sub.done && <span className="text-[8px] leading-none">✓</span>}
                                                </button>
                                                <span className={`font-readable text-[13px] leading-snug ${sub.done ? 'line-through opacity-50' : ''}`}>{sub.text}</span>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                
                                <div className="flex flex-wrap gap-2 items-center">
                                    {isDone && (
                                        <span className="bg-yellow-200 text-black px-1.5 py-0.5 pixel-box-sm text-[8px]">
                                            +{calculateTaskReward(task).xp}XP +{calculateTaskReward(task).gold}G
                                        </span>
                                    )}

                                    {task.isBoss && (
                                        <span className="px-1.5 py-0.5 pixel-box-sm text-[8px] bg-red-500 text-white">
                                            👑 BOSS
                                        </span>
                                    )}
                                    
                                    {isDone && task.completedAt && (
                                        <span className="px-1.5 py-0.5 pixel-box-sm text-[8px] bg-green-200 text-black">
                                            ✓ {task.completedAt}
                                        </span>
                                    )}

                                    {task.dueDate && !isDone && (
                                        <span className={`px-1.5 py-0.5 pixel-box-sm text-[8px] flex items-center gap-1 ${isOverdue ? 'bg-amber-200 text-black' : 'bg-white text-black'}`}>
                                            📅 {task.dueDate === getTodayStr() ? 'TODAY' : task.dueDate === getTomorrowStr() ? 'TMRW' : task.dueDate}
                                        </span>
                                    )}

                                    {task.recurrence && !isDone && (
                                        <span className="px-1.5 py-0.5 pixel-box-sm text-[8px] bg-purple-200 text-black">
                                            🔁 {task.recurrence.type === 'daily' ? 'DAILY' : task.recurrence.type === 'weekly' ? 'WEEKLY' : `EVERY ${task.recurrence.value}${task.recurrence.unit === 'weeks' ? 'W' : 'D'}`}
                                        </span>
                                    )}

                                    {task.recurrence && task.streak > 0 && !isDone && (
                                        <span className="px-1.5 py-0.5 pixel-box-sm text-[8px] bg-orange-200 text-black">
                                            🔥 {task.streak}-STREAK
                                        </span>
                                    )}

                                    {!isDone && (
                                        <select
                                            value={task.boardId}
                                            onChange={(e) => {
                                                const newBoardId = e.target.value;
                                                if (newBoardId === task.boardId) return;
                                                setTasks(prevTasks => prevTasks.map(t => t.id === task.id ? { ...t, boardId: newBoardId } : t));
                                                sound.playBlip(500);
                                                if (newBoardId !== 'general') setActiveBoardId(newBoardId);
                                            }}
                                            onClick={(e) => e.stopPropagation()}
                                            onPointerDown={(e) => e.stopPropagation()}
                                            className="px-1 py-0.5 pixel-box-sm text-[8px] bg-blue-200 text-black"
                                            title="Move to board"
                                        >
                                            <option value="general">General</option>
                                            {boards.filter(b => b.id !== 'all').map(b => (
                                                <option key={b.id} value={b.id}>{b.name}</option>
                                            ))}
                                        </select>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Reroll Action */}
                        {isOverdue && !isDone && (
                            <div className="mt-3 pt-3 border-t-2 border-black/10 flex justify-start items-center">
                                <button onClick={() => handleRerollTask(task.id)} onPointerDown={(e) => e.stopPropagation()} className="bg-purple-500 text-white px-2 py-1 pixel-box-sm text-[8px] active:scale-95 flex items-center gap-1">
                                    🎲 REROLL (5G)
                                </button>
                            </div>
                        )}
                    </div>
                );
            }

            function getTaskGroup(dateStr) {
                if (!dateStr) return 'No Date';
                if (dateStr === getTodayStr()) return 'Today';
                if (dateStr === getTomorrowStr()) return 'Tomorrow';
                if (dateStr < getTodayStr()) return 'Overdue';
                return 'Upcoming';
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
