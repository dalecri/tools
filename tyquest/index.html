<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E1826">
<link rel="icon" href="Tyquest.png">
<link rel="apple-touch-icon" href="Tyquest.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>TyQuest Retro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: sticky HUD, living campsite scene, segmented views, cards below; sheets rise from the bottom.
   Every theme is a night-ground skin (Quiet Pixel dark), set on :root by JS when equipped. */
@font-face {
  font-family: 'Alpha Lyrae';
  src: url('https://heycristobal.com/my-style-guide/assets/fonts/AlphaLyrae-Medium.woff2') format('woff2');
  font-display: swap;
}
:root {
  color-scheme: dark;
  --void: #1E1826; --surface: #2A2233; --surface-2: #251F2D; --line: #3D3448;
  --text: #EDE7F2; --muted: #9B8FA8; --accent: #E8873A;
  --good: #8FD18B; --bad: #E46A6A; --gold: #F2C94C;
  --f-pixel: 'Press Start 2P', 'Space Mono', ui-monospace, monospace;
  --f-head: 'Alpha Lyrae', 'Space Mono', ui-monospace, monospace;
  --f-body: 'Space Mono', ui-monospace, monospace;
  --ease: cubic-bezier(.4,0,.2,1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--void); color: var(--text); }
body {
  margin: 0; font-family: var(--f-body); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
  transition: background .4s var(--ease);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--void); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, textarea { font: inherit; color: var(--text); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

.app {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 140px;
  display: flex; flex-direction: column; gap: 14px;
}

/* HUD */
.hud {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--void); padding-block: 12px 10px;
  display: flex; align-items: center; gap: 12px;
}
.hud-hero { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; text-align: left; }
.hud-lv {
  font-family: var(--f-pixel); font-size: 9px; color: var(--void); background: var(--accent);
  padding: 6px 6px 5px; border-radius: 6px; flex-shrink: 0;
}
.hud-mid { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.hud-name { font-family: var(--f-pixel); font-size: 11px; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xp { height: 6px; background: var(--surface-2); border-radius: 2px; overflow: hidden; position: relative; max-width: 260px; }
.xp > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); transition: width .6s var(--ease); }
.xp::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 9px, var(--void) 9px 10px); opacity: .55; }
.hud-gold { display: flex; align-items: center; gap: 6px; font-family: var(--f-pixel); font-size: 10px; color: var(--gold); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.coin { width: 10px; height: 10px; background: var(--gold); box-shadow: inset -2px -2px 0 rgba(0,0,0,.25); border-radius: 2px; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); flex-shrink: 0; }
.sync-dot[data-s="synced"] { background: var(--good); }
.sync-dot[data-s="syncing"] { background: var(--gold); animation: blink 1s steps(2) infinite; }
.sync-dot[data-s="error"] { background: var(--bad); }
@keyframes blink { 50% { opacity: .3; } }

/* Scene */
.scene { position: relative; border-radius: 16px; overflow: hidden; background: var(--surface-2); box-shadow: 0 1px 0 var(--line), 0 14px 30px -20px rgba(0,0,0,.7); }
.scene canvas { display: block; width: 100%; aspect-ratio: 192 / 84; image-rendering: pixelated; image-rendering: crisp-edges; }
.scene-tag {
  position: absolute; left: 10px; bottom: 9px; font-family: var(--f-pixel); font-size: 8px; color: #fff;
  background: rgba(0,0,0,.35); padding: 5px 7px 4px; border-radius: 6px; pointer-events: none;
}
.lvup {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-family: var(--f-pixel); font-size: clamp(14px, 4vw, 22px); color: var(--gold);
  text-shadow: 2px 2px 0 #000; opacity: 0;
}
.lvup.go { animation: lvup 2.2s steps(12) forwards; }
@keyframes lvup { 0% { opacity: 0; transform: translateY(10px); } 15%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-8px); } }

/* Tabs + chips */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; }
.tab { font-family: var(--f-pixel); font-size: 8.5px; letter-spacing: .04em; padding: 11px 4px 10px; border-radius: 9px; color: var(--muted); transition: background .2s var(--ease), color .2s var(--ease); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 0 var(--line); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -2px; padding: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; font-size: 12px; padding: 6px 12px; border-radius: 999px;
  background: var(--surface-2); color: var(--muted); white-space: nowrap; border: 1px solid transparent;
}
.chip[aria-pressed="true"] { background: var(--surface); color: var(--text); border-color: var(--line); }
.chip.ghost { background: transparent; border: 1px dashed var(--line); }

/* Quest groups */
.group { display: flex; flex-direction: column; gap: 8px; }
.group-h { display: flex; align-items: baseline; gap: 8px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 6px 2px 0; }
.group-h b { font-weight: 400; color: var(--text); opacity: .5; font-variant-numeric: tabular-nums; }
.group-h.late { color: var(--bad); }
.group-h.now { color: var(--accent); }
.q {
  display: grid; grid-template-columns: 26px 1fr auto; align-items: start; gap: 12px;
  background: var(--surface); border-radius: 12px; padding: 12px 14px; cursor: pointer;
  box-shadow: 0 1px 0 var(--line); transition: transform .12s var(--ease);
  text-align: left; width: 100%;
}
.q:active { transform: scale(.985); }
.q.boss { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 60%, transparent), 0 10px 26px -18px var(--accent); }
.q.done { background: var(--surface-2); box-shadow: none; }
.q.done .q-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.q-title { font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
.q-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; font-size: 11px; color: var(--muted); }
.q-meta .late { color: var(--bad); }
.q-meta .soon { color: var(--accent); }
.q-meta .bounty { color: var(--gold); }
.q-meta .crown { color: var(--accent); }
.q-xp { font-family: var(--f-pixel); font-size: 8px; color: var(--muted); padding-top: 5px; font-variant-numeric: tabular-nums; }
.pip { width: 22px; height: 22px; border-radius: 5px; border: 2px solid var(--muted); position: relative; margin-top: 1px; }
.pip.doing { border-color: var(--accent); }
.pip.doing::after { content: ""; position: absolute; inset: 3px; border-radius: 2px; background: linear-gradient(to top, var(--accent) 50%, transparent 50%); animation: fill 1.6s steps(4) infinite alternate; }
@keyframes fill { from { opacity: .55; } to { opacity: 1; } }
.pip.done { background: var(--accent); border-color: var(--accent); }
.pip.done::after { content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid var(--void); border-width: 0 3px 3px 0; transform: rotate(45deg); }
.more { font-size: 12px; color: var(--muted); padding: 10px; border-radius: 10px; background: var(--surface-2); }
.empty {
  display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  padding: 28px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; font-size: 13px;
}
.empty strong { font-family: var(--f-pixel); font-size: 10px; color: var(--text); font-weight: 400; }

/* Board lanes */
.lanes { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(78%, 1fr); gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px; }
.lanes::-webkit-scrollbar { display: none; }
@media (min-width: 640px) { .lanes { grid-auto-columns: 1fr; } }
.lane { scroll-snap-align: start; background: var(--surface-2); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; align-self: start; }
.lane-h { display: flex; justify-content: space-between; font-family: var(--f-pixel); font-size: 8px; color: var(--muted); padding: 4px 4px 2px; }
.lane-h span:first-child { color: var(--text); }
.lane .q { grid-template-columns: 22px 1fr; padding: 10px 12px; }
.lane .q-xp { display: none; }

/* Codex */
.codex-h { display: flex; align-items: center; gap: 8px; }
.codex-h h2 { font-family: var(--f-head); font-size: 18px; margin: 0; flex: 1; min-width: 0; text-wrap: balance; }
.icon-btn { width: 34px; height: 34px; border-radius: 10px; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; font-size: 13px; flex-shrink: 0; }
.entry { display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: start; background: var(--surface); border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 0 var(--line); }
.entry.no-mark { grid-template-columns: 1fr; }
.entry-body { text-align: left; min-width: 0; }
.entry-title { font-size: 14px; overflow-wrap: anywhere; }
.entry.done .entry-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.entry-desc { font-size: 12px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; white-space: pre-wrap; }
.entry-cat { font-size: 11px; color: var(--muted); margin-top: 3px; }
.mark { width: 22px; height: 22px; border-radius: 5px; border: 2px solid var(--muted); display: grid; place-items: center; font-family: var(--f-pixel); font-size: 8px; color: var(--muted); }
.mark.on { background: var(--accent); border-color: var(--accent); color: var(--void); }
.mark.star { border: 0; font-family: var(--f-body); font-size: 18px; color: var(--line); }
.mark.star.on { background: none; color: var(--gold); }

/* Tavern */
.sec-h { font-family: var(--f-head); font-size: 18px; margin: 8px 2px 0; }
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.skin { background: var(--surface); border-radius: 14px; overflow: hidden; text-align: left; box-shadow: 0 1px 0 var(--line); display: flex; flex-direction: column; }
.skin.on { box-shadow: 0 0 0 2px var(--accent); }
.skin-prev { height: 64px; position: relative; }
.skin-prev i { position: absolute; bottom: 0; left: 0; right: 0; height: 18px; }
.skin-prev b { position: absolute; left: 12px; bottom: 12px; width: 14px; height: 14px; border-radius: 3px; }
.skin-info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
.skin-name { font-size: 13px; font-weight: 700; }
.skin-price { font-family: var(--f-pixel); font-size: 8px; color: var(--gold); }
.skin-price.owned { color: var(--muted); }
.skin.locked .skin-price.poor { color: var(--muted); opacity: .6; }
.achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ach { background: var(--surface); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; box-shadow: 0 1px 0 var(--line); }
.ach.locked { background: var(--surface-2); box-shadow: none; }
.ach.locked .ach-ico { filter: grayscale(1); opacity: .35; }
.ach-ico { font-size: 22px; text-align: center; }
.ach-name { font-size: 12px; font-weight: 700; }
.ach-desc { font-size: 11px; color: var(--muted); }

/* FAB */
.fab {
  position: fixed; z-index: 6;
  right: calc(max(16px, env(safe-area-inset-right, 0px)) + 4px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  width: 58px; height: 58px; border-radius: 18px; background: var(--accent); color: var(--void);
  font-family: var(--f-pixel); font-size: 20px; display: grid; place-items: center;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 55%, #000), 0 16px 30px -12px rgba(0,0,0,.7);
  transition: transform .12s var(--ease), box-shadow .12s var(--ease);
}
.fab:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 55%, #000); }
@media (min-width: 800px) { .fab { right: calc(50% - 380px); } }

/* Sheet */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .25s var(--ease); }
.backdrop.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; margin: 0 auto; max-width: 560px;
  background: var(--surface); border-radius: 22px 22px 0 0; max-height: 90%;
  overflow-y: auto; overscroll-behavior: contain;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(env(safe-area-inset-bottom, 0px) + 22px);
  transform: translateY(105%); transition: transform .32s var(--ease);
  box-shadow: 0 -20px 50px -20px rgba(0,0,0,.6);
}
.sheet.open { transform: none; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 14px; }
.sheet h2 { font-family: var(--f-head); font-size: 20px; line-height: 1.25; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.sheet-stack { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.lbl { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.inp { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 13px; font-size: 15px; }
.inp::placeholder { color: var(--muted); opacity: .7; }
textarea.inp { resize: vertical; min-height: 84px; font-size: 14px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font-size: 12px; padding: 8px 12px; border-radius: 9px; background: var(--surface-2); color: var(--muted); border: 1px solid transparent; }
.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); color: var(--text); border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row .inp { flex: 1; min-width: 0; }
.num { width: 76px !important; flex: 0 0 auto !important; }
.subrow { display: flex; gap: 6px; }
.subrow .inp { padding: 10px 12px; font-size: 14px; }
.x { width: 40px; flex-shrink: 0; border-radius: 10px; background: var(--surface-2); color: var(--muted); }
.add-line { font-size: 12px; color: var(--muted); padding: 10px; border: 1px dashed var(--line); border-radius: 10px; text-align: center; }
.boss-tog { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); font-size: 13px; color: var(--muted); border: 1px solid transparent; text-align: left; }
.boss-tog[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.boss-tog .crown { font-size: 16px; color: var(--accent); }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { padding: 13px 14px; border-radius: 12px; background: var(--surface-2); font-size: 13px; font-weight: 700; text-align: center; }
.btn.primary { background: var(--accent); color: var(--void); grid-column: 1 / -1; font-family: var(--f-pixel); font-size: 10px; font-weight: 400; padding: 16px; box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 55%, #000); }
.btn.primary:active { transform: translateY(2px); box-shadow: none; }
.btn.danger { color: var(--bad); }
.btn.wide { grid-column: 1 / -1; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 11px; padding: 4px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.tag.hot { color: var(--accent); }
.tag.gold { color: var(--gold); }
.tag.late { color: var(--bad); }
.steps { display: flex; flex-direction: column; gap: 6px; }
.step { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); text-align: left; font-size: 13px; }
.step .pip { width: 18px; height: 18px; border-width: 2px; margin: 0; }
.step .pip.done::after { left: 4px; top: 0; width: 4px; height: 9px; }
.step.done span { color: var(--muted); text-decoration: line-through; }
.hp { display: flex; flex-direction: column; gap: 6px; }
.hp-top { display: flex; justify-content: space-between; font-family: var(--f-pixel); font-size: 8px; color: var(--muted); }
.hp-bar { height: 12px; background: var(--surface-2); border-radius: 3px; overflow: hidden; position: relative; }
.hp-bar i { position: absolute; inset: 0 auto 0 0; background: var(--bad); transition: width .4s steps(6); }
.hp-bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 11px, var(--surface) 11px 13px); }

/* Hero sheet */
.hero-top { display: flex; align-items: center; gap: 14px; }
.hero-av { width: 64px; height: 64px; border-radius: 14px; background: var(--surface-2); image-rendering: pixelated; flex-shrink: 0; }
.hero-name { font-family: var(--f-pixel); font-size: 14px; text-align: left; overflow-wrap: anywhere; line-height: 1.5; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 12px; }
.stat b { display: block; font-family: var(--f-pixel); font-size: 13px; font-weight: 400; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 2px; }
.heat i { aspect-ratio: 1; border-radius: 1.5px; background: var(--line); opacity: .5; }
.heat i[data-l="1"] { background: var(--accent); opacity: .35; }
.heat i[data-l="2"] { background: var(--accent); opacity: .6; }
.heat i[data-l="3"] { background: var(--accent); opacity: .8; }
.heat i[data-l="4"] { background: var(--accent); opacity: 1; }
.heat i.pad { visibility: hidden; }
.heat-cap { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.code { font-family: var(--f-pixel); font-size: 18px; letter-spacing: .2em; color: var(--accent); text-align: center; padding: 14px; background: var(--surface-2); border-radius: 12px; user-select: all; }
.err { font-size: 12px; color: var(--bad); }
.confirm-q { font-size: 14px; color: var(--muted); }
.confirm-q strong { color: var(--text); }

/* Toasts */
.toasts { position: fixed; z-index: 40; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 62px); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding-inline: 16px; }
.toast { font-family: var(--f-pixel); font-size: 9px; line-height: 1.6; background: var(--text); color: var(--void); padding: 9px 12px 8px; border-radius: 9px; box-shadow: 0 3px 0 rgba(0,0,0,.4); animation: toast 2.6s var(--ease) forwards; text-align: center; max-width: 100%; }
.toast.gold { background: var(--gold); color: #2a1d05; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px) scale(.96); } 10%, 82% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-6px); } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

</head>
<body>
<div class="app" id="app">
  <header class="hud">
    <button class="hud-hero" data-act="hero" id="hud-hero" aria-label="Hero sheet">
      <span class="hud-lv" id="hud-lv">LV 1</span>
      <span class="hud-mid">
        <span class="hud-name" id="hud-name">TYLER</span>
        <span class="xp"><i id="hud-xp" style="width:0%"></i></span>
      </span>
    </button>
    <span class="sync-dot" id="sync-dot" data-s="offline" title="Sync"></span>
    <span class="hud-gold"><span class="coin"></span><span id="hud-gold">0</span></span>
  </header>

  <div class="scene">

<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = '') => p + Date.now().toString() + Math.random().toString(36).slice(2, 5);

/* ---------- dates (local time, so evenings in Quebec don't roll into tomorrow) ---------- */
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const parseD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtDue = s => {
  const n = diffDays(today(), s);
  if (n === 0) return 'Today';
  if (n === 1) return 'Tomorrow';
  if (n === -1) return 'Yesterday';
  if (n < 0) return `${-n}d late`;
  const d = parseD(s);
  if (n < 7) return WD[d.getDay()];
  return `${MO[d.getMonth()]} ${d.getDate()}`;
};

/* ---------- themes (ids, names and prices match the original so unlocks carry over) ---------- */
const THEMES = {
  snes16bit:      { name: '16-Bit Town',      cost: 0,   t: ['#1E1826','#2A2233','#251F2D','#3D3448','#EDE7F2','#9B8FA8','#E8873A'], hill: ['#4B3F63','#2E2640','#3A2F2A'], tent: '#7A66A6' },
  sageWordnest:   { name: 'Sage Wordnest',    cost: 50,  t: ['#161E18','#212B23','#1C251E','#33413A','#E6EBD8','#9AAA92','#A9C98A'], hill: ['#4E6A4C','#2C3F2E','#3A3424'], tent: '#C7B27A' },
  mexicanCafe:    { name: 'Mexican Cafe',     cost: 150, t: ['#1F150E','#2B1F15','#251A11','#4A3521','#F2E6D6','#B99B7C','#E07A3F'], hill: ['#7A4A2E','#4A2C1A','#4A3020'], tent: '#3C8F86' },
  pixelForest:    { name: 'Pixel Forest',     cost: 200, t: ['#111B16','#1A2821','#16221C','#2C4034','#DDF0D2','#8FAE95','#7FCB6A'], hill: ['#2F5A3E','#1A3626','#33301E'], tent: '#D9774A' },
  arcadeNeon:     { name: 'Arcade Neon',      cost: 250, t: ['#170E2B','#24173F','#1E1336','#3B2862','#FDF3FF','#A99BC9','#FF2E92'], hill: ['#4B2A7A','#2A1650','#22153D'], tent: '#29D3E6' },
  desertOutpost:  { name: 'Desert Outpost',   cost: 200, t: ['#22190F','#2F2317','#291E13','#4A3822','#F5DFB0','#B79E78','#D9A441'], hill: ['#9A6A3A','#6A4424','#7A5A34'], tent: '#B6513A' },
  oceanByte:      { name: 'Ocean Byte',       cost: 250, t: ['#0C1D25','#142B36','#10242E','#22414F','#C9EEF5','#7FA6B2','#4FC3D9'], hill: ['#2C5A6A','#173A48','#2A3A3A'], tent: '#E8C25A' },
  midnightDungeon:{ name: 'Midnight Dungeon', cost: 350, t: ['#100C18','#1B1527','#161121','#2E2540','#E4D9F7','#8F84A8','#8B5CF6'], hill: ['#3A2F55','#221A35','#25202A'], tent: '#C94A6A' }
};
const TOKEN_NAMES = ['--void', '--surface', '--surface-2', '--line', '--text', '--muted', '--accent'];

const ACHIEVEMENTS = [
  { id: 'a1', icon: '🗡️', name: 'First Blood', desc: 'Complete your first quest', check: s => s.done >= 1 },
  { id: 'a2', icon: '📜', name: 'Quest Novice', desc: 'Complete 10 quests', check: s => s.done >= 10 },
  { id: 'a3', icon: '🛡️', name: 'Quest Veteran', desc: 'Complete 50 quests', check: s => s.done >= 50 },
  { id: 'a4', icon: '🐉', name: 'Dragon Slayer', desc: 'Complete 100 quests', check: s => s.done >= 100 },
  { id: 'a5', icon: '⭐', name: 'Rising Hero', desc: 'Reach Level 5', check: s => s.level >= 5 },
  { id: 'a6', icon: '🌟', name: 'Seasoned Hero', desc: 'Reach Level 10', check: s => s.level >= 10 },
  { id: 'a7', icon: '💰', name: 'Gold Hoarder', desc: 'Hold 500 Gold at once', check: s => s.gold >= 500 },
  { id: 'a8', icon: '🎨', name: 'Fashionista', desc: 'Unlock every skin', check: s => s.skins >= Object.keys(THEMES).length },
  { id: 'a9', icon: '👑', name: 'Kingslayer', desc: 'Defeat 5 boss quests', check: s => s.bosses >= 5 },
  { id: 'a10', icon: '🔥', name: 'Hearthkeeper', desc: 'Reach a 7 streak on a repeat quest', check: s => s.streak >= 7 }
];

/* ---------- seed data (only used on a brand-new device with nothing saved) ---------- */
const seedTasks = () => [
  { id: 't1', text: 'Slay the laundry dragon', status: 'todo', boardId: 'house', dueDate: today(), subtasks: [{ id: 's1', text: 'Wash clothes', done: true }, { id: 's2', text: 'Fold and put away', done: false }], recurrence: null, isBoss: false, streak: 0 },
  { id: 't2', text: 'Stack firewood for winter', status: 'doing', boardId: 'house', dueDate: addDays(today(), 2), subtasks: [], recurrence: null, isBoss: true, streak: 0 },
  { id: 't3', text: 'Cook HP ration meals for the week', status: 'todo', boardId: 'house', dueDate: addDays(today(), 1), subtasks: [], recurrence: { type: 'weekly', intervalDays: 7 }, isBoss: false, streak: 2 },
  { id: 't4', text: 'Pay the troll toll (hydro bill)', status: 'done', boardId: 'general', dueDate: today(), completedAt: today(), subtasks: [], recurrence: null, isBoss: false, streak: 0 }
];
const seedBoards = () => [{ id: 'all', name: 'ALL QUESTS' }, { id: 'house', name: 'HOUSEKEEPING' }, { id: 'fitness', name: 'TRAINING' }];
const seedCats = () => [{ id: 'all', name: 'ALL', emoji: '📚' }, { id: 'games', name: 'GAMES TO PLAY', emoji: '🎮', markerStyle: 'check' }, { id: 'books', name: 'BOOKS TO READ', emoji: '📖', markerStyle: 'check' }];
const seedItems = () => [{ id: 'l1', title: 'Stardew Valley 1.6 Update', description: '', categoryId: 'games', done: false }, { id: 'l2', title: 'Dune Messiah', description: '', categoryId: 'books', done: false }];
const MARKERS = ['check', 'number', 'emoji', 'none'];
const MARKER_LABEL = { check: '☐', number: '1.', emoji: '★', none: '–' };

/* ---------- state ---------- */
const S = { tasks: [], boards: [], libCats: [], libItems: [], xp: 0, gold: 0, totalGold: 0, name: 'TYLER', theme: 'snes16bit', unlocked: ['snes16bit'] };
const UI = { tab: 'quests', board: 'all', libCat: 'all', showDone: false, sheet: null };
const level = () => Math.floor(S.xp / 100) + 1;

/* ---------- local storage: same IndexedDB as the original app ---------- */
const DB_NAME = 'TyQuestDB', STORE = 'appData';
let dbp = null;
const db = () => dbp || (dbp = new Promise((res, rej) => {
  const r = indexedDB.open(DB_NAME, 1);
  r.onupgradeneeded = e => { const d = e.target.result; if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE); };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
}));
const idbGet = async k => { try { const d = await db(); return await new Promise((res, rej) => { const q = d.transaction(STORE, 'readonly').objectStore(STORE).get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch { return null; } };
const idbSetMany = async obj => { try { const d = await db(); const st = d.transaction(STORE, 'readwrite').objectStore(STORE); for (const k in obj) st.put(obj[k], k); } catch (e) { console.warn('save failed', e); } };
const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };

const saveLocal = () => idbSetMany({
  tq_tasks: S.tasks, tq_boards: S.boards, tq_libCats: S.libCats, tq_libItems: S.libItems,
  tq_xp: String(S.xp), tq_gold: String(S.gold), tq_total_gold_earned: String(S.totalGold),
  tq_character_name: S.name, tq_theme: S.theme, tq_unlocked_themes: S.unlocked
});

async function loadLocal() {
  const g = k => idbGet(k);
  const [t, b, lc, li, xp, gold, tg, nm, th, un] = await Promise.all(['tq_tasks', 'tq_boards', 'tq_libCats', 'tq_libItems', 'tq_xp', 'tq_gold', 'tq_total_gold_earned', 'tq_character_name', 'tq_theme', 'tq_unlocked_themes'].map(g));
  S.tasks = Array.isArray(t) && t.length ? t : seedTasks();
  S.boards = Array.isArray(b) && b.length ? b : seedBoards();
  S.libCats = Array.isArray(lc) && lc.length ? lc : seedCats();
  S.libItems = Array.isArray(li) && li.length ? li : seedItems();
  S.xp = parseInt(xp, 10) || 0; S.gold = parseInt(gold, 10) || 0; S.totalGold = parseInt(tg, 10) || 0;
  if (nm) S.name = nm; if (th && THEMES[th]) S.theme = th; if (Array.isArray(un) && un.length) S.unlocked = un;
}

/* ---------- Firebase Realtime Database sync (same room format as the original) ---------- */
const SYNC_KEY = 'tyquest_sync_config';
const Sync = { cfg: null, status: 'offline', es: null, timer: null, pending: false, applying: false, synced: false };
try { Sync.cfg = JSON.parse(ls.get(SYNC_KEY) || 'null'); } catch { Sync.cfg = null; }
const nodeUrl = c => `${c.databaseURL.replace(/\/$/, '')}/tyquest/${encodeURIComponent(c.roomCode)}.json`;
const fetchT = (url, opt = {}, ms = 6000) => { const ac = new AbortController(); const tm = setTimeout(() => ac.abort(), ms); return fetch(url, { ...opt, signal: ac.signal }).finally(() => clearTimeout(tm)); };
const snapshot = () => ({ tasks: S.tasks, boards: S.boards, libraryCategories: S.libCats, libraryItems: S.libItems, xp: S.xp, gold: S.gold, totalGoldEarned: S.totalGold, characterName: S.name, themeKey: S.theme, unlockedThemes: S.unlocked });
const fbGet = async c => { const r = await fetchT(nodeUrl(c)); if (!r.ok) throw new Error(r.status); return r.json(); };
const fbPut = async (c, snap) => { const r = await fetchT(nodeUrl(c), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(snap) }); if (!r.ok) throw new Error(r.status); };
const setSync = s => { Sync.status = s; $('#sync-dot').dataset.s = Sync.cfg ? s : 'offline'; };

function applySnap(snap) {
  if (!snap || typeof snap !== 'object') return;
  const prevLv = level();
  if (Array.isArray(snap.tasks)) S.tasks = snap.tasks;
  if (Array.isArray(snap.boards)) S.boards = snap.boards;
  if (Array.isArray(snap.libraryCategories)) S.libCats = snap.libraryCategories;
  if (Array.isArray(snap.libraryItems)) S.libItems = snap.libraryItems;
  if (typeof snap.xp === 'number') S.xp = snap.xp;
  if (typeof snap.gold === 'number') S.gold = snap.gold;
  if (typeof snap.totalGoldEarned === 'number') S.totalGold = snap.totalGoldEarned;
  if (snap.characterName) S.name = snap.characterName;
  if (snap.themeKey && THEMES[snap.themeKey]) S.theme = snap.themeKey;
  if (Array.isArray(snap.unlockedThemes)) S.unlocked = snap.unlockedThemes;
  // Firebase drops empty arrays — patch tasks back to a safe shape
  S.tasks.forEach(t => { if (!Array.isArray(t.subtasks)) t.subtasks = []; });
  saveLocal(); renderAll(); if (level() > prevLv) Scene.levelUp(level());
}

function startStream() {
  stopStream();
  if (!Sync.cfg) return;
  pull();
  try {
    const es = new EventSource(nodeUrl(Sync.cfg));
    const on = e => { if (Sync.pending) return; try { const { path, data } = JSON.parse(e.data); if (path === '/' && data) { applySnap(data); Sync.synced = true; setSync('synced'); } else if (path !== '/') pull(); } catch {} };
    es.addEventListener('put', on); es.addEventListener('patch', on);
    es.onerror = () => setSync('error');
    Sync.es = es;
  } catch { setSync('error'); }
}
function stopStream() { if (Sync.es) { Sync.es.close(); Sync.es = null; } }
async function pull() {
  if (!Sync.cfg || Sync.pending) return;
  try { setSync('syncing'); const snap = await fbGet(Sync.cfg); if (snap) applySnap(snap); Sync.synced = true; setSync('synced'); }
  catch { setSync('error'); }
}
function schedulePush() {
  if (!Sync.cfg || !Sync.synced) return;
  Sync.pending = true; clearTimeout(Sync.timer);
  Sync.timer = setTimeout(async () => {
    try { setSync('syncing'); await fbPut(Sync.cfg, snapshot()); setSync('synced'); }
    catch { setSync('error'); }
    finally { Sync.pending = false; }
  }, 1500);
}
async function connectRoom(url, code) {
  const cfg = { databaseURL: url.trim().replace(/\/$/, ''), roomCode: code.trim().toUpperCase() };
  setSync('syncing');
  const snap = await fbGet(cfg);
  Sync.cfg = cfg; ls.set(SYNC_KEY, JSON.stringify(cfg));
  if (snap) applySnap(snap);
  Sync.synced = true; setSync('synced'); startStream();
}
async function createRoom(url) {
  const cfg = { databaseURL: url.trim().replace(/\/$/, ''), roomCode: Math.random().toString(36).slice(2, 8).toUpperCase() };
  setSync('syncing');
  await fbPut(cfg, snapshot());
  Sync.cfg = cfg; ls.set(SYNC_KEY, JSON.stringify(cfg));
  Sync.synced = true; setSync('synced'); startStream();
  return cfg.roomCode;
}
function disconnectRoom() { stopStream(); Sync.cfg = null; Sync.synced = false; ls.set(SYNC_KEY, null); setSync('offline'); }

/* ---------- sound ---------- */
const Sound = {
  ctx: null, muted: ls.get('tyquest_muted') === '1',
  tone(f, type, dur, vol = .05, delay = 0) {
    if (this.muted) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      const t0 = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t0); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
      o.connect(g); g.connect(this.ctx.destination); o.start(t0); o.stop(t0 + dur);
    } catch {}
  },
  blip(f = 440) { this.tone(f, 'square', .08, .04); },
  coin() { this.tone(988, 'square', .09); this.tone(1319, 'square', .28, .05, .09); },
  slash() { this.tone(220, 'sawtooth', .07, .04); this.tone(110, 'square', .12, .05, .05); },
  magic() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 'triangle', .14, .05, i * .06)); },
  fanfare() { [523, 523, 523, 698, 880].forEach((f, i) => this.tone(f, 'square', i === 4 ? .5 : .1, .05, [0, .1, .2, .3, .45][i])); },
  err() { this.tone(140, 'sawtooth', .18, .04); }
};

/* ---------- toasts ---------- */
function toast(msg, cls = '') {
  const el = document.createElement('div'); el.className = 'toast ' + cls; el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 2700);
}

/* ---------- game rules ---------- */
const reward = t => t.isBoss ? { xp: 100, gold: 25 } : (t.subtasks || []).length >= 4 ? { xp: 90, gold: 20 } : (t.subtasks || []).length >= 2 ? { xp: 70, gold: 15 } : { xp: 50, gold: 10 };
const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
// One random active quest per day pays 1.5x. Same pick on every device.
function bountyId() {
  const pool = S.tasks.filter(t => t.status !== 'done' && !t.isBoss).map(t => t.id).sort();
  return pool.length ? pool[hash(today()) % pool.length] : null;
}
const boardName = id => (S.boards.find(b => b.id === id) || {}).name || 'General';
const visibleTasks = () => UI.board === 'all' ? S.tasks : S.tasks.filter(t => t.boardId === UI.board);
const titleCase = s => String(s).toLowerCase().replace(/(^|\s)\S/g, m => m.toUpperCase());

function achStats() {
  const done = S.tasks.filter(t => t.status === 'done');
  return {
    done: done.length, bosses: done.filter(t => t.isBoss).length, level: level(), gold: S.gold, skins: S.unlocked.length,
    streak: Math.max(0, ...S.tasks.map(t => t.streak || 0))
  };
}
function checkAchievements() {
  let seen; try { seen = JSON.parse(ls.get('tyquest_ach_seen') || 'null'); } catch { seen = null; }
  const st = achStats(); const unlocked = ACHIEVEMENTS.filter(a => a.check(st)).map(a => a.id);
  if (seen) unlocked.filter(id => !seen.includes(id)).forEach((id, i) => { const a = ACHIEVEMENTS.find(x => x.id === id); setTimeout(() => toast(`${a.icon} ${a.name}`, 'gold'), 700 + i * 500); });
  ls.set('tyquest_ach_seen', JSON.stringify(unlocked));
}

function commit(fn) {
  const prevLv = level();
  fn();
  saveLocal(); schedulePush(); renderAll();
  if (level() > prevLv) { Scene.levelUp(level()); Sound.fanfare(); }
  checkAchievements();
}

function completeTask(id) {
  const task = S.tasks.find(t => t.id === id);
  if (!task || task.status === 'done') return;
  const r = reward(task);
  let bonusXp = 0, bonusGold = 0, streak = 0;
  if (task.recurrence) {
    const onTime = !task.dueDate || today() <= task.dueDate;
    streak = onTime ? (task.streak || 0) + 1 : 1;
    bonusXp = Math.min(streak * 2, 50); bonusGold = Math.min(streak, 25);
  }
  let xp = r.xp + bonusXp, gold = r.gold + bonusGold;
  if (bountyId() === id) { xp = Math.round(xp * 1.5); gold = Math.round(gold * 1.5); }
  Scene.defeat(id, task.isBoss);
  Sound.slash(); setTimeout(() => Sound.coin(), 380);
  commit(() => {
    task.status = 'done'; task.completedAt = today();
    if (task.recurrence) {
      S.tasks.unshift({ ...task, id: Date.now().toString() + '_r', status: 'todo', completedAt: null, dueDate: addDays(today(), task.recurrence.intervalDays || 1), streak, subtasks: (task.subtasks || []).map(s => ({ ...s, done: false })) });
    }
    S.xp += xp; S.gold += gold; S.totalGold += gold;
  });
  toast(`+${xp} XP  +${gold}G${streak > 1 ? `  🔥${streak}` : ''}`, 'gold');
}
function advance(id) {
  const t = S.tasks.find(x => x.id === id); if (!t || t.status === 'done') return;
  if (t.status === 'todo') { Sound.blip(330); Scene.engage(id); commit(() => { t.status = 'doing'; }); }
  else completeTask(id);
}
function toggleStep(id, idx) {
  const t = S.tasks.find(x => x.id === id); if (!t || t.status === 'done') return;
  const s = t.subtasks[idx]; if (!s) return;
  const checking = !s.done;
  if (checking) { Sound.blip(720); Scene.hit(id); }
  commit(() => { s.done = checking; if (checking) { S.xp += 5; S.gold += 1; S.totalGold += 1; } });
}

/* ---------- pixel campsite scene ---------- */
const Scene = (() => {
  const cv = $('#scene'), ctx = cv.getContext('2d');
  const W = 192, H = 84, G = 70, FIRE = 54, HERO = 38;
  let frame = 0, particles = [], dying = [], hero = null, slots = new Map(), flashes = new Map(), engaged = new Map();
  const rand = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  const stars = Array.from({ length: 34 }, () => ({ x: Math.floor(rand() * W), y: Math.floor(rand() * 40), p: Math.floor(rand() * 60) }));
  const pinesFar = Array.from({ length: 22 }, (_, i) => ({ x: i * 9 + Math.floor(rand() * 6), h: 7 + Math.floor(rand() * 6) }));
  const pinesNear = Array.from({ length: 12 }, (_, i) => ({ x: i * 17 + Math.floor(rand() * 9) - 4, h: 11 + Math.floor(rand() * 8) }));
  const MON = ['#7FCB6A', '#4FC3D9', '#E8873A', '#B9A9D9', '#F2C94C', '#E46A8C'];

  const SPR = {
    hero: ['..hhhh..', '.hhhhhh.', '.hhssss.', '.hskssk.', '..sssss.', '..tttt..', '.stttts.', '..tttt..', '..b..b..', '..b..b..'],
    sit:  ['..hhhh..', '.hhhhhh.', '.hhssss.', '.hskssk.', '..sssss.', '..tttt..', '.stttts.', '.tttttbb'],
    slime:['..kkkk..', '.kmmlmk.', 'kmkmmkmk', 'kmmmmmmk', '.kkkkkk.'],
    boss: ['.k............k.', '.kk..........kk.', '..kk.kkkkkk.kk..', '...kkrrrrrrkk...', '..krrrrrrrrrrk..', '.krrwkrrrrkwrrk.', '.krrkkrrrrkkrrk.', '.krrrrrrrrrrrrk.', '.krrkwkwkwkwrrk.', '.krrrkkkkkkrrrk.', '..krrrrrrrrrrk..', '..krrk....krrk..', '..kkkk....kkkk..']
  };
  function spr(rows, x, y, pal, flip = false) {
    const w = rows[0].length;
    rows.forEach((r, j) => { for (let i = 0; i < w; i++) { const c = r[flip ? w - 1 - i : i]; if (c === '.' || !pal[c]) continue; ctx.fillStyle = pal[c]; ctx.fillRect(Math.round(x + i), Math.round(y + j), 1, 1); } });
  }
  const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
  const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };
  const mixHex = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };

  function timeOfDay() {
    const h = new Date().getHours() + new Date().getMinutes() / 60;
    if (h < 5.5 || h >= 21) return 'night';
    if (h < 8) return 'dawn';
    if (h < 17) return 'day';
    return 'dusk';
  }
  const SKY = { night: ['#0E0B1E', '#2B2350'], dawn: ['#3C5E8C', '#F2B66B'], day: ['#5FA4CF', '#CBE6EF'], dusk: ['#3A2D5E', '#E8873A'] };

  function layout() {
    const act = visibleTasks().filter(t => t.status !== 'done');
    const boss = act.filter(t => t.isBoss).sort((a, b) => (a.status === 'doing' ? -1 : 1) - (b.status === 'doing' ? -1 : 1))[0];
    const rest = act.filter(t => t !== boss).sort((a, b) => (a.status === 'doing' ? 0 : 1) - (b.status === 'doing' ? 0 : 1) || (a.dueDate || '9') .localeCompare(b.dueDate || '9'));
    const doing = rest.filter(t => t.status === 'doing').slice(0, 2);
    const todo = rest.filter(t => t.status !== 'doing').slice(0, boss ? 4 : 6);
    const out = [];
    doing.forEach((t, i) => out.push({ id: t.id, x: 70 + i * 13, big: false, doing: true, c: MON[hash(t.id) % MON.length] }));
    todo.forEach((t, i) => out.push({ id: t.id, x: 102 + i * 14, big: false, doing: false, c: MON[hash(t.id) % MON.length] }));
    if (boss) out.push({ id: boss.id, x: W - 26, big: true, doing: boss.status === 'doing', c: '#C2452D' });
    return { mons: out, hidden: act.length - out.length };
  }

  function draw() {
    frame++;
    const th = THEMES[S.theme] || THEMES.snes16bit;
    const tod = timeOfDay(), night = tod === 'night', dim = night ? .55 : tod === 'dusk' ? .3 : tod === 'dawn' ? .2 : 0;
    const [top, bot] = SKY[tod];
    // sky in hard bands
    for (let b = 0; b < 8; b++) { ctx.fillStyle = mix(top, bot, b / 7); ctx.fillRect(0, b * 7, W, 7); }
    if (night || tod === 'dusk') stars.forEach(s => { if (tod === 'dusk' && s.y > 22) return; const tw = (frame + s.p) % 60 < 50; ctx.fillStyle = tw ? '#FFF6D8' : '#8C82B0'; ctx.fillRect(s.x, s.y, 1, 1); });
    // sun / moon
    if (night) { ctx.fillStyle = '#F4EBC8'; [[2,0,4],[1,1,6],[0,2,8],[0,3,8],[0,4,8],[0,5,8],[1,6,6],[2,7,4]].forEach(([x,y,w]) => ctx.fillRect(160 + x, 8 + y, w, 1)); ctx.fillStyle = '#D9CFA6'; ctx.fillRect(163, 11, 2, 2); ctx.fillRect(161, 13, 1, 1); }
    else if (tod === 'day') { ctx.fillStyle = '#FFE58A'; [[2,0,6],[1,1,8],[0,2,10],[0,3,10],[0,4,10],[0,5,10],[0,6,10],[1,7,8],[2,8,6]].forEach(([x,y,w]) => ctx.fillRect(150 + x, 7 + y, w, 1)); }
    else { ctx.fillStyle = '#FFD27A'; [[2,0,6],[1,1,8],[0,2,10],[0,3,10]].forEach(([x,y,w]) => ctx.fillRect(140 + x, 40 + y, w, 1)); }
    // far ridge + pines (Laurentian hills)
    const far = mixHex(th.hill[0], top, dim * .5), near = mixHex(th.hill[1], top, dim * .4), ground = mixHex(th.hill[2], '#000000', dim * .5);
    ctx.fillStyle = far;
    for (let x = 0; x < W; x++) { const y = 46 + Math.round(Math.sin(x / 23) * 3 + Math.sin(x / 9) * 1.5); ctx.fillRect(x, y, 1, H - y); }
    pinesFar.forEach(p => { const base = 47 + Math.round(Math.sin(p.x / 23) * 3); for (let j = 0; j < p.h; j++) { const w = Math.max(1, Math.floor(j / 2) * 2 + 1); ctx.fillRect(p.x - (w >> 1), base - p.h + j, w, 1); } });
    ctx.fillStyle = near;
    for (let x = 0; x < W; x++) { const y = 58 + Math.round(Math.sin(x / 31 + 2) * 2); ctx.fillRect(x, y, 1, H - y); }
    pinesNear.forEach(p => { if (p.x > 20 && p.x < 70) return; const base = 59; for (let j = 0; j < p.h; j++) { const w = Math.max(1, (j % 4) + Math.floor(j / 3)); ctx.fillRect(p.x - (w >> 1), base - p.h + j, w, 1); } ctx.fillRect(p.x, base, 1, 2); });
    // ground
    ctx.fillStyle = ground; ctx.fillRect(0, G, W, H - G);
    ctx.fillStyle = mixHex(th.hill[2], '#ffffff', .12); for (let x = 0; x < W; x += 2) ctx.fillRect(x, G, 1, 1);
    // fire glow
    const flick = (frame >> 1) % 3;
    if (dim > .1) { ctx.fillStyle = `rgba(255,170,80,${.08 + dim * .12})`; for (let r = 22; r > 6; r -= 5) { ctx.globalAlpha = .35; ctx.beginPath(); ctx.ellipse(FIRE + 3, G - 2, r + flick, r * .55, 0, 0, Math.PI * 2); ctx.fill(); } ctx.globalAlpha = 1; }
    // tent
    const tent = th.tent;
    for (let j = 0; j < 14; j++) { ctx.fillStyle = mixHex(tent, '#000000', dim * .5); ctx.fillRect(8 + (13 - j), G - 14 + j, j * 2 + 1, 1); }
    ctx.fillStyle = mixHex(tent, '#000000', .45 + dim * .3); for (let j = 4; j < 14; j++) ctx.fillRect(21 - Math.floor((j - 4) / 2), G - 14 + j, Math.floor((j - 4) / 2) * 2 + 1, 1);
    // campfire
    ctx.fillStyle = '#5A3A22'; ctx.fillRect(FIRE - 1, G - 2, 9, 2); ctx.fillStyle = '#3E2716'; ctx.fillRect(FIRE + 1, G - 3, 5, 1);
    const fl = [3 + flick, 5 + ((frame >> 2) % 2), 6 - flick, 4 + ((frame >> 1) % 2), 2 + flick % 2];
    fl.forEach((h, i) => { for (let j = 0; j < h; j++) { ctx.fillStyle = j < 2 ? '#F2C94C' : j < 4 ? '#E8873A' : '#C2452D'; ctx.fillRect(FIRE + 1 + i, G - 3 - j, 1, 1); } });
    if (frame % 6 === 0) particles.push({ x: FIRE + 2 + Math.random() * 4, y: G - 8, vx: (Math.random() - .5) * .2, vy: -.35, c: '#F2C94C', life: 24 });

    // monsters
    const { mons, hidden } = layout();
    const seen = new Set();
    mons.forEach((m, i) => {
      seen.add(m.id);
      const prev = slots.get(m.id); const tx = m.x;
      const x = prev ? prev.x + (tx - prev.x) * .2 : tx + 30;
      const bob = m.big ? (((frame >> 3) + i) % 2) : (((frame >> 2) + i * 2) % 4 === 0 ? 1 : 0);
      slots.set(m.id, { x, big: m.big, c: m.c });
      const fl = flashes.get(m.id); const hitNow = fl && fl > frame;
      const col = hitNow ? '#FFFFFF' : m.c;
      if (m.big) {
        spr(SPR.boss, x - 8, G - 13 - bob, { k: '#1A0F14', r: col, w: '#FFF6E0' }, true);
        if (m.doing && frame % 20 < 10) { ctx.fillStyle = '#F2C94C'; ctx.fillRect(x - 1, G - 18, 2, 3); ctx.fillRect(x - 1, G - 14, 2, 1); }
      } else {
        spr(bob ? ['.kkkkkk.', 'kmmmmlmk', 'kmkmmkmk', 'kmmmmmmk', 'kkkkkkkk'] : SPR.slime, x - 4, G - 5, { k: '#140F1C', m: col, l: '#FFFFFF' }, true);
        if (m.doing && frame % 24 < 14) { ctx.fillStyle = '#F2C94C'; ctx.fillRect(x, G - 10, 1, 3); ctx.fillRect(x, G - 6, 1, 1); }
      }
    });
    for (const k of slots.keys()) if (!seen.has(k) && !dying.some(d => d.id === k)) slots.delete(k);
    // dying monsters
    dying = dying.filter(d => {
      d.t++;
      if (d.t < 10) { if (d.t % 2) { d.big ? spr(SPR.boss, d.x - 8, G - 13, { k: '#1A0F14', r: '#FFFFFF', w: '#FFFFFF' }, true) : spr(SPR.slime, d.x - 4, G - 5, { k: '#FFFFFF', m: '#FFFFFF', l: '#FFFFFF' }, true); } }
      if (d.t === 10) {
        const n = d.big ? 34 : 16;
        for (let i = 0; i < n; i++) particles.push({ x: d.x, y: G - (d.big ? 7 : 3), vx: (Math.random() - .5) * (d.big ? 2.4 : 1.6), vy: -Math.random() * 1.6 - .3, c: i % 3 ? d.c : '#FFFFFF', life: 18 + Math.random() * 12, g: .08 });
        for (let i = 0; i < (d.big ? 10 : 5); i++) particles.push({ x: d.x + (Math.random() - .5) * 8, y: G - 6, vx: 0, vy: -.6 - Math.random() * .3, c: '#F2C94C', life: 34, coin: true });
      }
      return d.t < 50;
    });

    // hero
    const clear = mons.length === 0 && !hero && dying.length === 0;
    let hx = HERO;
    const pal = { h: '#8A5A33', s: '#F2C9A0', k: '#1A1020', t: '#4FAE6A', b: '#3E2A20' };
    if (hero) {
      hero.t++;
      const p = hero.t;
      if (p <= 7) hx = HERO + (hero.tx - HERO) * (p / 7);
      else if (p <= 14) hx = hero.tx;
      else if (p <= 24) hx = hero.tx + (HERO - hero.tx) * ((p - 14) / 10);
      if (p === 8 && hero.onHit) hero.onHit();
      if (p > 7 && p <= 12) { // slash arc
        ctx.fillStyle = '#FFFFFF'; const sx = hx + 9;
        [[0, -9], [2, -8], [3, -6], [4, -4], [4, -2], [3, 0]].forEach(([dx, dy]) => ctx.fillRect(sx + dx, G + dy, 1, 1));
      }
      if (p > 24) hero = null;
    }
    if (clear) {
      spr(SPR.sit, HERO - 2, G - 8, pal);
      if (frame % 40 < 30) { ctx.fillStyle = '#D9D2F0'; const zy = G - 13 - ((frame >> 3) % 4); ctx.fillRect(HERO + 6, zy, 3, 1); ctx.fillRect(HERO + 7, zy + 1, 1, 1); ctx.fillRect(HERO + 6, zy + 2, 3, 1); }
    } else {
      const walk = hero && hero.t <= 24 && (hero.t <= 7 || hero.t > 14) ? (hero.t >> 1) % 2 : 0;
      const rows = walk ? SPR.hero.slice(0, 8).concat(['.b....b.', '.b....b.']) : SPR.hero;
      const flip = hero && hero.t > 14;
      spr(rows, hx - 4, G - 10, pal, flip);
      if (!hero || hero.t > 14) { ctx.fillStyle = '#C9D2E0'; ctx.fillRect(flip ? hx - 6 : hx + 4, G - 8, 1, 5); ctx.fillStyle = '#6A4A2A'; ctx.fillRect(flip ? hx - 6 : hx + 4, G - 4, 1, 1); }
    }

    // particles
    particles = particles.filter(p => {
      p.x += p.vx; p.y += p.vy; if (p.g) p.vy += p.g; p.life--;
      ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.coin ? 2 : 1, p.coin ? 2 : 1);
      return p.life > 0 && p.y < H;
    });
    // night tint
    if (dim > 0) { ctx.fillStyle = `rgba(8,6,30,${dim * .35})`; ctx.fillRect(0, 0, W, H); }

    const tag = $('#scene-tag');
    const txt = clear ? 'ALL CLEAR' : hidden > 0 ? `+${hidden} MORE` : '';
    if (tag.textContent !== txt) { tag.textContent = txt; tag.hidden = !txt; }
  }

  let last = 0;
  function loop(ts) { if (ts - last > 83) { last = ts; draw(); } requestAnimationFrame(loop); }

  return {
    start() { requestAnimationFrame(loop); },
    defeat(id, big) {
      const s = slots.get(id) || { x: big ? W - 26 : 104, big, c: MON[hash(id) % MON.length] };
      const d = { id, x: s.x, big: s.big, c: s.c, t: -8 };
      hero = { t: 0, tx: Math.max(HERO, s.x - (s.big ? 16 : 11)), onHit: () => { d.t = 0; } };
      dying.push(d);
      slots.delete(id);
    },
    hit(id) {
      const s = slots.get(id); if (!s) return;
      hero = { t: 0, tx: Math.max(HERO, s.x - (s.big ? 16 : 11)), onHit: () => flashes.set(id, frame + 3) };
    },
    engage(id) { engaged.set(id, true); },
    levelUp(lv) { const el = $('#lvup'); el.textContent = `LEVEL ${lv}!`; el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); for (let i = 0; i < 40; i++) particles.push({ x: HERO, y: G - 6, vx: (Math.random() - .5) * 3, vy: -Math.random() * 2.2, c: ['#F2C94C', '#FFFFFF', '#E8873A'][i % 3], life: 30, g: .06 }); }
  };
})();

/* ---------- rendering ---------- */
function applyTheme() {
  const th = THEMES[S.theme] || THEMES.snes16bit;
  TOKEN_NAMES.forEach((n, i) => document.documentElement.style.setProperty(n, th.t[i]));
  let m = document.querySelector('meta[name="theme-color"]');
  if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); }
  m.content = th.t[0];
}
function renderHUD() {
  $('#hud-lv').textContent = 'LV ' + level();
  $('#hud-name').textContent = S.name;
  $('#hud-xp').style.width = (S.xp % 100) + '%';
  $('#hud-gold').textContent = S.gold;
  setSync(Sync.status);
}

function questCard(t, bounty) {
  const due = t.dueDate ? (() => { const n = diffDays(today(), t.dueDate); return `<span class="${t.status !== 'done' && n < 0 ? 'late' : t.status !== 'done' && n === 0 ? 'soon' : ''}">${esc(fmtDue(t.dueDate))}</span>`; })() : '';
  const subs = (t.subtasks || []).length ? `<span>${t.subtasks.filter(s => s.done).length}/${t.subtasks.length}</span>` : '';
  const rep = t.recurrence ? `<span>↻${t.streak ? ' ' + t.streak : ''}</span>` : '';
  const brd = UI.board === 'all' && t.boardId && t.boardId !== 'general' ? `<span>${esc(titleCase(boardName(t.boardId)))}</span>` : '';
  const crown = t.isBoss ? `<span class="crown">♛ Boss</span>` : '';
  const bty = bounty && t.status !== 'done' ? `<span class="bounty">★ ×1.5</span>` : '';
  const meta = [crown, bty, due, subs, rep, brd].filter(Boolean).join('');
  const r = reward(t);
  return `<div class="q ${t.status} ${t.isBoss ? 'boss' : ''}" data-act="open" data-id="${esc(t.id)}" role="button" tabindex="0">
    <button class="pip ${t.status}" data-act="advance" data-id="${esc(t.id)}" aria-label="${t.status === 'todo' ? 'Start' : t.status === 'doing' ? 'Complete' : 'Done'}"></button>
    <div style="min-width:0"><div class="q-title">${esc(t.text)}</div>${meta ? `<div class="q-meta">${meta}</div>` : ''}</div>
    <span class="q-xp">${t.status === 'done' ? '' : '+' + r.xp}</span>
  </div>`;
}

function boardChips() {
  return `<div class="chips">${S.boards.map(b => `<button class="chip" data-act="board" data-v="${esc(b.id)}" aria-pressed="${UI.board === b.id}">${esc(b.id === 'all' ? 'All' : titleCase(b.name))}</button>`).join('')}<button class="chip ghost" data-act="boards">Edit</button></div>`;
}

function viewQuests() {
  const vt = visibleTasks(), b = bountyId(), td = today();
  const act = vt.filter(t => t.status !== 'done');
  const byDue = (a, c) => (a.dueDate || '9').localeCompare(c.dueDate || '9');
  const groups = [
    ['In battle', 'now', act.filter(t => t.status === 'doing').sort(byDue)],
    ['Overdue', 'late', act.filter(t => t.status === 'todo' && t.dueDate && t.dueDate < td).sort(byDue)],
    ['Today', '', act.filter(t => t.status === 'todo' && t.dueDate === td)],
    ['Upcoming', '', act.filter(t => t.status === 'todo' && t.dueDate && t.dueDate > td).sort(byDue)],
    ['Someday', '', act.filter(t => t.status === 'todo' && !t.dueDate)]
  ];
  const done = vt.filter(t => t.status === 'done').sort((a, c) => (c.completedAt || '').localeCompare(a.completedAt || ''));
  let h = boardChips();
  if (!act.length) h += `<div class="empty"><strong>Camp is quiet</strong>Add a quest and a monster will wander in.</div>`;
  groups.forEach(([name, cls, list]) => { if (list.length) h += `<section class="group"><div class="group-h ${cls}">${name} <b>${list.length}</b></div>${list.map(t => questCard(t, t.id === b)).join('')}</section>`; });
  if (done.length) {
    h += `<section class="group"><button class="more" data-act="toggle-done">${UI.showDone ? 'Hide' : 'Show'} victories · ${done.length}</button>`;
    if (UI.showDone) h += done.slice(0, 40).map(t => questCard(t, false)).join('');
    h += `</section>`;
  }
  return h;
}

function viewBoard() {
  const vt = visibleTasks(), b = bountyId();
  const lane = (id, name, list) => `<div class="lane" data-lane="${id}"><div class="lane-h"><span>${name}</span><span>${list.length}</span></div>${list.map(t => questCard(t, t.id === b)).join('') || '<div class="empty" style="padding:18px 10px">—</div>'}</div>`;
  const byDue = (a, c) => (a.dueDate || '9').localeCompare(c.dueDate || '9');
  return boardChips() + `<div class="lanes">${lane('todo', 'TO DO', vt.filter(t => t.status === 'todo').sort(byDue))}${lane('doing', 'IN BATTLE', vt.filter(t => t.status === 'doing').sort(byDue))}${lane('done', 'VICTORY', vt.filter(t => t.status === 'done').sort((a, c) => (c.completedAt || '').localeCompare(a.completedAt || '')).slice(0, 25))}</div>`;
}

function marker(item, cat) {
  const style = (cat && cat.markerStyle) || 'check';
  if (style === 'none') return '';
  if (style === 'number') { const idx = S.libItems.filter(i => i.categoryId === item.categoryId).findIndex(i => i.id === item.id) + 1; return `<button class="mark ${item.done ? 'on' : ''}" data-act="lib-toggle" data-id="${esc(item.id)}">${idx}</button>`; }
  if (style === 'emoji') return `<button class="mark star ${item.done ? 'on' : ''}" data-act="lib-toggle" data-id="${esc(item.id)}" aria-label="Star">★</button>`;
  return `<button class="pip ${item.done ? 'done' : ''}" data-act="lib-toggle" data-id="${esc(item.id)}" aria-label="Toggle"></button>`;
}
function viewCodex() {
  const cats = S.libCats;
  const active = cats.find(c => c.id === UI.libCat) || cats[0];
  const items = UI.libCat === 'all' ? S.libItems : S.libItems.filter(i => i.categoryId === UI.libCat);
  let h = `<div class="chips">${cats.map(c => `<button class="chip" data-act="libcat" data-v="${esc(c.id)}" aria-pressed="${UI.libCat === c.id}">${esc(c.emoji || '')} ${esc(c.id === 'all' ? 'All' : titleCase(c.name))}</button>`).join('')}<button class="chip ghost" data-act="libcat-new">+ List</button></div>`;
  if (UI.libCat !== 'all' && active) {
    h += `<div class="codex-h"><h2>${esc(active.emoji || '')} ${esc(titleCase(active.name))}</h2>
      <button class="icon-btn" data-act="marker" title="Marker style">${MARKER_LABEL[active.markerStyle || 'check']}</button>
      <button class="icon-btn" data-act="libcat-del" title="Delete list">✕</button></div>`;
  }
  if (!items.length) h += `<div class="empty"><strong>Empty page</strong>Tap + to write the first entry.</div>`;
  h += items.map(i => {
    const cat = cats.find(c => c.id === i.categoryId);
    const mk = marker(i, cat);
    return `<div class="entry ${i.done ? 'done' : ''} ${mk ? '' : 'no-mark'}">${mk}<button class="entry-body" data-act="lib-open" data-id="${esc(i.id)}"><div class="entry-title">${esc(i.title || i.text || '')}</div>${i.description ? `<div class="entry-desc">${esc(i.description)}</div>` : ''}${UI.libCat === 'all' && cat ? `<div class="entry-cat">${esc(cat.emoji || '')} ${esc(titleCase(cat.name))}</div>` : ''}</button></div>`;
  }).join('');
  return h;
}

function viewTavern() {
  const st = achStats();
  const skins = Object.entries(THEMES).sort((a, b) => a[1].cost - b[1].cost).map(([id, th]) => {
    const own = S.unlocked.includes(id), on = S.theme === id;
    const price = on ? '<span class="skin-price owned">EQUIPPED</span>' : own ? '<span class="skin-price owned">OWNED</span>' : `<span class="skin-price ${S.gold < th.cost ? 'poor' : ''}">${th.cost}G</span>`;
    return `<button class="skin ${on ? 'on' : ''} ${own ? '' : 'locked'}" data-act="skin" data-v="${id}">
      <span class="skin-prev" style="background:linear-gradient(${th.hill[0]}, ${th.t[0]})"><i style="background:${th.hill[2]}"></i><b style="background:${th.t[6]}"></b></span>
      <span class="skin-info"><span class="skin-name">${esc(th.name)}</span>${price}</span></button>`;
  }).join('');
  const achs = ACHIEVEMENTS.map(a => { const ok = a.check(st); return `<div class="ach ${ok ? '' : 'locked'}"><span class="ach-ico">${a.icon}</span><span><div class="ach-name">${esc(a.name)}</div><div class="ach-desc">${esc(a.desc)}</div></span></div>`; }).join('');
  return `<h2 class="sec-h">Skins</h2><div class="skins">${skins}</div><h2 class="sec-h">Trophies · ${ACHIEVEMENTS.filter(a => a.check(st)).length}/${ACHIEVEMENTS.length}</h2><div class="achs">${achs}</div>`;
}

function renderView() {
  $$('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.v === UI.tab));
  const v = $('#view');
  v.innerHTML = UI.tab === 'quests' ? viewQuests() : UI.tab === 'board' ? viewBoard() : UI.tab === 'codex' ? viewCodex() : viewTavern();
  $('#fab').hidden = UI.tab === 'tavern';
}
function renderAll() { applyTheme(); renderHUD(); renderView(); if (UI.sheet && UI.sheet.refresh) UI.sheet.refresh(); }

/* ---------- sheets ---------- */
function openSheet(html, opts = {}) {
  $('#sheet-body').innerHTML = html;
  UI.sheet = opts;
  $('#sheet').classList.add('open'); $('#backdrop').classList.add('open');
  $('#sheet').scrollTop = 0;
  if (opts.mount) opts.mount();
}
function closeSheet() { UI.sheet = null; $('#sheet').classList.remove('open'); $('#backdrop').classList.remove('open'); }

function confirmSheet(html, yesLabel, onYes) {
  openSheet(`<div class="sheet-stack"><h2>Are you sure?</h2><p class="confirm-q" style="margin:0">${html}</p><div class="btns"><button class="btn" data-act="close-sheet">Cancel</button><button class="btn danger" id="cf-yes">${esc(yesLabel)}</button></div></div>`, {
    mount() { $('#cf-yes').onclick = () => { onYes(); closeSheet(); }; }
  });
}

/* quest detail */
function questDetail(id) {
  const render = () => {
    const t = S.tasks.find(x => x.id === id);
    if (!t) { closeSheet(); return ''; }
    const r = reward(t), b = bountyId() === id;
    const tags = [];
    if (t.isBoss) tags.push('<span class="tag hot">♛ Boss</span>');
    if (b && t.status !== 'done') tags.push('<span class="tag gold">★ Bounty ×1.5</span>');
    if (t.dueDate) tags.push(`<span class="tag ${t.status !== 'done' && t.dueDate < today() ? 'late' : ''}">${esc(fmtDue(t.dueDate))}</span>`);
    if (t.recurrence) tags.push(`<span class="tag">↻ ${t.recurrence.type === 'daily' ? 'Daily' : t.recurrence.type === 'weekly' ? 'Weekly' : `Every ${t.recurrence.value} ${t.recurrence.unit}`}${t.streak ? ` · 🔥${t.streak}` : ''}</span>`);
    if (t.boardId && t.boardId !== 'general') tags.push(`<span class="tag">${esc(titleCase(boardName(t.boardId)))}</span>`);
    if (t.status !== 'done') tags.push(`<span class="tag">+${r.xp} XP · +${r.gold}G</span>`);
    const subs = t.subtasks || [];
    const left = subs.filter(s => !s.done).length;
    const hp = t.isBoss && t.status !== 'done' ? `<div class="hp"><div class="hp-top"><span>BOSS HP</span><span>${subs.length ? left + '/' + subs.length : '1/1'}</span></div><div class="hp-bar"><i style="width:${subs.length ? (left / subs.length) * 100 : 100}%"></i></div></div>` : '';
    const steps = subs.length ? `<div class="steps">${subs.map((s, i) => `<button class="step ${s.done ? 'done' : ''}" data-act="step" data-id="${esc(t.id)}" data-i="${i}"><span class="pip ${s.done ? 'done' : ''}"></span><span>${esc(s.text)}</span></button>`).join('')}</div>` : '';
    let main = '';
    if (t.status === 'todo') main = `<button class="btn primary" data-act="d-advance" data-id="${esc(t.id)}">${t.isBoss ? 'ENTER BATTLE' : 'START QUEST'}</button>`;
    else if (t.status === 'doing') main = t.isBoss && left ? `<button class="btn primary" data-act="d-strike" data-id="${esc(t.id)}">STRIKE</button>` : `<button class="btn primary" data-act="d-advance" data-id="${esc(t.id)}">${t.isBoss ? 'DEFEAT BOSS' : 'COMPLETE'}</button>`;
    const extra = [];
    if (t.status === 'doing') extra.push(`<button class="btn" data-act="d-retreat" data-id="${esc(t.id)}">Back to to-do</button>`);
    if (t.status !== 'done') extra.push(`<button class="btn" data-act="d-reroll" data-id="${esc(t.id)}" ${S.gold < 5 ? 'disabled' : ''}>Push to tomorrow · 5G</button>`);
    if (t.status !== 'done') extra.push(`<button class="btn" data-act="d-edit" data-id="${esc(t.id)}">Edit</button>`);
    extra.push(`<button class="btn danger" data-act="d-delete" data-id="${esc(t.id)}">Delete</button>`);
    if (extra.length % 2) extra[extra.length - 1] = extra[extra.length - 1].replace('class="btn', 'class="btn wide');
    return `<div class="sheet-stack"><div class="meta-row">${tags.join('')}</div><h2>${esc(t.text)}</h2>${hp}${steps}<div class="btns">${main}${extra.join('')}</div></div>`;
  };
  openSheet(render(), { refresh() { const h = render(); if (h) $('#sheet-body').innerHTML = h; } });
}

/* quest form */
function questForm(id) {
  const t = id ? S.tasks.find(x => x.id === id) : null;
  const f = {
    text: t ? t.text : '',
    board: t ? (t.boardId || 'general') : (UI.board === 'all' ? 'general' : UI.board),
    due: t && t.dueDate ? (t.dueDate === today() ? 'today' : t.dueDate === addDays(today(), 1) ? 'tomorrow' : 'pick') : 'none',
    date: t && t.dueDate ? t.dueDate : today(),
    rep: t && t.recurrence ? (t.recurrence.type === 'custom' ? 'every' : t.recurrence.type) : 'off',
    n: t && t.recurrence && t.recurrence.type === 'custom' ? t.recurrence.value : 2,
    unit: t && t.recurrence && t.recurrence.type === 'custom' ? t.recurrence.unit : 'days',
    boss: t ? !!t.isBoss : false,
    subs: t ? (t.subtasks || []).map(s => ({ ...s })) : []
  };
  const boards = [{ id: 'general', name: 'General' }, ...S.boards.filter(b => b.id !== 'all')];
  const seg = (group, opts, val) => `<div class="seg" data-group="${group}">${opts.map(([v, l]) => `<button type="button" data-act="seg" data-v="${esc(v)}" aria-pressed="${v === val}">${esc(l)}</button>`).join('')}</div>`;
  const subRow = s => `<div class="subrow" data-sid="${esc(s.id)}" data-done="${s.done ? 1 : 0}"><input class="inp" value="${esc(s.text)}" placeholder="Step" maxlength="120" aria-label="Step"><button type="button" class="x" data-act="sub-del" aria-label="Remove step">✕</button></div>`;
  openSheet(`<form class="sheet-stack" id="qf" autocomplete="off">
    <h2>${t ? 'Edit quest' : 'New quest'}</h2>
    <input class="inp" id="qf-text" placeholder="What needs doing?" maxlength="140" value="${esc(f.text)}" required>
    <div class="field"><span class="lbl">Board</span>${seg('board', boards.map(b => [b.id, b.id === 'general' ? 'General' : titleCase(b.name)]), f.board)}</div>
    <div class="field"><span class="lbl">Due</span>${seg('due', [['none', 'None'], ['today', 'Today'], ['tomorrow', 'Tomorrow'], ['pick', 'Pick']], f.due)}<input class="inp" type="date" id="qf-date" value="${esc(f.date)}" ${f.due === 'pick' ? '' : 'hidden'}></div>
    <div class="field"><span class="lbl">Repeat</span>${seg('rep', [['off', 'Off'], ['daily', 'Daily'], ['weekly', 'Weekly'], ['every', 'Every…']], f.rep)}
      <div class="row" id="qf-every" ${f.rep === 'every' ? '' : 'hidden'}><input class="inp num" type="number" id="qf-n" min="1" max="365" value="${esc(f.n)}" aria-label="Interval">${seg('unit', [['days', 'Days'], ['weeks', 'Weeks']], f.unit)}</div></div>
    <div class="field"><span class="lbl">Steps</span><div class="steps" id="qf-subs">${f.subs.map(subRow).join('')}</div><button type="button" class="add-line" data-act="sub-add">+ Step</button></div>
    <button type="button" class="boss-tog" id="qf-boss" aria-pressed="${f.boss}"><span class="crown">♛</span><span>Boss quest · +100 XP</span></button>
    <div class="btns"><button type="submit" class="btn primary">${t ? 'SAVE' : 'ADD QUEST'}</button></div>
  </form>`, {
    mount() {
      if (!t) setTimeout(() => $('#qf-text') && $('#qf-text').focus(), 320);
      $('#qf-boss').onclick = e => { const b = e.currentTarget; b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); Sound.blip(500); };
      $('#qf').onsubmit = e => {
        e.preventDefault();
        const text = $('#qf-text').value.trim(); if (!text) { $('#qf-text').focus(); return; }
        const val = g => { const b = $(`.seg[data-group="${g}"] [aria-pressed="true"]`); return b ? b.dataset.v : null; };
        const due = val('due');
        const dueDate = due === 'today' ? today() : due === 'tomorrow' ? addDays(today(), 1) : due === 'pick' ? ($('#qf-date').value || null) : null;
        const rep = val('rep');
        let recurrence = null;
        if (rep === 'daily') recurrence = { type: 'daily', intervalDays: 1 };
        else if (rep === 'weekly') recurrence = { type: 'weekly', intervalDays: 7 };
        else if (rep === 'every') { const n = Math.max(1, parseInt($('#qf-n').value, 10) || 1); const unit = val('unit') || 'days'; recurrence = { type: 'custom', value: n, unit, intervalDays: unit === 'weeks' ? n * 7 : n }; }
        const subtasks = $$('#qf-subs .subrow').map(r => ({ id: r.dataset.sid, text: $('input', r).value.trim(), done: r.dataset.done === '1' })).filter(s => s.text);
        const isBoss = $('#qf-boss').getAttribute('aria-pressed') === 'true';
        const boardId = val('board') || 'general';
        if (t) {
          commit(() => Object.assign(t, { text, dueDate, recurrence, subtasks, isBoss, boardId }));
          Sound.blip(600); questDetail(t.id);
        } else {
          commit(() => S.tasks.unshift({ id: Date.now().toString(), text, status: 'todo', boardId, dueDate, subtasks, recurrence, isBoss, streak: 0 }));
          if (boardId !== 'general' && UI.board !== 'all' && UI.board !== boardId) { UI.board = boardId; renderView(); }
          Sound.magic(); closeSheet(); toast(isBoss ? '♛ A boss appears' : 'A monster wanders in');
        }
      };
      this.subRow = subRow;
    }
  });
}

/* boards */
function boardsSheet() {
  const render = () => `<div class="sheet-stack"><h2>Boards</h2>
    <div class="steps">${S.boards.filter(b => b.id !== 'all').map(b => `<div class="subrow"><input class="inp" data-bid="${esc(b.id)}" value="${esc(titleCase(b.name))}" maxlength="24" aria-label="Board name"><button class="x" data-act="board-del" data-id="${esc(b.id)}" aria-label="Delete board">✕</button></div>`).join('')}</div>
    <div class="subrow"><input class="inp" id="nb" placeholder="New board" maxlength="24"><button class="x" id="nb-add" aria-label="Add board" style="color:var(--accent)">+</button></div></div>`;
  const wire = () => {
    $$('[data-bid]').forEach(inp => inp.onchange = () => { const b = S.boards.find(x => x.id === inp.dataset.bid); const v = inp.value.trim(); if (b && v) commit(() => { b.name = v.toUpperCase(); }); });
    const add = () => { const v = $('#nb').value.trim(); if (!v) return; commit(() => S.boards.push({ id: 'b_' + Date.now(), name: v.toUpperCase() })); Sound.blip(600); $('#sheet-body').innerHTML = render(); wire(); };
    $('#nb-add').onclick = add; $('#nb').onkeydown = e => { if (e.key === 'Enter') add(); };
  };
  openSheet(render(), { mount: wire, refresh: null, rerender() { $('#sheet-body').innerHTML = render(); wire(); } });
}

    ${cats.length > 1 ? `<div class="field"><span class="lbl">List</span><div class="seg" data-group="cat">${cats.map(c => `<button type="button" data-act="seg" data-v="${esc(c.id)}" aria-pressed="${c.id === cur}">${esc(c.emoji || '')} ${esc(titleCase(c.name))}</button>`).join('')}</div></div>` : ''}

        e.preventDefault();

function catSheet() {
