<!DOCTYPE html>
<html lang="en" data-world="moon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wordkeep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Alpha Lyrae';src:url('/my-style-guide/assets/fonts/AlphaLyrae-Medium.woff2') format('woff2');font-weight:400 700;font-display:swap}
:root{
  --void:#1E1826;--surface:#2A2233;--surface-2:#251F2D;--text:#EDE7F2;--muted:#9B8FA8;--line:#3D3448;
  --accent:#B9A9D9;--on-accent:#1E1826;--ring:rgba(185,169,217,.16);
  --ease:cubic-bezier(.4,0,.2,1);--head:'Alpha Lyrae','Space Mono',ui-monospace,monospace;
  color-scheme:dark;
}
:root[data-world="lamp"]{--void:#1F150E;--surface:#2A1E14;--surface-2:#251A11;--text:#F2E6D6;--muted:#B99B7C;--line:#4A3521;--accent:#E8873A;--on-accent:#1F150E;--ring:rgba(232,135,58,.16)}
:root[data-world="dawn"]{--void:#E9F1F6;--surface:#FFFFFF;--surface-2:#DCEAF2;--text:#1E3A4A;--muted:#5A7E8F;--line:#C3DBE6;--accent:#3C7FA6;--on-accent:#FFFFFF;--ring:rgba(60,127,166,.14);color-scheme:light}
:root[data-world="sun"]{--void:#F4EDDB;--surface:#FFFBF0;--surface-2:#ECE1C4;--text:#3A3226;--muted:#8A7A56;--line:#DCCB9C;--accent:#B5862A;--on-accent:#FFFBF0;--ring:rgba(201,154,46,.18);color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--text);font:14px/1.6 'Space Mono',ui-monospace,monospace;transition:background-color .4s var(--ease),color .4s var(--ease);overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;transition:transform .12s var(--ease),background-color .4s var(--ease),color .4s var(--ease),opacity .28s var(--ease)}
button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
textarea:focus-visible,.title:focus-visible{outline:0}

.app{height:100dvh;display:grid;grid-template-columns:minmax(320px,34%) 1fr}

/* ── writing desk ── */
.desk{position:relative;display:flex;flex-direction:column;min-height:0;padding:26px 30px 22px;background:var(--surface);border-right:1px solid var(--line);transition:background-color .4s var(--ease),border-color .4s var(--ease);z-index:2}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font:17px var(--head);letter-spacing:.2px}
.brand svg{width:20px;height:20px;color:var(--accent);shape-rendering:crispEdges}
.brand .dot{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background-color .4s var(--ease)}
.brand .dot.busy{background:var(--accent)}
.row{display:flex;gap:8px}
.round{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface-2);border:1px solid var(--line)}
.round:hover{border-color:var(--accent)}
.round svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.round.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.title{margin:44px 0 6px;width:100%;border:0;outline:0;background:transparent;font:30px/1.2 var(--head);color:var(--text);padding:0}
.title::placeholder{color:var(--muted);opacity:.75}
textarea{flex:1;min-height:80px;width:100%;margin-top:10px;padding:6px 0;border:0;outline:0;resize:none;background:transparent;font:15px/1.9 'Space Mono',ui-monospace,monospace;color:var(--text);opacity:.9;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
textarea::placeholder{color:var(--muted)}
textarea::selection{background:var(--ring);color:var(--text)}
.foot{padding-top:18px;border-top:1px solid var(--line)}
.count{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;color:var(--muted)}
.count strong{color:var(--text);font-weight:700}
.bar{height:6px;border-radius:6px;background:var(--surface-2);margin-top:12px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .65s var(--ease),background-color .4s var(--ease)}

/* ── scene ── */
.scene{position:relative;overflow:hidden;background:var(--void);transition:background-color .4s var(--ease)}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;image-rendering:pixelated}
.scene canvas.drag{cursor:grabbing}
.scene canvas.peeking{cursor:pointer}
.hud{position:absolute;left:28px;right:24px;top:24px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:3}
.hud>*{pointer-events:auto}
.name{font:24px/1.2 var(--head);margin:0;text-shadow:0 1px 0 var(--void)}
.stage{display:inline-block;margin-top:6px;font-size:12px;color:var(--muted);letter-spacing:.5px}
.bottom{position:absolute;left:24px;right:24px;bottom:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;z-index:3;pointer-events:none}
.bottom>*{pointer-events:auto}
.seg{display:flex;gap:2px;padding:4px;border-radius:999px;background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.seg button{padding:8px 14px;border-radius:999px;font-size:12px;white-space:nowrap;color:var(--muted)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.cam{display:flex;gap:6px}
.cam .round{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

.peek{position:absolute;z-index:6;max-width:280px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13px;line-height:1.65;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .28s var(--ease),transform .28s var(--ease)}
.peek.show{opacity:1;transform:none}
.peek b{display:block;font:11px 'Space Mono',monospace;color:var(--accent);letter-spacing:.6px;margin-bottom:4px}

.herald{position:absolute;left:50%;top:22%;transform:translateX(-50%);font:30px/1.2 var(--head);white-space:nowrap;pointer-events:none;opacity:0;z-index:4;color:var(--text)}
.herald.go{animation:herald 2.6s var(--ease) forwards}
@keyframes herald{0%{opacity:0;transform:translateX(-50%) scale(1)}8%{opacity:1;transform:translateX(-50%) scale(1.16);text-shadow:0 0 18px var(--accent)}25%{transform:translateX(-50%) scale(1);text-shadow:0 0 6px var(--ring)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1)}}

/* ── sheets ── */
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .28s var(--ease)}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:480px;max-height:82dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:22px 22px 26px;transform:translateY(16px);opacity:0;transition:transform .28s var(--ease),opacity .28s var(--ease)}
.backdrop.open .sheet{transform:none;opacity:1}
@media (min-width:640px){.backdrop{align-items:center}.sheet{border-radius:18px;max-width:400px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sheet h2{margin:0;font:20px var(--head)}
.x{width:32px;height:32px;border-radius:50%;color:var(--muted)}
.x:hover{color:var(--text);background:var(--surface-2)}
.keeps{display:flex;flex-direction:column;gap:6px;margin:0 0 16px;padding:0;list-style:none}
.keep{display:flex;align-items:center;gap:6px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.keep.on{border-color:var(--accent)}
.keep>button:first-child{flex:1;text-align:left;padding:11px 14px;display:flex;justify-content:space-between;gap:10px;min-width:0}
.keep .kn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keep .kw{color:var(--muted);font-size:12px;flex:none}
.keep .del{width:34px;height:34px;margin-right:4px;border-radius:50%;color:var(--muted);flex:none}
.keep .del:hover{color:var(--text);background:var(--ring)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:12px}
.pill:hover{border-color:var(--accent)}
.pill.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set>span{font-size:13px}
.sheet .seg{background:var(--surface-2);backdrop-filter:none}
.sheet .seg button{padding:7px 10px}
.switch{width:46px;height:26px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:9px 50% 50% 9px;background:var(--muted);transition:transform .4s var(--ease),background-color .4s var(--ease),border-radius .4s var(--ease)}
.switch[aria-checked="true"]{border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--accent);border-radius:50% 9px 9px 50%}

/* ── focus + responsive ── */
.focus .app{grid-template-columns:0 1fr}
.focus .desk{visibility:hidden;padding:0;border:0}
@media (max-width:1000px){.desk{padding:22px 22px 18px}.hud{left:20px;right:18px;top:18px}.bottom{left:16px;right:16px;bottom:16px}.seg button{padding:8px 11px}.cam .zoom{display:none}}
@media (max-width:700px){
  .app{grid-template-columns:1fr;grid-template-rows:52% 48%}
  .scene{grid-row:1}.desk{grid-row:2;border-right:0;border-top:1px solid var(--line);padding:14px 18px 14px}
  .title{margin:12px 0 0;font-size:22px}
  textarea{font-size:15px;line-height:1.75;margin-top:6px}
  .foot{padding-top:10px}.bar{margin-top:8px}
  .name{font-size:19px}.round{width:34px;height:34px}
  .seg button{padding:7px 10px;font-size:11px}
  .herald{font-size:22px}
  .focus .app{grid-template-rows:100% 0}.focus .desk{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <section class="desk" aria-label="Writing desk">
    <div class="top">
      <div class="brand">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M1 3h2v1h1V3h1v1h2V3h1v1h1V3h2v9H7V9H5v3H1z"/><path fill="currentColor" opacity=".5" d="M5 0h2v2H5z"/></svg>
        wordkeep<span class="dot" id="dot" title="Saved on this device"></span>
      </div>
      <div class="row">
        <button class="round" id="openKeeps" aria-label="Your keeps" title="Your keeps"><svg viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h7"/></svg></button>
        <button class="round" id="openSettings" aria-label="World settings" title="World"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M3.6 12.4l1.1-1.1M11.3 4.7l1.1-1.1"/></svg></button>
      </div>
    </div>
    <input class="title" id="title" aria-label="Title" autocomplete="off" spellcheck="false">
    <textarea id="text" aria-label="Your writing" placeholder="Begin anywhere." spellcheck="true"></textarea>
    <div class="foot">
      <div class="count"><span><strong id="words">0</strong> words</span><span id="stageText"></span></div>
      <div class="bar" id="bar"><i id="fill"></i></div>
    </div>
  </section>

  <section class="scene" id="scene" aria-label="Your castle">
    <canvas id="world" aria-label="A pixel castle built from your writing. Lit windows hold your sentences; click one to jump to it."></canvas>
    <div class="hud">
      <div><h1 class="name" id="castle">Stillwater Keep</h1><span class="stage" id="chapter"></span></div>
      <button class="round" id="focus" aria-label="Full view" title="Full view"><svg viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
    </div>
    <div class="herald" id="herald" role="status"></div>
    <div class="peek" id="peek"></div>
    <div class="bottom">
      <div class="seg" id="styles" role="group" aria-label="Architecture">
        <button data-style="citadel">Citadel</button><button data-style="abbey">Abbey</button><button data-style="sky">Sky palace</button>
      </div>
      <div class="cam">
        <button class="round zoom" id="zout" aria-label="Zoom out"><svg viewBox="0 0 16 16"><path d="M3.5 8h9"/></svg></button>
        <button class="round zoom" id="zin" aria-label="Zoom in"><svg viewBox="0 0 16 16"><path d="M3.5 8h9M8 3.5v9"/></svg></button>
        <button class="round" id="turn" aria-label="Rotate" title="Rotate"><svg viewBox="0 0 16 16"><path d="M12.8 6.2A5 5 0 1 0 13 9.6"/><path d="M13.2 2.8v3.6H9.6"/></svg></button>
        <button class="round" id="fit" aria-label="Recenter" title="Recenter"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.5"/><path d="M8 1.5v3M8 11.5v3M1.5 8h3M11.5 8h3"/></svg></button>
      </div>
    </div>
  </section>
</div>

<div class="backdrop" id="keepsSheet" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="kh">
    <div class="sheet-head"><h2 id="kh">Your keeps</h2><button class="x" data-close aria-label="Close">✕</button></div>
    <ul class="keeps" id="keepList"></ul>
    <div class="pills">
      <button class="pill primary" id="newKeep">New keep</button>
      <button class="pill" id="sampleKeep">Sample tale</button>
      <button class="pill" id="exportTxt">Text ↓</button>
      <button class="pill" id="exportPng">Picture ↓</button>
    </div>
  </div>
</div>

<div class="backdrop" id="settingsSheet" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh">
    <div class="sheet-head"><h2 id="sh">World</h2><button class="x" data-close aria-label="Close">✕</button></div>
    <div class="set"><span>Light</span><div class="seg" id="worlds" role="group" aria-label="Light">
      <button data-world="auto" title="Follows your clock">Clock</button><button data-world="moon">Moon</button><button data-world="lamp">Lamp</button><button data-world="dawn">Dawn</button><button data-world="sun">Sun</button>
    </div></div>
    <div class="set"><span>Snow</span><button class="switch" id="snow" role="switch" aria-checked="false" aria-label="Snow"></button></div>
    <div class="set"><span>Slow turn</span><button class="switch" id="spin" role="switch" aria-checked="false" aria-label="Slow turn"></button></div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);

const SAMPLE = `Beyond the last bend in the river, a little island held its breath. There was a house there, or the beginning of one: pale stone, a blue roof, a door left open to the weather. Every evening, someone lit a lamp in the window. Nobody in the village could remember when that had started.

The keeper collected things that other people overlooked. A brass button. A map of a place that did not exist. Letters with no address. He kept them in a room above the water, where the walls smelled faintly of rain and the shelves leaned under the weight of unfinished stories. He was certain that every small thing deserved somewhere to belong.

One autumn morning, a woman arrived carrying a clock without hands. She asked him for a room with a view of the sea. There was no sea here, he explained, only a river. She smiled as though this were a very temporary problem. Together they built a staircase, and then a tower, and then another staircase inside the first.

By winter, the island had become a castle. Its bridges connected rooms that had never met before. Trees grew in the courtyards. Gold banners caught the wind. On clear nights, light spilled from a hundred little windows, and the people across the river began to write their own stories too.

The keeper never finished building. That was the lovely thing about it. There was always another stone to lay, another door to open, another stranger on the bridge with something worth keeping.`;

/* ─────────── worlds: Quiet Pixel's four lights, each with its own scene palette ─────────── */
const WORLDS = {
  moon: { night: true,  sky: ['#17121F', '#2B2240'], pal: { stone:'#8f88a6', trim:'#bdb4d2', dark:'#5b5470', roof:'#4d4174', roof2:'#3a305a', grass:'#4a6866', leaf:'#3b5b5a', rock:'#4a4258', water:'#2a2846', foam:'#4a4870', rim:'#16121f', lit:'#ffcf7a', unlit:'#2a2438', trunk:'#4a3f45', banner:'#b9a9d9', fa:'#c58fae', fb:'#e2c27a', smoke:'#a59cbd' } },
  lamp: { night: true,  sky: ['#160F0A', '#3A2618'], pal: { stone:'#c4a487', trim:'#e6cdae', dark:'#86664f', roof:'#8f4a30', roof2:'#6a3624', grass:'#68764a', leaf:'#52633b', rock:'#664c3e', water:'#33293a', foam:'#5a4858', rim:'#1a120c', lit:'#ffd27a', unlit:'#3a2a20', trunk:'#5a4030', banner:'#e8873a', fa:'#d9826a', fb:'#f2c94c', smoke:'#a8907a' } },
  dawn: { night: false, sky: ['#D6E7F1', '#F3F1EC'], pal: { stone:'#dde2ea', trim:'#f6f8fb', dark:'#a7b4c4', roof:'#3c7fa6', roof2:'#2f6688', grass:'#8db398', leaf:'#6c9883', rock:'#8a96a6', water:'#98c3da', foam:'#d2e7f2', rim:'#6a8aa0', lit:'#ffe2a8', unlit:'#61798f', trunk:'#7a6a5e', banner:'#f2a6a0', fa:'#e8a0b4', fb:'#f2d27a', smoke:'#ffffff' } },
  sun:  { night: false, sky: ['#F1E6C9', '#FBF7EC'], pal: { stone:'#eee0c3', trim:'#fff6e2', dark:'#c4b089', roof:'#b9674a', roof2:'#93523b', grass:'#9ab268', leaf:'#77984f', rock:'#ab9b83', water:'#7dbfc6', foam:'#c7e6e2', rim:'#8a7a56', lit:'#fff1c0', unlit:'#857552', trunk:'#86663f', banner:'#3c7fa6', fa:'#d97a6a', fb:'#f2c94c', smoke:'#ffffff' } }
};
const STYLES = { citadel: ['Stillwater Keep', 'Keep'], abbey: ['Bellwether Abbey', 'Abbey'], sky: ['Cloudspire Palace', 'Spire'] };
const THRESHOLDS = [0, 12, 35, 70, 120, 190, 280, 400, 560, 760, 1000];
const STAGES = ['The first stone', 'A place to begin', 'The gate opens', 'A rising keep', 'The outer court', 'Towers in the sky', 'A world of your own', 'The upper gardens', 'A grand residence', 'The crown', 'A living landmark'];
const NEXT = ['a gatehouse', 'the great hall', 'the first tower', 'courtyard walls', 'the high spire', 'a bridge and lookout', 'terraced gardens', 'a second residence', 'the crown towers', 'the final lanterns'];
const STOP = new Set('there their about would could should which where while these those other after before again never every being through because little still always really thing things something nothing another until though first right think known might without around within maybe people across didn doesn wasn haven shall whose whole under above below between since often perhaps rather almost along among during toward towards upon whether either neither enough quite became become becomes itself himself herself myself yourself words write writing'.split(' '));

/* ─────────── storage (migrates the old single-page save) ─────────── */
const KEY = 'wordkeep-v3';
const uid = () => Math.random().toString(36).slice(2, 9);
const mkPage = (text = '', title = '', style = 'citadel') => ({ id: uid(), title, text, style, updated: Date.now() });
function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch {}
  if (!d || !Array.isArray(d.pages) || !d.pages.length) {
    let old = {};
    try { old = JSON.parse(localStorage.getItem('wordkeep-v2') || '{}') || {}; } catch {}
    const p = mkPage(typeof old.text === 'string' ? old.text : SAMPLE, '', STYLES[old.style] ? old.style : 'citadel');
    d = { pages: [p], current: p.id, world: 'auto', snow: 'auto', spin: false, turn: 0 };
  }
  d.pages = d.pages.filter(p => p && typeof p.text === 'string').map(p => ({ ...p, style: STYLES[p.style] ? p.style : 'citadel', title: p.title || '' }));
  if (!d.pages.length) d.pages = [mkPage()];
  if (!d.pages.some(p => p.id === d.current)) d.current = d.pages[0].id;
  if (!['auto', 'moon', 'lamp', 'dawn', 'sun'].includes(d.world)) d.world = 'auto';
  d.turn = (d.turn | 0) % 4;
  return d;
}
let db = load();
const page = () => db.pages.find(p => p.id === db.current);
let saveT;
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); $('dot').classList.remove('busy'); $('dot').title = 'Saved on this device'; }
  catch { $('dot').title = 'Could not save here. Export your text.'; }
}
function saveSoon() { $('dot').classList.add('busy'); clearTimeout(saveT); saveT = setTimeout(persist, 400); }

const clockWorld = () => { const h = new Date().getHours(); return h >= 6 && h < 10 ? 'dawn' : h >= 10 && h < 17 ? 'sun' : h >= 17 && h < 21 ? 'lamp' : 'moon'; };
const worldName = () => db.world === 'auto' ? clockWorld() : db.world;
const winter = () => { const m = new Date().getMonth(); return m >= 10 || m <= 2; };
const snowing = () => db.snow === 'auto' ? winter() : db.snow === 'on';
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ─────────── reading the text ─────────── */
const WORD_RE = /[\p{L}\p{N}]+(?:['’-][\p{L}\p{N}]+)*/gu;
function analyze(text, style) {
  const words = text.match(WORD_RE) || [];
  const sentences = [];

  // window light: soft halos at night, a bloom when a sentence lands, a ring on hover
  for (const [w, L] of art.lights) {
    const bl = blooms.get(w), k = bl ? Math.max(0, 1 - (t - bl) / 650) : 0;
    if (bl && k <= 0) blooms.delete(w);
    if (W.night) { ctx.fillStyle = p.lit; ctx.globalAlpha = .12 + .06 * Math.sin(time * 2.3 + w * 1.7) + k * .5; px(L.x - 2, L.y - 2, 4, 5); ctx.globalAlpha = .08 + k * .3; px(L.x - 4, L.y - 3, 8, 7); }
    else if (k > 0) { ctx.fillStyle = '#fff'; ctx.globalAlpha = k * .8; px(L.x - 2, L.y - 2, 4, 5); }
    if (w === hoverW) { ctx.globalAlpha = .9; ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent'); px(L.x - 3, L.y - 4, 6, 1); px(L.x - 3, L.y + 3, 6, 1); px(L.x - 3, L.y - 3, 1, 6); px(L.x + 2, L.y - 3, 1, 6); }
    ctx.globalAlpha = 1;
  }

  if (!calm) {
    // water glints
    if (art.water.length && Math.random() < .35) glints.push({ o: art.water[(Math.random() * art.water.length) | 0], t0: t });
    glints = glints.filter(gl => t - gl.t0 < 900);
    ctx.fillStyle = W.night ? '#cfc6f0' : '#ffffff';
    for (const gl of glints) { const k = 1 - Math.abs((t - gl.t0) / 450 - 1); ctx.globalAlpha = k * (W.night ? .5 : .85); const x = gl.o % art.W, y = (gl.o / art.W) | 0; px(x, y, 2, 1); }
    ctx.globalAlpha = 1;
    // chimney smoke
    if (art.smoke) {
      if (Math.random() < .08) puffs.push({ t0: t, dx: Math.random() * 2 });
      puffs = puffs.filter(f => t - f.t0 < 4200);
      ctx.fillStyle = p.smoke;
      for (const f of puffs) { const a = (t - f.t0) / 4200, z = a < .3 ? 1 : 2; ctx.globalAlpha = (1 - a) * (W.night ? .35 : .6); px(Math.round(art.smoke.x + f.dx + a * 10 + Math.sin(a * 6) * 1.5), Math.round(art.smoke.y - 2 - a * 34), z, z); }
      ctx.globalAlpha = 1;
    }
    // fireflies
    if (W.night) for (const f of flies) {
      const x = art.W * (.18 + .64 * (.5 + .45 * Math.sin(time * .21 + f.p * 3 + f.x * 9))), y = art.H * (.55 + .3 * (.5 + .5 * Math.sin(time * .17 + f.y * 9)));
      ctx.globalAlpha = Math.max(0, Math.sin(time * 1.6 + f.p)); ctx.fillStyle = model.world === 'lamp' ? '#ffcf6a' : '#e9f59a'; px(Math.round(x), Math.round(y), 1, 1);
      ctx.globalAlpha *= .25; px(Math.round(x) - 1, Math.round(y) - 1, 3, 3);
    }
    ctx.globalAlpha = 1;
  }
  // sparks: each finished word flies home as a mote of light
  sparks = sparks.filter(k => t - k.t0 < k.d);
  for (const k of sparks) {
    const a = (t - k.t0) / k.d;
    for (let j = 0; j < 5; j++) {
      const b = Math.max(0, a - j * .035), e = 1 - (1 - b) ** 3, tx = cam.ox + k.tx * s, ty = cam.oy + k.ty * s;
      const mx = (k.fx + tx) / 2, my = Math.min(k.fy, ty) - ch * .18;
      const x = (1 - e) ** 2 * k.fx + 2 * (1 - e) * e * mx + e * e * tx, y = (1 - e) ** 2 * k.fy + 2 * (1 - e) * e * my + e * e * ty;
      ctx.globalAlpha = (1 - j / 5) * (a > .92 ? (1 - a) / .08 : 1); ctx.fillStyle = j ? p.lit : '#ffffff';
      const sz = j ? s : s * 2; ctx.fillRect(Math.round(x / s) * s - sz / 2, Math.round(y / s) * s - sz / 2, sz, sz);
    }
    if (a > .97 && !k.done) { k.done = 1; bursts.push({ x: k.tx, y: k.ty, t0: t }); }
  }
  bursts = bursts.filter(b => t - b.t0 < 500);
  for (const b of bursts) { const a = (t - b.t0) / 500, r = Math.round(1 + a * 4); ctx.globalAlpha = 1 - a; ctx.fillStyle = p.lit; px(b.x - r, b.y, 1, 1); px(b.x + r, b.y, 1, 1); px(b.x, b.y - r, 1, 1); px(b.x, b.y + r, 1, 1); }
  ctx.globalAlpha = 1;
  cam.oy = oyb;
  if (snowing()) {
    ctx.fillStyle = '#ffffff';
    for (const f of flakes) {
      const y = ((f.y + time * .04 * f.v) % 1) * ch, x = ((f.x + Math.sin(time * .5 + f.d) * .01) % 1) * cw;
      ctx.globalAlpha = W.night ? .55 : .9; ctx.fillRect(Math.round(x / dot) * dot, Math.round(y / dot) * dot, dot * (f.v > .8 ? 2 : 1), dot * (f.v > .8 ? 2 : 1));
    }
    ctx.globalAlpha = 1;
  }
}

function loop(t) {
  if (document.hidden) { rafOn = false; return; }
  if (t - last > 30) { last = t; draw(t); }
  requestAnimationFrame(loop);
}
function kick() { if (calm) { requestAnimationFrame(t => draw(t)); return; } if (!rafOn) { rafOn = true; requestAnimationFrame(loop); } }
document.addEventListener('visibilitychange', () => { if (!document.hidden) kick(); });

/* ─────────── wiring ─────────── */
let prevLevel = -1, prevSentences = 0;
function refresh(opts = {}) {
  if (opts.fade && art) fade = { canvas: art.canvas, W: art.W, H: art.H, t0: performance.now() };
  const before = model.stats;
  build(); raster(); ui();
  const st = model.stats;
  if (opts.typing && before) {
    if (st.level > before.level) herald(STAGES[st.level]);
    if (st.sentences.length > before.sentences.length) { const w = st.sentences.length - 1; blooms.set(w, performance.now()); }
  }
  kick();
}
function ui() {
  const pg = page(), st = model.stats, world = worldName();
  document.documentElement.dataset.world = world;
  $('words').textContent = st.words.toLocaleString();
  $('stageText').textContent = STAGES[st.level];
  const next = THRESHOLDS[st.level + 1];
  $('fill').style.width = (next ? Math.min(100, (st.words - THRESHOLDS[st.level]) / (next - THRESHOLDS[st.level]) * 100) : 100) + '%';
  $('bar').title = next ? `${next - st.words} more words to ${NEXT[st.level]}` : 'Complete. Keep writing.';
  $('title').placeholder = st.name;
  $('castle').textContent = pg.title.trim() || st.name;
  $('chapter').textContent = st.words ? `${Math.min(st.sentences.length, model.windows)} of ${model.windows} windows lit` : '';
  document.querySelectorAll('[data-style]').forEach(b => { b.classList.toggle('on', b.dataset.style === pg.style); b.setAttribute('aria-pressed', b.dataset.style === pg.style); });
  document.querySelectorAll('#worlds [data-world]').forEach(b => { b.classList.toggle('on', b.dataset.world === db.world); b.setAttribute('aria-pressed', b.dataset.world === db.world); });
  $('snow').setAttribute('aria-checked', snowing());
  $('spin').setAttribute('aria-checked', !!db.spin);
  document.title = `${pg.title.trim() || st.name} · Wordkeep`;
}
let heraldT;
function herald(text) { const h = $('herald'); h.textContent = text; h.classList.remove('go'); void h.offsetWidth; h.classList.add('go'); }

function loadPage() { const pg = page(); $('text').value = pg.text; $('title').value = pg.title; cam.zoom = 0; cam.panX = cam.panY = 0; refresh(); }

let buildT;
$('text').addEventListener('input', e => {
  const pg = page(), ta = e.target; pg.text = ta.value; pg.updated = Date.now(); saveSoon();
  const i = ta.selectionStart, ch = ta.value[i - 1], prev = ta.value[i - 2];
  if (ch && /[\s.,!?;:…]/.test(ch) && prev && /[\p{L}\p{N}]/u.test(prev) && e.inputType && e.inputType.startsWith('insert')) spark();
  clearTimeout(buildT); buildT = setTimeout(() => refresh({ typing: true }), 140);
});
$('title').addEventListener('input', e => { page().title = e.target.value; page().updated = Date.now(); saveSoon(); ui(); });

function spark() {
  if (calm || !art) return;
  layout();
  const st = model.stats, lights = [...art.lights.entries()];
  let target = lights.length ? lights[lights.length - 1][1] : null;
  if (lights.length > 1 && Math.random() < .5) target = lights[(Math.random() * lights.length) | 0][1];
  if (!target) target = { x: art.W / 2, y: art.H * .45 };
  const stacked = innerWidth <= 700;
  sparks.push({ t0: performance.now(), d: 760, fx: stacked ? cam.cw / 2 : 0, fy: stacked ? cam.ch : cam.ch * .62, tx: target.x, ty: target.y });
  if (sparks.length > 14) sparks.shift();
  kick();
}

document.querySelectorAll('[data-style]').forEach(b => b.addEventListener('click', () => { page().style = b.dataset.style; saveSoon(); cam.zoom = 0; cam.panX = cam.panY = 0; refresh(); }));
document.querySelectorAll('#worlds [data-world]').forEach(b => b.addEventListener('click', () => { db.world = b.dataset.world; saveSoon(); refresh({ fade: true }); }));
$('snow').addEventListener('click', () => { db.snow = snowing() ? 'off' : 'on'; saveSoon(); ui(); kick(); });
let spinT;
function setSpin() { clearInterval(spinT); if (db.spin) spinT = setInterval(() => { if (!document.hidden) turn(); }, 7000); }
$('spin').addEventListener('click', () => { db.spin = !db.spin; saveSoon(); setSpin(); ui(); });
function turn() { db.turn = (db.turn + 1) % 4; saveSoon(); if (art) fade = { canvas: art.canvas, W: art.W, H: art.H, t0: performance.now() }; raster(); kick(); }
$('turn').addEventListener('click', turn);
const zoom = d => { cam.zoom += d; layout(); if (cam.s === 1 && d < 0) cam.zoom -= d; kick(); };
$('zin').addEventListener('click', () => zoom(1));
$('zout').addEventListener('click', () => zoom(-1));
$('fit').addEventListener('click', () => { cam.zoom = 0; cam.panX = cam.panY = 0; kick(); });
$('focus').addEventListener('click', () => { const on = document.body.classList.toggle('focus'); $('focus').classList.toggle('on', on); setTimeout(kick, 30); });
let wheelAcc = 0;
canvas.addEventListener('wheel', e => { e.preventDefault(); wheelAcc += e.deltaY; if (Math.abs(wheelAcc) > 60) { zoom(wheelAcc < 0 ? 1 : -1); wheelAcc = 0; } }, { passive: false });

// pan, and peek into windows
let drag = null;
function pick(e) {
  if (!art) return -1;
  const r = canvas.getBoundingClientRect(), x = Math.floor(((e.clientX - r.left) * cam.dpr - cam.ox) / cam.s), y = Math.floor(((e.clientY - r.top) * cam.dpr - cam.oy) / cam.s);
  let best = -1, bd = 9;
  for (const [w, L] of art.lights) { const d = Math.abs(L.x - x) + Math.abs(L.y - y); if (d < bd) { bd = d; best = w; } }
  if (best < 0 && x >= 0 && y >= 0 && x < art.W && y < art.H) { const id = art.ids[y * art.W + x]; const v = id && model.voxels[id - 1]; if (v && v.w >= 0 && v.w < model.stats.sentences.length) best = v.w; }
  return best;
}
function peek(w, e) {
  const el = $('peek');
  hoverW = w;
  canvas.classList.toggle('peeking', w >= 0);
  if (w < 0) { el.classList.remove('show'); return; }
  const s = model.stats.sentences[w];
  el.innerHTML = `<b>Window ${w + 1}</b>`; el.append(document.createTextNode(s.s.length > 180 ? s.s.slice(0, 177) + '…' : s.s));
  const r = $('scene').getBoundingClientRect(), bw = Math.min(280, r.width - 24);
  let x = e.clientX - r.left + 16, y = e.clientY - r.top + 16;
  if (x + bw > r.width - 12) x = e.clientX - r.left - bw - 16;
  if (y + 120 > r.height) y = e.clientY - r.top - 130;
  el.style.left = Math.max(12, x) + 'px'; el.style.top = Math.max(12, y) + 'px'; el.classList.add('show');
}
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: false }; });
canvas.addEventListener('pointermove', e => {
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 5) { drag.moved = true; canvas.classList.add('drag'); peek(-1); }
    if (drag.moved) { cam.panX += dx; cam.panY += dy; kick(); }
    drag.x = e.clientX; drag.y = e.clientY; return;
  }
  if (e.pointerType === 'mouse') peek(pick(e), e);
});
canvas.addEventListener('pointerleave', () => { if (!drag) peek(-1); });
canvas.addEventListener('pointerup', e => {
  const tapped = drag && !drag.moved; drag = null; canvas.classList.remove('drag');
  if (!tapped) return;
  const w = pick(e);
  if (w < 0) { peek(-1); return; }
  if (e.pointerType !== 'mouse' && hoverW !== w) { peek(w, e); return; }   // touch: first tap peeks, second jumps
  jump(w);
});
function jump(w) {
  const s = model.stats.sentences[w], ta = $('text');
  peek(-1);
  if (document.body.classList.contains('focus')) $('focus').click();
  ta.focus(); ta.setSelectionRange(s.start, s.start); ta.blur(); ta.focus(); ta.setSelectionRange(s.start, s.end);
  const lh = parseFloat(getComputedStyle(ta).lineHeight) || 28, chars = Math.max(20, Math.floor(ta.clientWidth / 9.1));
  const lines = ta.value.slice(0, s.start).split('\n').reduce((n, l) => n + Math.max(1, Math.ceil(l.length / chars)), 0) - 1;
  ta.scrollTop = Math.max(0, lines * lh - ta.clientHeight / 3);
}

// sheets
function openSheet(id) { const s = $(id); s.classList.add('open'); s.setAttribute('aria-hidden', 'false'); if (id === 'keepsSheet') listKeeps(); setTimeout(() => s.querySelector('[data-close]').focus(), 50); }
function closeSheets() { document.querySelectorAll('.backdrop.open').forEach(s => { s.classList.remove('open'); s.setAttribute('aria-hidden', 'true'); }); }
document.querySelectorAll('.backdrop').forEach(b => b.addEventListener('click', e => { if (e.target === b || e.target.closest('[data-close]')) closeSheets(); }));
$('openKeeps').addEventListener('click', () => openSheet('keepsSheet'));
$('openSettings').addEventListener('click', () => openSheet('settingsSheet'));
function listKeeps() {
  const ul = $('keepList'); ul.textContent = '';
  [...db.pages].sort((a, b) => b.updated - a.updated).forEach(pg => {
    const st = analyze(pg.text, pg.style), li = document.createElement('li');
    li.className = 'keep' + (pg.id === db.current ? ' on' : '');
    const open = document.createElement('button'), n = document.createElement('span'), w = document.createElement('span');
    n.className = 'kn'; n.textContent = pg.title.trim() || st.name; w.className = 'kw'; w.textContent = st.words.toLocaleString() + 'w';
    open.append(n, w); open.addEventListener('click', () => { persist(); db.current = pg.id; saveSoon(); loadPage(); closeSheets(); });
    li.append(open);
    if (db.pages.length > 1) {
      const del = document.createElement('button'); del.className = 'del'; del.textContent = '✕'; del.setAttribute('aria-label', 'Delete ' + n.textContent);
      del.addEventListener('click', () => { if (!del.dataset.arm) { del.dataset.arm = 1; del.textContent = 'Delete?'; del.style.width = 'auto'; del.style.padding = '0 12px'; del.style.borderRadius = '999px'; del.style.color = 'var(--accent)'; return; } db.pages = db.pages.filter(p => p.id !== pg.id); if (db.current === pg.id) { db.current = db.pages[0].id; loadPage(); } persist(); listKeeps(); });
      li.append(del);
    }
    ul.append(li);
  });
}
function addKeep(text) { const pg = mkPage(text, '', page().style); db.pages.push(pg); db.current = pg.id; persist(); loadPage(); closeSheets(); if (!text) $('text').focus(); }
$('newKeep').addEventListener('click', () => addKeep(''));
$('sampleKeep').addEventListener('click', () => addKeep(SAMPLE));
function download(blob, name) { const a = document.createElement('a'), url = URL.createObjectURL(blob); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000); }
const slug = () => ($('castle').textContent || 'wordkeep').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'wordkeep';
$('exportTxt').addEventListener('click', () => { const pg = page(); download(new Blob([(pg.title.trim() ? pg.title.trim() + '\n\n' : '') + pg.text], { type: 'text/plain;charset=utf-8' }), slug() + '.txt'); });
$('exportPng').addEventListener('click', () => {
  const k = 4, W = WORLDS[model.world], c = document.createElement('canvas'); c.width = (art.W + 24) * k; c.height = (art.H + 24) * k;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  const g = x.createLinearGradient(0, 0, 0, c.height); g.addColorStop(0, W.sky[0]); g.addColorStop(1, W.sky[1]); x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(art.canvas, 12 * k, 12 * k, art.W * k, art.H * k);
  c.toBlob(b => b && download(b, `${slug()}-${model.world}.png`), 'image/png');
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (document.querySelector('.backdrop.open')) closeSheets(); else if (document.body.classList.contains('focus')) $('focus').click(); peek(-1); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); persist(); herald('Kept'); }
});
window.addEventListener('pagehide', persist);
new ResizeObserver(() => kick()).observe($('scene'));
// the clock world drifts on its own: check every minute
setInterval(() => { if (db.world === 'auto' && clockWorld() !== model.world) refresh({ fade: true }); }, 60000);

setSpin();
loadPage();
</script>
</body>
