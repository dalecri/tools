<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Preview — iPhone 14 Pro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0c;
    --surface: #111114;
    --border: #222228;
    --accent: #c8ff57;
    --text: #e8e8ec;
    --muted: #666672;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }

  .layout {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 24px;
    gap: 0;
  }

  .top-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 700px;
    flex-shrink: 0;
    margin-bottom: 24px;
  }

  header h1 {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    white-space: nowrap;
  }

  header p {
    font-size: 10px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    white-space: nowrap;
  }

  .input-row {
    display: flex;
    gap: 8px;
    flex: 1;
  }

  .url-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    outline: none;
    transition: border-color 0.2s;
    min-width: 0;
  }

  .url-input::placeholder { color: var(--muted); }
  .url-input:focus { border-color: var(--accent); }

  .go-btn {
    background: var(--accent);
    color: #0a0a0c;
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .go-btn:hover { opacity: 0.88; }
  .go-btn:active { transform: scale(0.97); }

  .error-banner {
    background: rgba(255,60,60,0.1);
    border: 1px solid rgba(255,60,60,0.2);
    border-radius: 8px;
    padding: 8px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: #ff8080;
    display: none;
    text-align: center;
    flex-shrink: 0;
    max-width: 700px;
    width: 100%;
    margin-bottom: 12px;
  }

  .phone-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    width: 100%;
  }

  .phone-shadow {
    position: absolute;
    inset: -20px;
    border-radius: 80px;
    background: radial-gradient(ellipse at 50% 60%, rgba(200,255,87,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .phone-scaler {
    width: 393px;
    height: 852px;
    transform-origin: center center;
    position: relative;
    flex-shrink: 0;
  }

  .phone {
    width: 393px;
    height: 852px;
    background: #1a1a1e;
    border-radius: 54px;
    border: 1.5px solid #333340;
    position: relative;
    box-shadow:
      0 0 0 1px #0a0a0c,
      0 0 0 2px #2a2a30,
      0 40px 80px rgba(0,0,0,0.8),
      inset 0 1px 0 rgba(255,255,255,0.06);
    overflow: hidden;
  }

  /* Left buttons */
  .phone::before {
    content: '';
    position: absolute;
    left: -3px;
    top: 130px;
    width: 3px;
    height: 32px;
    background: #2a2a30;
    border-radius: 2px 0 0 2px;
    box-shadow: 0 46px 0 #2a2a30, 0 90px 0 #2a2a30;
  }

  /* Right button */
  .phone::after {
    content: '';
    position: absolute;
    right: -3px;
    top: 160px;
    width: 3px;
    height: 72px;
    background: #2a2a30;
    border-radius: 0 2px 2px 0;
  }

  .screen {
    position: absolute;
    inset: 12px;
    border-radius: 42px;
    overflow: hidden;
    background: #000;
  }

  .dynamic-island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 34px;
    background: #000;
    border-radius: 20px;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .di-cam {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #111;
    border: 1.5px solid #1a1a1a;
    position: relative;
  }

  .di-cam::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: #0a2a3a;
  }

  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 54px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 24px 8px;
    z-index: 9;
    pointer-events: none;
    color: #fff;
    font-family: 'DM Mono', monospace;
  }

  .status-time { font-size: 15px; font-weight: 600; font-family: 'Syne', sans-serif; }
  .status-icons { display: flex; gap: 5px; align-items: center; }
  .status-icons svg { width: 16px; height: 16px; fill: white; }

  .frame-container {
    position: absolute;
    inset: 0;
    top: 54px;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: var(--muted);
    background: #0d0d10;
  }

  .placeholder svg { opacity: 0.3; }

  .placeholder p {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    opacity: 0.6;
  }

  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: rgba(255,255,255,0.25);
    border-radius: 3px;
    z-index: 10;
  }

  .bottom-meta {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
    flex-shrink: 0;
    margin-top: 20px;
  }
</style>
</head>
<body>
<div class="layout">

  <div class="top-bar">
    <header>
      <h1>Mobile Preview</h1>
      <p>iPhone 14 Pro</p>
    </header>
    <div class="input-row">
      <input class="url-input" id="urlInput" type="url" placeholder="https://example.com" autocomplete="off" spellcheck="false" />
      <button class="go-btn" onclick="loadUrl()">Load</button>
    </div>
  </div>

  <div class="error-banner" id="errorBanner">
    ⚠ This site blocks iframe embedding (X-Frame-Options / CSP). Try a different URL.
  </div>

  <div class="phone-wrap" id="phoneWrap">
    <div class="phone-shadow"></div>
    <div class="phone-scaler" id="phoneScaler">
      <div class="phone">
        <div class="dynamic-island"><div class="di-cam"></div></div>
        <div class="screen">
          <div class="status-bar">
            <span class="status-time" id="clock">9:41</span>
            <div class="status-icons">
              <!-- Signal -->
              <svg viewBox="0 0 24 24"><rect x="1" y="16" width="3" height="5"/><rect x="6" y="12" width="3" height="9"/><rect x="11" y="8" width="3" height="13"/><rect x="16" y="4" width="3" height="17" opacity="0.3"/></svg>
              <!-- WiFi -->
              <svg viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14 0" opacity="0.3"/><path d="M1.42 9a16 16 0 0 1 21.16 0" opacity="0.2"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/></svg>
              <!-- Battery -->
              <svg viewBox="0 0 24 24"><rect x="1" y="6" width="18" height="12" rx="2" stroke="white" stroke-width="1.5" fill="none"/><rect x="3" y="8" width="13" height="8" rx="1"/><path d="M20 10v4" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>
            </div>
          </div>
          <div class="frame-container" id="frameContainer">
            <div class="placeholder">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="2" width="14" height="20" rx="2"/>
                <line x1="12" y1="18" x2="12" y2="18.01"/>
              </svg>
              <p>Enter a URL above</p>
            </div>
          </div>
          <div class="home-indicator"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-meta">393 × 852 · 460 ppi · iOS 17</div>

</div>

<script>
  const PHONE_W = 393;
  const PHONE_H = 852;

  function scalePhone() {
    const wrap = document.getElementById('phoneWrap');
    const scaler = document.getElementById('phoneScaler');
    const availW = wrap.clientWidth;
    const availH = wrap.clientHeight;
    const scale = Math.min(availW / PHONE_W, availH / PHONE_H, 1);
    scaler.style.transform = `scale(${scale})`;
    const shrink = PHONE_H * (1 - scale);
    scaler.style.marginTop = `${-shrink / 2}px`;
    scaler.style.marginBottom = `${-shrink / 2}px`;
  }

  window.addEventListener('resize', scalePhone);
  scalePhone();

  function updateClock() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes().toString().padStart(2, '0');
    document.getElementById('clock').textContent = `${h}:${m}`;
  }
  updateClock();
  setInterval(updateClock, 10000);

  function loadUrl() {
    let val = document.getElementById('urlInput').value.trim();
    if (!val) return;
    if (!/^https?:\/\//i.test(val)) val = 'https://' + val;

    document.getElementById('errorBanner').style.display = 'none';

    const container = document.getElementById('frameContainer');
    container.innerHTML = '';

    const iframe = document.createElement('iframe');
    iframe.src = val;
    iframe.style.cssText = 'width:100%;height:100%;border:none;display:block;';

    // Detect load failure via blank doc (cross-origin blocks will throw)
    iframe.addEventListener('load', () => {
      try {
        const doc = iframe.contentDocument || iframe.contentWindow?.document;
        if (!doc || !doc.body || doc.body.innerHTML.trim() === '') {
          document.getElementById('errorBanner').style.display = 'block';
        }
      } catch (e) {
        // Cross-origin — we can't inspect, assume it loaded
      }
    });

    container.appendChild(iframe);
  }

  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') loadUrl();
  });
</script>
</body>
</html>
