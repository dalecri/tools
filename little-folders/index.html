function seed(){const data=legacySeed();for(const f of data.folders)for(const i of f.items)i.r=0;data.straightDefaults=1;return data}
function migrateStraightDefaults(data){if(data.straightDefaults)return false;const originals=legacySeed().folders;for(const f of data.folders){const original=originals.find(o=>o.name===f.name);for(const i of f.items){const preset=original?.items.find(o=>o.type===i.type&&(i.type==='photo'?o.src===i.src:o.title===i.title));if(!i.rotationEdited&&((preset&&preset.r===i.r)||(i.type==='photo'&&i.src?.startsWith('data:')&&[-5,0,5].includes(i.r))))i.r=0}}data.straightDefaults=1;return true}

function dragStart(e){
 if(e.button!==0)return;

 }else if(mode==='rotate'){

 };

}

app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.newHeading){add('heading',Number(b.dataset.newHeading));return}if(b.dataset.open){active=b.dataset.open;selected=null;zoom=innerWidth<700?.62:Math.min(1,(innerWidth-50)/1000);render();return}if(b.dataset.folderEdit){folderDialog(b.dataset.folderEdit);return}if(b.dataset.filter){filter=b.dataset.filter;render();return}if(b.dataset.add){add(b.dataset.add);return}if(b.dataset.check!==undefined){const i=folder().items.find(i=>i.id===b.dataset.item);i.tasks[Number(b.dataset.check)].done=!i.tasks[Number(b.dataset.check)].done;update();const row=b.closest('.task'),done=i.tasks[Number(b.dataset.check)].done;row.classList.toggle('done',done);b.textContent=done?'✓':'';b.setAttribute('aria-pressed',done);b.setAttribute('aria-label',(done?'Uncheck ':'Complete ')+i.tasks[Number(b.dataset.check)].text);return}if(b.hasAttribute('data-todo-done')){document.activeElement?.blur();selected=null;selectionBar();return}if(b.hasAttribute('data-task-add')||b.hasAttribute('data-task-remove')){const i=folder().items.find(i=>i.id===b.closest('.item').dataset.id);selected=i.id;if(b.hasAttribute('data-task-add')){i.tasks.push({text:'',done:false});refreshItem(i);document.querySelector(`[data-id="${i.id}"] [data-task="${i.tasks.length-1}"]`).focus()}else{i.tasks.splice(Number(b.dataset.taskRemove),1);refreshItem(i)}update();return}const a=b.dataset.action;switch(a){case'new':folderDialog();break;case'theme':state.dark=!state.dark;save();document.body.classList.toggle('dark',state.dark);break;case'home':active=null;selected=null;render();break;case'fit':zoom=Math.min(1,(innerWidth-20)/1000);applyZoom();break;case'zoomin':zoom=Math.min(1.5,zoom+.1);applyZoom();break;case'zoomout':zoom=Math.max(.3,zoom-.1);applyZoom();break;case'deselect':document.activeElement?.blur();selected=null;selectionBar();break;case'edit':editItem();break;case'front':{const f=folder(),i=item();f.items=f.items.filter(x=>x!==i);f.it app.addEventListener('focusin',e=>{const el=e.target.closest('.item');if(el){selected=el.dataset.id;selectionBar()}});
app.addEventListener('input',e=>{const el=e.target.closest('.item'),field=e.target.dataset.field;if(!el||!field)return;const i=folder().items.find(i=>i.id===el.dataset.id),value=e.target.innerText.replace(/\r/g,'');if(field==='task')i.tasks[Number(e.target.dataset.task)].text=value;else i[field]=value;if(i.type==='photo')el.querySelector('img').alt=i.title||'Photo sticker';update()});
app.addEventListener('change',e=>{if(e.target.matches('.heading-level')){const i=item();i.level=Number(e.target.value);refreshItem(i);update();return}if(!e.target.dataset.coordinate)return;const el=e.target.closest('.item'),i=folder().items.find(i=>i.id===el.dataset.id);if(!e.target.checkValidity()||e.target.value.trim()===''){e.target.reportValidity();e.target.value=i[e.target.dataset.coordinate];return}i[e.target.dataset.coordinate]=Number(e.target.value);el.querySelector('iframe').src=mapURL(i);el.querySelector('.full-map').href=`https://www.openstreetmap.org/?mlat=${i.lat}&mlon=${i.lon}#map=14/${i.lat}/${i.lon}`;update()});
app.addEventListener('keydown',e=>{
 const field=e.target.dataset.field;if(!field)return;
 if(e.key==='Escape'){e.target.blur();return}
 if(e.key==='Enter'&&!e.shiftKey&&field!=='body'&&field!=='footer'){
 e.preventDefault();if(field==='task'){const el=e.target.closest('.item'),i=folder().items.find(i=>i.id===el.dataset.id),n=Number(e.target.dataset.task)+1;i.tasks.splice(n,0,{text:'',done:false});refreshItem(i);el.querySelector(`[data-task="${n}"]`).focus();update()}else e.target.blur();
 }
});
</script></body></html>
