<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e4e8e3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131816" media="(prefers-color-scheme: dark)">
<title>Little folders</title>
<meta name="description" content="Your photos, thoughts and little collections, all in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Gochi+Hand&family=Instrument+Sans:wght@400;500;600;700&family=Young+Serif&display=swap">
<style>
/* Layout: a stationery desk. Home = a row of real file folders with tabs; a folder opens onto a green cutting mat (1 cm = 40 px) where paper things get taped down. */
:root{
  --desk:#e4e8e3; --surface:#f7f8f4; --ink:#1e2723; --muted:#5f6b65; --line:#cbd2cb; --chip:#d8ded7;
  --pen:#2c4fc9; --pen-soft:#2c4fc922; --danger:#b4382f;
  --mat:#4c8a6f; --mat-minor:rgba(255,255,255,.13); --mat-major:rgba(255,255,255,.3); --mat-text:rgba(255,255,255,.62);
  --paper:#fdfcf7; --paper-ink:#25292b; --paper-muted:#8a8c86; --rule:#a8c8e2; --margin-red:#e06a6f;
  --graph:#f3f7f8; --graph-line:#bcd3dc; --legal:#f8e88a; --pad-band:#7a2f2b;
  --manila-back:#dcc08a; --manila-front:#ead3a1; --manila-ink:#5e4820;
  --sage-back:#a3bb9c; --sage-front:#bdd0b5; --sage-ink:#35502f;
  --sky-back:#a4bfd6; --sky-front:#c0d4e5; --sky-ink:#2e4a65;
  --blush-back:#deaa9f; --blush-front:#ecc4ba; --blush-ink:#743b30;
  --butter-back:#e7cf6a; --butter-front:#f1e195; --butter-ink:#665513;
  --slate-back:#98a1a9; --slate-front:#b5bcc2; --slate-ink:#353d44;
  --tape0:#f2b5c4; --tape1:#9fd3bd; --tape2:#f5d462; --tape3:#a6c1f0; --tape4:#d6bdf0;
  --dymo0:#1d1e20; --dymo1:#c2302a; --dymo2:#1f45a3; --dymo3:#1e6a47;
  --shadow:rgba(20,30,25,.28);
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-hand:"Gochi Hand","Comic Sans MS","Bradley Hand",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#131816; --surface:#1d2320; --ink:#e7ece8; --muted:#97a39d; --line:#2f3833; --chip:#27302c;
  --pen:#7f9cff; --pen-soft:#7f9cff2e; --danger:#ef7d72;
  --mat:#1f4a39; --mat-minor:rgba(255,255,255,.07); --mat-major:rgba(255,255,255,.17); --mat-text:rgba(255,255,255,.42);
  --paper:#ece9df; --graph:#e4e9ea; --legal:#e7d77c;
  --manila-back:#a88e5c; --manila-front:#c2a873; --sage-back:#728a6c; --sage-front:#8ba384;
  --sky-back:#6f88a0; --sky-front:#8aa2b8; --blush-back:#a7766c; --blush-front:#c1938a;
  --butter-back:#b19c40; --butter-front:#c9b660; --slate-back:#646d75; --slate-front:#7f888f;
  --shadow:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#131816; --surface:#1d2320; --ink:#e7ece8; --muted:#97a39d; --line:#2f3833; --chip:#27302c;
  --pen:#7f9cff; --pen-soft:#7f9cff2e; --danger:#ef7d72;
  --mat:#1f4a39; --mat-minor:rgba(255,255,255,.07); --mat-major:rgba(255,255,255,.17); --mat-text:rgba(255,255,255,.42);
  --paper:#ece9df; --graph:#e4e9ea; --legal:#e7d77c;
  --manila-back:#a88e5c; --manila-front:#c2a873; --sage-back:#728a6c; --sage-front:#8ba384;
  --sky-back:#6f88a0; --sky-front:#8aa2b8; --blush-back:#a7766c; --blush-front:#c1938a;
  --butter-back:#b19c40; --butter-front:#c9b660; --slate-back:#646d75; --slate-front:#7f888f;
  --shadow:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:15px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
#app{height:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
:focus-visible{outline:2px solid var(--pen);outline-offset:3px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon-btn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn:hover{background:var(--chip)}
.ink-btn{background:var(--ink);color:var(--desk);border-radius:999px;padding:0 16px 0 12px;height:40px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.ink-btn:hover{opacity:.86}

/* ---------- Home ---------- */
.shell{max-width:1080px;margin:0 auto;padding-block:48px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.wordmark{font-family:var(--f-display);font-size:clamp(34px,6vw,52px);line-height:1;letter-spacing:-.02em;margin:0;font-weight:400;text-wrap:balance}
.wordmark em{font-style:normal;color:var(--pen)}
.lede{color:var(--muted);margin:10px 0 0;font-size:15px;max-width:44ch}
.actions{display:flex;gap:8px;align-items:center}
.toolbar{display:flex;align-items:center;gap:12px;margin:40px 0 36px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;background:var(--chip);padding:3px;border-radius:999px}
.pill{border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}
.search{position:relative;flex:1 1 220px;max-width:320px;min-width:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search input{width:100%;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 36px;font-size:14px}
.count-label{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}

.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:44px 32px}
.folder-card{position:relative;min-width:0;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms)}
@keyframes rise{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}
.folder-open{display:block;width:100%;text-align:left}
.folder-art{position:relative;aspect-ratio:5/4;margin-bottom:14px}
.f-tab{position:absolute;top:2%;height:16%;width:54%;background:var(--fc-back);border-radius:9px 9px 0 0;display:flex;align-items:flex-start;padding:7px 10px 0}
.f-tab.left{left:3%}.f-tab.right{right:3%}
.f-label{background:var(--paper);color:var(--paper-ink);font-size:12px;font-weight:600;padding:2px 7px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.f-back{position:absolute;inset:14% 0 0;background:var(--fc-back);border-radius:4px 4px 8px 8px}
.peeks{position:absolute;inset:15% 7% 0}
.peek{position:absolute;top:4%;width:44%;aspect-ratio:4/5;transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 2px 6px var(--shadow)}
.peek.k0{left:2%;transform:rotate(-7deg)}.peek.k1{left:28%;top:0;transform:rotate(2deg)}.peek.k2{left:54%;top:6%;transform:rotate(8deg)}
.p-photo{background:var(--paper);padding:5px 5px 14px}.p-photo img{width:100%;height:100%;object-fit:cover;display:block}
.p-index{background:var(--paper) repeating-linear-gradient(to bottom,transparent 0 11px,var(--rule) 11px 12px);border-top:14px solid var(--paper);aspect-ratio:5/4}
.p-graph{background-color:var(--graph);background-image:linear-gradient(var(--graph-line) 1px,transparent 1px),linear-gradient(90deg,var(--graph-line) 1px,transparent 1px);background-size:8px 8px}
.p-pad{background:var(--legal) repeating-linear-gradient(to bottom,transparent 0 10px,var(--rule) 10px 11px);border-top:10px solid var(--pad-band)}
.folder-open:hover .peek.k0{transform:translateY(-16%) rotate(-10deg)}
.folder-open:hover .peek.k1{transform:translateY(-22%) rotate(1deg)}
.folder-open:hover .peek.k2{transform:translateY(-14%) rotate(11deg)}
.f-front{position:absolute;left:0;right:0;bottom:0;height:70%;background:var(--fc-front);border-radius:3px 3px 8px 8px;transform-origin:50% 100%;transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 14px 20px -14px var(--shadow)}
.f-front::after{content:"";position:absolute;left:0;right:0;bottom:9%;height:7px;border-top:1px solid rgba(0,0,0,.09);border-bottom:1px solid rgba(0,0,0,.09)}
.folder-open:hover .f-front{transform:perspective(700px) rotateX(16deg)}
.stk{position:absolute;width:44px;height:44px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:23px;box-shadow:0 1px 2px var(--shadow)}
.stk.s1{left:9%;top:20%;transform:rotate(-10deg)}.stk.s2{left:calc(9% + 34px);top:34%;transform:rotate(9deg);width:38px;height:38px;font-size:19px}
.clip{position:absolute;right:12%;top:-22px;width:20px;height:52px;fill:none;stroke:var(--muted);stroke-width:2.2;transform:rotate(8deg)}
.empty-stamp{position:absolute;right:9%;bottom:24%;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fc-ink);border:1.5px solid currentColor;border-radius:3px;padding:3px 7px;transform:rotate(-6deg);opacity:.65}
.folder-meta{display:flex;flex-direction:column;gap:3px;padding-right:40px}
.folder-name{font-family:var(--f-display);font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.folder-sub{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.folder-menu{position:absolute;right:-4px;bottom:2px;color:var(--muted)}
.c-manila{--fc-back:var(--manila-back);--fc-front:var(--manila-front);--fc-ink:var(--manila-ink)}
.c-sage{--fc-back:var(--sage-back);--fc-front:var(--sage-front);--fc-ink:var(--sage-ink)}
.c-sky{--fc-back:var(--sky-back);--fc-front:var(--sky-front);--fc-ink:var(--sky-ink)}
.c-blush{--fc-back:var(--blush-back);--fc-front:var(--blush-front);--fc-ink:var(--blush-ink)}
.c-butter{--fc-back:var(--butter-back);--fc-front:var(--butter-front);--fc-ink:var(--butter-ink)}
.c-slate{--fc-back:var(--slate-back);--fc-front:var(--slate-front);--fc-ink:var(--slate-ink)}
.new-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;aspect-ratio:5/4;width:100%;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);font-weight:500;margin-top:0}
.new-card:hover{border-color:var(--pen);color:var(--pen)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 16px;line-height:1.6}
.home-footer{margin-top:72px;display:flex;gap:10px;align-items:center;justify-content:center;color:var(--muted);font-size:13px;flex-wrap:wrap;text-align:center}
.home-footer kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px}

/* ---------- Board ---------- */
.board{display:flex;flex-direction:column;height:100%}
.board-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--desk);position:relative;z-index:6}
.board-title{display:flex;align-items:center;gap:8px;min-width:0}
.board-title h1{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board-title small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:2px}
.board-title>div{min-width:0}
.swatch-dot{width:12px;height:12px;border-radius:3px;background:var(--fc-front);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);flex:none}
.board-viewport{flex:1;overflow:auto;position:relative;overscroll-behavior:contain}
.board-space{padding:28px 28px 150px;width:max-content;margin:0 auto}
.mat-frame{position:relative}
.mat{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:14px;background-color:var(--mat);box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 30px 50px -30px var(--shadow),0 2px 4px var(--shadow)}
.mat-deco{position:absolute;inset:0;border-radius:14px;overflow:hidden;pointer-events:none;background-image:linear-gradient(var(--mat-major) 1px,transparent 1px),linear-gradient(90deg,var(--mat-major) 1px,transparent 1px),linear-gradient(var(--mat-minor) 1px,transparent 1px),linear-gradient(90deg,var(--mat-minor) 1px,transparent 1px);background-size:200px 200px,200px 200px,40px 40px,40px 40px}
.mat-deco i{position:absolute;left:0;top:0;width:2000px;height:1px;background:var(--mat-major);transform-origin:0 0;transform:rotate(45deg)}
.mat-deco i+i{transform:rotate(60deg)}
.tick{position:absolute;font-family:var(--f-mono);font-size:10px;color:var(--mat-text);font-variant-numeric:tabular-nums}
.tick.t{top:4px;transform:translateX(3px)}.tick.l{left:5px;transform:translateY(2px)}
.mat-brand{position:absolute;right:16px;bottom:10px;font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;color:var(--mat-text);text-transform:uppercase}

.item{position:absolute;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.item:active{cursor:grabbing}
.item.selected{outline:1.5px dashed var(--pen);outline-offset:9px;border-radius:4px}
.item:focus-visible{outline:2px solid var(--pen);outline-offset:9px}
.item [contenteditable]{cursor:text;user-select:text;-webkit-user-select:text;touch-action:auto;min-width:12px;outline:none;overflow-wrap:anywhere;white-space:pre-wrap;border-radius:2px}
.item [contenteditable]:focus{background:rgba(44,79,201,.07)}
.item [contenteditable]:empty::before{content:attr(data-placeholder);color:var(--paper-muted);pointer-events:none}

.polaroid{margin:0;background:var(--paper);padding:11px 11px 0;border-radius:2px;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.14),0 12px 22px -10px var(--shadow)}
.polaroid .pic{aspect-ratio:1;overflow:hidden;background:#cfd3cf}
.polaroid img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.polaroid figcaption{min-height:46px;padding:9px 4px 11px;font-family:var(--f-hand);font-size:21px;line-height:1.15;color:var(--paper-ink);text-align:center}
.item:not(.selected) .polaroid figcaption [contenteditable]:empty::before{content:""}
.tape{position:absolute;top:-13px;left:50%;width:98px;height:27px;transform:translateX(-50%) rotate(-3deg);background:var(--tape);opacity:.86;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 5px,transparent 5px 10px);clip-path:polygon(0 8%,4% 0,8% 10%,12% 0,88% 0,92% 9%,96% 0,100% 8%,100% 92%,96% 100%,92% 90%,88% 100%,12% 100%,8% 91%,4% 100%,0 92%);pointer-events:none}

.card{background:var(--paper);color:var(--paper-ink);padding:16px 20px 22px;border-radius:2px;box-shadow:0 1px 1px rgba(0,0,0,.12),0 12px 20px -12px var(--shadow)}
.card-meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-muted)}
.card h3{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.25;margin:10px 0 0;padding-bottom:8px}
.index h3{border-bottom:2px solid var(--margin-red)}
.card p{margin:0;font-size:15px;line-height:28px;min-height:84px}
.index p{background:repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px);padding-top:2px}
.graph{background-color:var(--graph);background-image:linear-gradient(var(--graph-line) 1px,transparent 1px),linear-gradient(90deg,var(--graph-line) 1px,transparent 1px);background-size:14px 14px;background-position:-1px -1px}
.graph h3{font-family:var(--f-mono);font-weight:500;font-size:17px;letter-spacing:-.01em;border-bottom:1.5px solid var(--paper-ink)}
.graph p{font-family:var(--f-mono);font-size:14px;line-height:28px;padding-top:4px}

.pad{border-radius:3px 3px 2px 2px;overflow:hidden;box-shadow:0 1px 1px rgba(0,0,0,.14),0 14px 22px -12px var(--shadow);color:var(--paper-ink)}
.pad-top{background:var(--pad-band);color:#f4e9e2;display:flex;align-items:center;gap:8px;padding:9px 12px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;cursor:grab;position:relative}
.pad-top::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:repeating-linear-gradient(90deg,var(--pad-band) 0 6px,transparent 6px 12px)}
.pad-top time{white-space:nowrap}
.pad-top .when{opacity:.7}
.pad-top button{margin-left:auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#f4e9e2;padding:2px 0 2px 8px;font-family:var(--f-mono)}
.pad-sheet{background:var(--legal);background-image:linear-gradient(90deg,transparent 33px,var(--margin-red) 33px 34px,transparent 34px 37px,var(--margin-red) 37px 38px,transparent 38px),repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px);padding:18px 14px 14px 46px;min-height:220px}
.pad-sheet h3{font-family:var(--f-ui);font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px;line-height:28px}
.task{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:28px;position:relative}
.task .check{position:absolute;left:-36px;top:6px;width:16px;height:16px;border:1.5px solid var(--paper-ink);border-radius:3px;display:grid;place-items:center;background:transparent}
.task .check::before{content:"";position:absolute;inset:-8px}
.task .check svg{width:13px;height:13px;stroke:var(--pen);stroke-width:2.6;fill:none;opacity:0}
.task.done .check svg{opacity:1}
.task.done [contenteditable]{text-decoration:line-through;text-decoration-color:var(--pen);text-decoration-thickness:2px;color:var(--paper-muted)}
.task [contenteditable]{flex:1;min-width:0}
.remove-task{visibility:hidden;color:var(--paper-muted);font-size:18px;width:22px;height:28px;flex:none}
.item.selected .remove-task{visibility:visible}
.add-task{display:none;font-size:13px;color:var(--paper-muted);line-height:28px}
.item.selected .add-task{display:block}
.pad-footer{margin-top:10px;font-family:var(--f-hand);font-size:19px;line-height:28px;color:var(--paper-ink)}
.item:not(.selected) .pad-footer [contenteditable]:empty::before{content:""}

.postcard{background:var(--paper);color:var(--paper-ink);padding:9px;border-radius:3px;box-shadow:0 1px 1px rgba(0,0,0,.14),0 12px 22px -12px var(--shadow)}
.map-img{position:relative;border-radius:2px;overflow:hidden;aspect-ratio:5/3;background:#e8e1d0}
.map-img img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.postmark{position:absolute;right:10px;top:10px;width:58px;height:58px;border:1.5px solid rgba(40,50,70,.45);border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:8px;letter-spacing:.12em;color:rgba(40,50,70,.6);text-align:center;line-height:1.3;transform:rotate(-12deg);pointer-events:none}
.pc-body{display:flex;align-items:flex-end;gap:10px;padding:11px 5px 4px}
.pc-body>div{flex:1;min-width:0}
.pc-body strong{display:block;font-family:var(--f-display);font-weight:400;font-size:18px;line-height:1.25}
.coords{display:block;font-family:var(--f-mono);font-size:11px;color:var(--paper-muted);margin-top:3px;font-variant-numeric:tabular-nums}
.pc-link{font-family:var(--f-mono);font-size:11px;color:var(--pen);text-decoration:none;white-space:nowrap}
.pc-link:hover{text-decoration:underline}
.map-coordinates{display:none;gap:8px;padding:8px 5px 4px}
.item.selected .map-coordinates{display:flex}

function viewCenter(){const v=$('#viewport'),fr=$('#frame');if(!v||!fr)return{x:120,y:120};const vr=v.getBoundingClientRect(),r=fr.getBoundingClientRect();return{x:(vr.left+vr.width/2-r.left)/zoom-140,y:(vr.top+vr.height/2-r.top)/zoom-140}}

 if(type==='heading'){i.level=opt.level;i.r=0}if(type==='todo'){i.tasks=[{text:'',done:false}];i.footer=''}if(type==='map'){i.lat=45.4215;i.lon=-75.6972;i.title='Ottawa, Canada'}

 for(const file of files){try{const bmp=await createImageBitmap(file),c=document.createElement('canvas'),k=Math.min(1,1400/Math.max(bmp.width,bmp.height));c.width=bmp.width*k;c.height=bmp.height*k;c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);bmp.close?.();const p=clampPos({x:base.x+(n%3)*70,y:base.y+Math.floor(n/3)*80+(n%3)*18},260);const it={id:uid(),type:'photo',src:c.toDataURL('image/jpeg',.85),title:'',tape:Math.floor(Math.random()*5),...p,w:260,r:Math.round((Math.random()-.5)*6)};target.items.push(it);selected=it.id;n++}catch{toast('One image couldn’t be opened. Try a JPEG, PNG or WebP.')}}

 if(b.dataset.filter){filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(p=>p.setAttribute('aria-pressed',p.dataset.filter===filter));renderGrid();return}
 if(b.dataset.add){add(b.dataset.add);return}
 if(b.dataset.check!==undefined){const i=folder().items.find(x=>x.id===b.dataset.item),t=i.tasks[+b.dataset.check];t.done=!t.done;touch();b.closest('.task').classList.toggle('done',t.done);b.setAttribute('aria-pressed',t.done);b.setAttribute('aria-label',(t.done?'Uncheck ':'Check off ')+(t.text||'task'));return}
 if(b.hasAttribute('data-todo-done')){document.activeElement?.blur();selected=null;selectionBar();return}
 if(b.hasAttribute('data-task-add')||b.hasAttribute('data-task-remove')){const i=folder().items.find(x=>x.id===b.closest('.item').dataset.id);selected=i.id;if(b.hasAttribute('data-task-add')){i.tasks.push({text:'',done:false});refreshItem(i);document.querySelector(`[data-id="${i.id}"] [data-task="${i.tasks.length-1}"]`)?.focus()}else{i.tasks.splice(+b.dataset.taskRemove,1);refreshItem(i)}touch();return}
 const a=b.dataset.action,i=item();
 switch(a){
  case'new':folderDialog();break;
  case'theme':state.theme=isDark()?'light':'dark';save();applyTheme();b.innerHTML=icon(isDark()?'sun':'moon');break;
  case'home':active=null;selected=null;render();break;
  case'fit':zoom=fitZoom();applyZoom();break;
  case'zoomin':zoom=Math.min(1.6,+(zoom+.1).toFixed(2));applyZoom();break;
  case'zoomout':zoom=Math.max(.3,+(zoom-.1).toFixed(2));applyZoom();break;
  case'deselect':document.activeElement?.blur();selected=null;selectionBar();break;
  case'front':{const f=folder();f.items=f.items.filter(x=>x!==i);f.items.push(i);touch();renderBoard();break}
  case'duplicate':duplicate();break;
  case'remove':removeSelected();break;
  case'tape':i.tape=((i.tape??0)+1)%(i.type==='heading'?4:5);touch();refreshItem(i);break;
 }});
modal.addEventListener('click',e=>{if(e.target.closest('[data-close]')){modal.close();return}if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});
app.addEventListener('keydown',e=>{
 const field=e.target.dataset?.field;
 if(field){if(e.key==='Escape'){e.target.blur();return}
  if(e.key==='Enter'&&!e.shiftKey&&!['body','footer'].includes(field)){e.preventDefault();if(field==='task'){const el=e.target.closest('.item'),i=folder().items.find(x=>x.id===el.dataset.id),n=+e.target.dataset.task+1;i.tasks.splice(n,0,{text:'',done:false});refreshItem(i);el.querySelector(`[data-task="${n}"]`)?.focus();touch()}else e.target.blur()}return}
 if(e.target.closest('input,select'))return;
 const el=e.target.closest('.item');if(!el)return;selected=el.dataset.id;selectionBar();const i=item();
 const h=e.target.closest('[data-handle]');if(h&&e.key.startsWith('Arrow')&&h.dataset.handle!=='move'){e.preventDefault();const d=['ArrowRight','ArrowDown'].includes(e.key)?1:-1;if(h.dataset.handle==='resize')i.w=Math.max(140,Math.min(700,i.w+d*10));else{i.r=(i.r||0)+d*5;i.rotationEdited=true}el.style.width=i.w+'px';el.style.transform=`rotate(${i.r}deg)`;touch();return}
 if(e.key==='Enter'){e.preventDefault();el.querySelector('[contenteditable]')?.focus();return}
 if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();removeSelected();return}
 if(e.key==='Escape'){el.blur();selected=null;selectionBar();return}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='d'){e.preventDefault();duplicate();return}
 if(e.key.startsWith('Arrow')){e.preventDefault();const n=e.shiftKey?CM:5;if(e.key==='ArrowLeft')i.x=Math.max(0,i.x-n);if(e.key==='ArrowRight')i.x=Math.min(W-i.w,i.x+n);if(e.key==='ArrowUp')i.y=Math.max(0,i.y-n);if(e.key==='ArrowDown')i.y=Math.min(H-60,i.y+n);el.style.left=i.x+'px';el.style.top=i.y+'px';touch()}});
app.addEventListener('focusin',e=>{const el=e.target.closest('.item');if(el&&selected!==el.dataset.id){selected=el.dataset.id;selectionBar()}});
app.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;renderGrid();return}
 const el=e.target.closest('.item'),field=e.target.dataset.field;if(!el||!field)return;const i=folder().items.find(x=>x.id===el.dataset.id),v=e.target.innerText.replace(/\r/g,'').replace(/\n$/,'');if(field==='task')i.tasks[+e.target.dataset.task].text=v;else i[field]=v;if(i.type==='photo')el.querySelector('img').alt=i.title||'Photo';touch()});
app.addEventListener('change',e=>{if(e.target.id==='heading-level'){const i=item();i.level=+e.target.value;refreshItem(i);touch();return}
 if(!e.target.dataset.coordinate)return;const el=e.target.closest('.item'),i=folder().items.find(x=>x.id===el.dataset.id),k=e.target.dataset.coordinate;
 if(!e.target.checkValidity()||e.target.value.trim()===''){e.target.reportValidity();e.target.value=i[k];return}
 i[k]=+e.target.value;el.querySelector('.map-img img').src=mapImg(i.lat,i.lon);el.querySelector('.coords').textContent=coordText(i);el.querySelector('.pc-link').href=osm(i);touch()});
$('#upload').onchange=async e=>{await addPhotos(e.target.files);e.target.value=''};
let dragDepth=0;
addEventListener('dragenter',e=>{if(!active||![...(e.dataTransfer?.types||[])].includes('Files'))return;e.preventDefault();if(dragDepth++===0)document.body.insertAdjacentHTML('beforeend','<div class="drop-hint">Drop photos onto the mat</div>')});
addEventListener('dragover',e=>{if(active&&[...(e.dataTransfer?.types||[])].includes('Files'))e.preventDefault()});
const clearDrop=()=>{dragDepth=0;$('.drop-hint')?.remove()};
addEventListener('dragleave',()=>{if(--dragDepth<=0)clearDrop()});
addEventListener('drop',e=>{if(!active)return;e.preventDefault();clearDrop();const p=$('#mat')?matPoint(e):null;addPhotos(e.dataTransfer.files,p?{x:p.x-130,y:p.y-130}:null)});
addEventListener('paste',e=>{if(!active||e.target.closest?.('[contenteditable],input'))return;const files=[...(e.clipboardData?.files||[])];if(files.length){e.preventDefault();addPhotos(files)}});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{const b=$('[data-action="theme"]');if(b)b.innerHTML=icon(isDark()?'sun':'moon')});
addEventListener('resize',()=>{if(active)selectionBar()});

/* ---------- Boot ---------- */
function boot(s,{fresh,failed}={}){if(state)return;state=s;const m=migrate(state);render();if(fresh||m)save();if(failed)toast(failed)}
try{const req=indexedDB.open('little-folders-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('data');
 req.onsuccess=()=>{if(state)return;db=req.result;try{const r=db.transaction('data').objectStore('data').get('state');r.onsuccess=()=>boot(r.result||seed(),{fresh:!r.result});r.onerror=()=>boot(seed(),{failed:'Couldn’t load your saved folders.'})}catch{boot(seed())}};
 req.onerror=()=>boot(seed(),{failed:'Browser storage is off, so changes won’t be kept.'})}
catch{boot(seed(),{failed:'Browser storage is off, so changes won’t be kept.'})}
setTimeout(()=>{if(!state&&!db){boot(seed(),{failed:'Browser storage didn’t respond, so changes won’t be kept.'})}},2500);
</script>

</body>
