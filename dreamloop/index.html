<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DREAMLOOP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"><style>
:root{color-scheme:dark;--bg:#17101e;--panel:#241a2b;--line:#443348;--muted:#9f8fa5;--ink:#f4eaf0;--gold:#f0bd7b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#38263e,var(--bg) 65%);color:var(--ink);font:12px 'Space Mono',monospace}button,select,input{font:inherit;color:inherit}button,select{background:#32243a;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}button:active{transform:scale(.97)}button:hover{border-color:var(--gold)}main{max-width:1120px;margin:auto;padding:20px 14px 48px}header,.toolbar,.controls,.bottom,.rowtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:20px}h1{font-size:23px;letter-spacing:.17em;margin:0;color:var(--gold)}.panel{background:rgba(37,26,44,.93);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:13px}.toolbar{margin-bottom:13px}label{color:var(--muted);display:flex;flex-direction:column;gap:5px;font-size:10px;text-transform:uppercase;letter-spacing:.07em}select{min-width:115px;max-width:190px}input[type=range]{accent-color:var(--gold);width:100%}.play{background:var(--gold);color:#241824;border:0;font-weight:700;min-width:80px}.rowtop{justify-content:space-between;margin-bottom:14px}.grid{display:grid;grid-template-columns:64px repeat(16,minmax(0,1fr));gap:4px;align-items:center}.layer{color:#c8b5ca;font-size:10px}.cell{border:1px solid #49384d;border-radius:5px;background:#302437;aspect-ratio:1/1;min-height:19px;padding:0;position:relative;touch-action:manipulation}.cell:nth-child(4n+1){border-right-color:#81617c}.cell.on{background:#e8ad73;border-color:#f6ce95;box-shadow:inset 0 0 0 2px #d99d65}.cell.ghost{background:#8d789b;border-color:#a794b2}.cell.playing:after{content:'';position:absolute;inset:-3px;border:1px solid #fff2cb;border-radius:7px;pointer-events:none}.beat{font-size:9px;text-align:center;color:#88768c;padding:3px 0}.beat.current{color:var(--gold)}.knobs{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;flex:1}.knobs label{min-width:0}.knobs output{color:var(--gold)}.bottom{align-items:stretch}.bottom>.panel{flex:1;min-width:270px}.codehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:10px;line-height:1.7;color:#dfc9df;max-height:290px;overflow:auto;margin:0}.seed{color:var(--muted);font-size:10px}.small{padding:8px 11px}.starter{font-size:10px}.status{font-size:10px;color:var(--gold)}@media(max-width:650px){main{padding:14px 9px}h1{font-size:18px}.panel{padding:11px}.grid{grid-template-columns:42px repeat(16,minmax(0,1fr));gap:2px}.layer{font-size:8px}.cell{min-height:16px;border-radius:3px}.cell.playing:after{inset:-2px;border-radius:4px}.toolbar>*{flex:1}select{width:100%;min-width:0}.knobs{gap:8px}.beat{font-size:7px}.starter{flex:1}header{gap:8px}}
</style><main><header><h1>DREAMLOOP</h1><div class="rowtop"><span class="seed" id="seedLabel"></span><button class="small" id="share">Share</button></div></header><div class="toolbar"><button class="play" id="play">Play</button><label>Progression<select id="progression"><option>Daydream</option><option>Slow Swirl</option><option>Nightswim</option><option>Electric Haze</option><option>Free</option></select></label><label>Key<select id="key"><option>D</option><option>F</option><option>G</option><option>A</option><option>B dorian</option><option>D dorian</option><option>E dorian</option><option>F# dorian</option></select></label><label>Tempo <output id="tempoOut">78</output><input id="tempo" type="range" min="68" max="96" value="78"></label></div><section class="panel"><div class="rowtop"><span class="status" id="chord">Imaj7</span><button class="small" id="drift">Drift</button></div><div class="grid" id="grid"></div></section><section class="panel controls"><div class="knobs"><label>Haze <output id="hazeOut"></output><input id="haze" type="range" min="0" max="100"></label><label>Swing <output id="swingOut"></output><input id="swing" type="range" min="0" max="30"></label><label>Wobble <output id="wobbleOut"></output><input id="wobble" type="range" min="0" max="100"></label></div></section><div class="toolbar"><button class="starter" data-starter="Best Friend">Best Friend</button><button class="starter" data-starter="Swirl">Swirl</button><button class="starter" data-starter="Electric Feel">Electric Feel</button></div><section class="panel"><div class="codehead"><span class="status">Strudel</span><button class="small" id="copy">Copy</button></div><pre id="code"></pre></section><span class="status" id="status"></span></main><script type="module">
const VERSION='1.2.6',LAYERS=['Pad','Keys','Bass','Kick','Snare','Hat','Lead','Drift'];
const progression={Daydream:[[0,'maj7','Imaj7'],[2,'min7','iii7'],[3,'maj7','IVmaj7'],[4,'sus4','Vsus']], 'Slow Swirl':[[5,'min7','vi7'],[3,'maj7','IVmaj7'],[0,'maj7','Imaj7'],[4,'sus4','Vsus']],Nightswim:[[0,'min7','i7'],[6,'maj7','VII'],[5,'maj7','VI'],[6,'maj7','VII']],'Electric Haze':[[0,'add9','I'],[6,'add9','bVII'],[3,'add9','IV'],[0,'add9','I']],Free:[[0,'maj9','Imaj9']]};
const major=[0,2,4,5,7,9,11],dorian=[0,2,3,5,7,9,10],roots={'D':62,'F':65,'G':67,'A':69,'B dorian':59,'D dorian':62,'E dorian':64,'F# dorian':66};
const hash=s=>{let h=2166136261;for(const c of s){h=Math.imul(h^c.charCodeAt(0),16777619)}return h>>>0};const rng=(seed,tag)=>{let a=(seed^hash(tag))>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}};
const blank=()=>Object.fromEntries(LAYERS.map(x=>[x,Array(16).fill(0)]));const today=new Date(),dateId=Number(`${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`);
let state={grid:blank(),progression:'Daydream',key:'D',tempo:78,haze:42,swing:12,wobble:28,seed:dateId};let playing=false,engine=null,clock=null,step=0,code='',lastStep=-1;
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function starter(name){let g=blank(),set=(l,steps)=>steps.forEach(i=>g[l][i]=1);if(name==='Best Friend'){set('Pad',[0]);set('Keys',[0,3,6,10,13]);set('Bass',[0,8,11]);set('Kick',[0,8]);set('Snare',[4,12]);set('Hat',[2,6,10,14]);set('Lead',[7,15]);return{grid:g,progression:'Daydream',key:'D',tempo:76,haze:28,swing:12,wobble:24,seed:1201}}if(name==='Swirl'){set('Pad',[0,8]);set('Keys',[2,6,10,14]);set('Bass',[0,7,8]);set('Kick',[0,8]);set('Snare',[4,12]);set('Hat',[3,7,11,15]);set('Lead',[10]);return{grid:g,progression:'Slow Swirl',key:'F',tempo:72,haze:88,swing:15,wobble:84,seed:2202}}set('Pad',[0]);set('Keys',[3,7,11,15]);set('Bass',[0,3,6,8,11,14]);set('Kick',[0,7,8]);set('Snare',[4,12]);set('Hat',[2,4,6,10,12,14]);set('Lead',[5,9,13]);return{grid:g,progression:'Electric Haze',key:'G',tempo:92,haze:55,swing:25,wobble:66,seed:3303}}
function drift(){const r=rng(state.seed,'drift');let pos=2+Math.floor(r()*3),notes=Array(16).fill(0),degree=Math.floor(r()*5);for(let i=0;i<16;i++){if(i>=12||i===7||i===8&&r()<.5)continue;if(r()<.6){degree=clamp(degree+(r()<.65?(r()<.5?-1:1):(r()<.5?-2:2)),0,4);notes[i]=degree+1}}state.grid.Drift=notes;state.seed=(state.seed+1)>>>0;update()}
function initDaily(){state=starter('Best Friend');state.seed=dateId;state.progression=['Daydream','Slow Swirl','Nightswim','Electric Haze'][dateId%4];state.key=['D','F','G','A'][dateId%4];const r=rng(dateId,'daily');state.grid.Keys=Array.from({length:16},(_,i)=>r()<.35?1:0);state.grid.Lead=Array.from({length:16},(_,i)=>r()<.18?1:0);state.grid.Drift=Array.from({length:16},(_,i)=>i>11?0:r()<.36?1+Math.floor(r()*5):0)}
function loadUrl(){try{const p=new URLSearchParams(location.hash.slice(1));if(!p.has('s'))return false;const x=JSON.parse(decodeURIComponent(escape(atob(p.get('s').replace(/-/g,'+').replace(/_/g,'/')))));if(!x.grid||!LAYERS.every(l=>Array.isArray(x.grid[l])&&x.grid[l].length===16))return false;state={...state,...x};return true}catch{return false}}
const save=()=>{const s=btoa(unescape(encodeURIComponent(JSON.stringify(state)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');history.replaceState(null,'','#s='+s)};
const noteName=n=>{const names=['c','cs','d','ds','e','f','fs','g','gs','a','as','b'];return names[((n%12)+12)%12]+Math.floor(n/12-1)};
const scale=()=>state.key.includes('dorian')?dorian:major;
function chordNotes(pass){const p=progression[state.progression],item=p[pass%p.length],base=roots[state.key]+scale()[item[0]],kind=item[1];let ints=kind==='maj7'?[0,4,7,11]:kind==='min7'?[0,3,7,10]:kind==='maj9'?[0,4,7,11,14]:kind==='add9'?[0,4,7,14]:[0,5,7,10];return ints.map(n=>base+n-12)}
const sequence=(events)=>`[${events.join(' ')}]`;
function compile(){const r=rng(state.seed,'humanize'),h=state.haze/100,w=state.wobble/100;const parts=[];const layers=state.grid;const passes=state.progression==='Free'?1:4;
for(const layer of LAYERS){let patterns=[];for(let pass=0;pass<passes;pass++){const chord=chordNotes(pass),root=chord[0],events=[];for(let i=0;i<16;i++){let val=layers[layer][i];if(!val){events.push('~');continue}let n=root;if(layer==='Pad'){n=chord.map(noteName).join(',');events.push(`\"<${n.split(',').join(' ')}>\"`);continue}
if(layer==='Keys')n=chord[(i+Math.floor(i/4))%chord.length]+12;
if(layer==='Bass')n=root-12+(i%4===3?7:0);
if(layer==='Lead')n=roots[state.key]+12+scale()[(i*3+pass)%7];
if(layer==='Drift'){const pent=[0,1,2,4,5];n=roots[state.key]+12+scale()[pent[(val-1)%5]]}
if(['Kick','Snare','Hat'].includes(layer)){events.push('x');continue}
const human=layer==='Lead'&&i!==0?(r()-.5)*.12:0;events.push(noteName(n)+(human?`@${(1+human).toFixed(3)}`:''))}patterns.push(sequence(events))}
let pat=passes===1?patterns[0]:`cat(${patterns.map(p=>`note(\"${p}\")`).join(', ')})`;
if(layer==='Pad'){ // chord events use Strudel chord brackets per step
pat=passes===1?`note(\"${patterns[0]}\")`:`cat(${patterns.map(p=>`note(\"${p}\")`).join(', ')})`;
}else if(!['Kick','Snare','Hat'].includes(layer)){pat=passes===1?`note(\"${patterns[0]}\")`:`cat(${patterns.map(p=>`note(\"${p}\")`).join(', ')})`}
else{const drum=layer==='Kick'?'bd':layer==='Snare'?'sd':'hh';pat=passes===1?`s(\"${patterns[0].replaceAll('x',drum)}\")`:`cat(${patterns.map(p=>`s(\"${p.replaceAll('x',drum)}\")`).join(', ')})`}
const common=`.slow(4).gain(${({Pad:.18,Keys:.22,Bass:.28,Kick:.35,Snare:.13,Hat:.085,Lead:.13,Drift:.10})[layer]})`;
let fx='';if(layer==='Pad')fx=`.sound(\"triangle\").attack(${(.35+h*.95).toFixed(2)}).release(2.5).room(${(.3+h*.6).toFixed(2)}).delay(${(.08+h*.3).toFixed(2)}).delaytime(.375)`;
if(layer==='Keys')fx=`.sound(\"triangle\").attack(.04).release(1.2).room(${(.2+h*.6).toFixed(2)}).delay(${(.08+h*.3).toFixed(2)}).delaytime(.375)`;
if(layer==='Bass')fx='.sound("sine").attack(.02).release(.4).lpf(320)';
if(layer==='Lead'||layer==='Drift')fx=`.sound(\"sine\").attack(.12).release(1.1).room(${(.3+h*.6).toFixed(2)}).vib(${(2+w*4).toFixed(2)}).vibmod(${(w*.008).toFixed(4)})`;
if(layer==='Kick')fx='.lpf(700)';if(layer==='Snare')fx='.lpf(2600)';if(layer==='Hat')fx='.hpf(500).lpf(4500)';
parts.push(`  ${pat}${common}${fx}.lpf(${Math.round(10500-h*6500)})`)}
// All passes take 4 cycles of the 16-step pattern. The .slow(4) above applies per pattern,
// so cat(...) is intentionally slowed again to make each progression chord last one full bar.
code=`// DREAMLOOP · seed ${state.seed}\nsetcpm(${state.tempo/4});\nstack(\n${parts.join(',\n')}\n).swing(${(state.swing/100).toFixed(2)})`;
$('code').textContent=code}
function render(){for(const id of ['progression','key','tempo','haze','swing','wobble'])$(id).value=state[id];for(const id of ['tempo','haze','swing','wobble'])$(id+'Out').textContent=state[id]+(id==='tempo'?'':'%');$('seedLabel').textContent=state.seed===dateId?`daily, ${today.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`:`seed ${state.seed}`;const grid=$('grid');grid.replaceChildren();const head=document.createElement('span');grid.append(head);for(let i=0;i<16;i++){const b=document.createElement('span');b.className='beat';b.textContent=i%4===0?String(i/4+1):'·';b.dataset.step=i;grid.append(b)}for(const layer of LAYERS){const label=document.createElement('span');label.className='layer';label.textContent=layer;grid.append(label);for(let i=0;i<16;i++){const b=document.createElement('button');b.className='cell'+(state.grid[layer][i]?' on':'')+(layer==='Drift'&&state.grid[layer][i]?' ghost':'');b.setAttribute('aria-label',`${layer} step ${i+1}`);b.dataset.step=i;b.onclick=()=>{state.grid[layer][i]=state.grid[layer][i]?0:layer==='Drift'?1+((i+state.seed)%5):1;update()};grid.append(b)}}compile();$('chord').textContent=progression[state.progression][Math.floor(step/16)%progression[state.progression].length][2];}
function update(){render();save();if(playing)restart()}
let strudel=null;async function getEngine(){if(strudel)return strudel;try{const m=await import(`https://cdn.jsdelivr.net/npm/@strudel/web@${VERSION}/+esm`);strudel=m;return m}catch(e){$('status').textContent='Audio unavailable';throw e}}
async function start(){try{const m=await getEngine();if(typeof m.initStrudel==='function')await m.initStrudel();if(typeof m.evaluate==='function')await m.evaluate(code);else throw Error('Strudel evaluate unavailable');playing=true;$('play').textContent='Pause';clearInterval(clock);const ms=60000/state.tempo/4;clock=setInterval(()=>{document.querySelectorAll('.playing,.current').forEach(e=>e.classList.remove('playing','current'));document.querySelectorAll(`.cell[data-step="${step%16}"]`).forEach(e=>e.classList.add('playing'));const b=document.querySelector(`.beat[data-step="${step%16}"]`);b?.classList.add('current');$('chord').textContent=progression[state.progression][Math.floor(step/16)%progression[state.progression].length][2];step=(step+1)%64},ms);$('status').textContent=''}catch(e){console.error(e);$('status').textContent='Audio unavailable · see console'}}
function stop(){playing=false;strudel?.hush?.();clearInterval(clock);$('play').textContent='Play';document.querySelectorAll('.playing,.current').forEach(e=>e.classList.remove('playing','current'))}function restart(){stop();start()}
$('play').onclick=()=>playing?stop():start();document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','SELECT','BUTTON','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('play').click()}});for(const id of ['progression','key','tempo','haze','swing','wobble'])$(id).oninput=e=>{state[id]=['tempo','haze','swing','wobble'].includes(id)?Number(e.target.value):e.target.value;update()};$('drift').onclick=drift;document.querySelectorAll('[data-starter]').forEach(b=>b.onclick=()=>{state=starter(b.dataset.starter);step=0;update()});$('copy').onclick=async()=>{await navigator.clipboard.writeText(code);$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy',1300)};$('share').onclick=async()=>{save();await navigator.clipboard.writeText(location.href);$('share').textContent='Copied';setTimeout(()=>$('share').textContent='Share',1300)};if(!loadUrl())initDaily();render();save();
</script></html>
